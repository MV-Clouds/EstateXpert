<template>
    <div class="checklist-main-container">
        <!-- Header: title + buttons -->
        <div class="sub-main-header-css">
            <div class="header-block-css">
                Listing Checklist
            </div>
            <div class="header-buttons">
                <button class="exp-blue-btn-css" onclick={refreshTable} aria-label="Refresh">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
                    </svg>
                    <template if:false={isMobileOrTablet}>Refresh</template>
                </button>
                <template if:true={checklistEditable}>
                    <button class="exp-blue-btn-css" onclick={handleShowEditModal} aria-label={buttonLabel}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 15.5C10.07 15.5 8.5 13.93 8.5 12C8.5 10.07 10.07 8.5 12 8.5C13.93 8.5 15.5 10.07 15.5 12C15.5 13.93 13.93 15.5 12 15.5ZM19.43 12.97C19.47 12.65 19.5 12.33 19.5 12C19.5 11.67 19.47 11.34 19.43 11L21.54 9.37C21.73 9.22 21.78 8.95 21.66 8.73L19.66 5.27C19.54 5.05 19.27 4.96 19.05 5.05L16.56 6.05C16.04 5.66 15.5 5.32 14.87 5.07L14.5 2.42C14.46 2.18 14.25 2 14 2H10C9.75 2 9.54 2.18 9.5 2.42L9.13 5.07C8.5 5.32 7.96 5.67 7.44 6.05L4.95 5.05C4.73 4.96 4.46 5.05 4.34 5.27L2.34 8.73C2.21 8.95 2.27 9.22 2.46 9.37L4.57 11C4.53 11.34 4.5 11.67 4.5 12C4.5 12.33 4.53 12.65 4.57 12.97L2.46 14.63C2.27 14.78 2.21 15.05 2.34 15.27L4.34 18.73C4.46 18.95 4.73 19.03 4.95 18.95L7.44 17.94C7.96 18.34 8.5 18.68 9.13 18.93L9.5 21.58C9.54 21.82 9.75 22 10 22H14C14.25 22 14.46 21.82 14.5 21.58L14.87 18.93C15.5 18.67 16.04 18.33 16.56 17.94L19.05 18.95C19.27 19.03 19.54 18.95 19.66 18.73L21.66 15.27C21.78 15.05 21.73 14.78 21.54 14.63L19.43 12.97Z"
                                fill="white" />
                        </svg>
                        <template if:false={isMobileOrTablet}>{buttonLabel}</template>
                    </button>
                </template>
            </div>
        </div>

        <!-- Content -->
        <template if:true={isDataAvailable}>
            <div class="checklist-content columns-container">
                <!-- Progress Banner -->
                <div class="progress-banner">
                    <!-- Circular Gauge -->
                    <div class="progress-gauge">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" stroke-dasharray={progressDashArray}
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="gauge-center-text">
                            <span class="gauge-ratio">{completedCount}/{totalCount}</span>
                            <span class="gauge-label">COMPLETE</span>
                        </div>
                    </div>

                    <!-- Progress Details -->
                    <div class="progress-details">
                        <div class="progress-title">Checklist Progress</div>
                        <div class="progress-subtitle">
                            {progressPercentage}% done &middot; {pendingCount} pending &middot; {completedCount}
                            completed
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style={progressBarStyle}></div>
                        </div>
                    </div>
                </div>

                <!-- PENDING Section -->
                <div class="section pending-section">
                    <div class="section-header">
                        <span class="section-dot dot-pending"></span>
                        <span class="section-title">Pending</span>
                        <span class="section-badge">{pendingCount}</span>
                    </div>
                    <template if:true={hasPendingItems}>
                        <div class="cards-grid">
                            <template for:each={pendingItems} for:item="item">
                                <div key={item.id} class="checklist-card">
                                    <div class="card-top-row">
                                        <div class="card-left">
                                            <template if:true={item.fieldName}>
                                                <input type="checkbox" class="custom-checkbox"
                                                    checked={item.completed} />
                                            </template>
                                            <template if:false={item.fieldName}>
                                                <input type="checkbox" data-id={item.id} data-fieldname={item.fieldName}
                                                    checked={item.completed} onchange={handleCheckboxChange} />
                                            </template>
                                            <span class="card-name" title={item.name}>{item.name}</span>
                                        </div>
                                        <div class="card-badges">
                                            <template if:true={item.fieldName}>
                                                <span class="badge badge-auto">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11"
                                                        viewBox="0 0 24 24">
                                                        <title>magic-line</title>
                                                        <path fill="currentColor"
                                                            d="M15.199 9.944a2.6 2.6 0 0 1-.79-1.55l-.403-3.083l-2.731 1.486a2.6 2.6 0 0 1-1.719.272L6.5 6.5l.57 3.056a2.6 2.6 0 0 1-.273 1.72l-1.486 2.73l3.083.403a2.6 2.6 0 0 1 1.55.79l2.138 2.257l1.336-2.807a2.6 2.6 0 0 1 1.23-1.231l2.808-1.336zm.025 5.564l-2.213 4.65a.6.6 0 0 1-.977.155l-3.542-3.739a.6.6 0 0 0-.358-.182l-5.106-.668a.6.6 0 0 1-.45-.881l2.462-4.524a.6.6 0 0 0 .063-.396L4.16 4.86a.6.6 0 0 1 .7-.7l5.062.943a.6.6 0 0 0 .397-.063l4.523-2.46a.6.6 0 0 1 .882.448l.668 5.107a.6.6 0 0 0 .182.357l3.739 3.542a.6.6 0 0 1-.155.977l-4.65 2.213a.6.6 0 0 0-.284.284m.797 1.927l1.414-1.414l4.243 4.242l-1.415 1.415z" />
                                                    </svg>
                                                    AUTO-SELECTED
                                                </span>
                                            </template>
                                            <template if:false={item.fieldName}>
                                                <span class="badge badge-user">
                                                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                                        stroke-linejoin="round">
                                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                                        <circle cx="12" cy="7" r="4" />
                                                    </svg>
                                                    USER-SELECTED
                                                </span>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Condition row: always show when fieldName exists -->
                                    <template if:true={item.fieldName}>
                                        <div class="card-condition" title={item.conditionTooltip}>
                                            <span class="cond-label">Condition:</span>
                                            {item.fieldLabel} should {item.operator}
                                            <template if:true={item.isToRequired}> to </template>
                                            &nbsp;{item.displayValueToShow}
                                        </div>
                                    </template>
                                    <!-- No-condition note: show when no fieldName -->
                                    <template if:false={item.fieldName}>
                                        <div class="card-condition no-condition" title={item.conditionTooltip}>
                                            There is no condition defined for completion.
                                        </div>
                                    </template>
                                    <!-- Description: always show when present, regardless of condition -->
                                    <template if:true={item.isDescription}>
                                        <div class="card-condition card-description" title={item.description}>
                                            <span class="cond-label">Description:</span>
                                            {item.description}
                                        </div>
                                    </template>

                                    <!-- Status row -->
                                    <div class="card-status-row">
                                        <span class="status-dot dot-pending"></span>
                                        <span class="status-label">{item.statusText}</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template if:false={hasPendingItems}>
                        <div class="empty-section-card">
                            <div class="empty-section-icon pending-empty">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0070d2"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
                                    <path d="m9 12 2 2 4-4" />
                                </svg>
                            </div>
                            <div class="empty-section-content">
                                <div class="empty-section-title">All Caught Up!</div>
                                <div class="empty-section-subtitle">No pending checklist items remaining.</div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- COMPLETED Section -->
                <div class="section completed-section">
                    <div class="section-header">
                        <span class="section-dot dot-completed"></span>
                        <span class="section-title">Completed</span>
                        <span class="section-badge">{completedCount}</span>
                    </div>
                    <template if:true={hasCompletedItems}>
                        <div class="cards-grid">
                            <template for:each={completedItems} for:item="item">
                                <div key={item.id} class="checklist-card card-completed">
                                    <div class="card-top-row">
                                        <div class="card-left">
                                            <template if:true={item.fieldName}>
                                                <input type="checkbox" class="custom-checkbox"
                                                    checked={item.completed} />
                                            </template>
                                            <template if:false={item.fieldName}>
                                                <input type="checkbox" data-id={item.id} data-fieldname={item.fieldName}
                                                    checked={item.completed} onchange={handleCheckboxChange} />
                                            </template>
                                            <span class="card-name" title={item.name}>{item.name}</span>
                                        </div>
                                        <div class="card-badges">
                                            <template if:true={item.fieldName}>
                                                <span class="badge badge-auto">
                                                    <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
                                                        <path
                                                            d="M12 15.5C13.933 15.5 15.5 13.933 15.5 12C15.5 10.067 13.933 8.5 12 8.5C10.067 8.5 8.5 10.067 8.5 12C8.5 13.933 10.067 15.5 12 15.5Z" />
                                                        <path fill-rule="evenodd" clip-rule="evenodd"
                                                            d="M9.956 2.457a1.75 1.75 0 0 1 2.088 0l.974.707a1.75 1.75 0 0 0 1.542.235l1.16-.412a1.75 1.75 0 0 1 2.052.747l.613 1.062a1.75 1.75 0 0 0 1.341.831l1.229.076a1.75 1.75 0 0 1 1.637 1.488l.182 1.218a1.75 1.75 0 0 0 .866 1.319l1.08.636a1.75 1.75 0 0 1 .792 2.035l-.412 1.16a1.75 1.75 0 0 0 .235 1.542l.707.974a1.75 1.75 0 0 1 0 2.088l-.707.974a1.75 1.75 0 0 0-.235 1.542l.412 1.16a1.75 1.75 0 0 1-.792 2.035l-1.08.636a1.75 1.75 0 0 0-.866 1.319l-.182 1.218a1.75 1.75 0 0 1 1.637 1.488l-1.229.076a1.75 1.75 0 0 0-1.341.831l-.613 1.062a1.75 1.75 0 0 1-2.052.747l-1.16-.412a1.75 1.75 0 0 0-1.542.235l-.974.707a1.75 1.75 0 0 1-2.088 0l-.974-.707a1.75 1.75 0 0 0-1.542-.235l-1.16.412a1.75 1.75 0 0 1-2.052-.747l-.613-1.062a1.75 1.75 0 0 0-1.341-.831l-1.229-.076a1.75 1.75 0 0 1-1.637-1.488l-.182-1.218a1.75 1.75 0 0 0-.866-1.319l-1.08-.636a1.75 1.75 0 0 1-.792-2.035l.412-1.16a1.75 1.75 0 0 0-.235-1.542l-.707-.974a1.75 1.75 0 0 1 0-2.088l.707-.974a1.75 1.75 0 0 0 .235-1.542l-.412-1.16a1.75 1.75 0 0 1 .792-2.035l1.08-.636a1.75 1.75 0 0 0 .866-1.319l.182-1.218a1.75 1.75 0 0 1 1.637-1.488l1.229-.076a1.75 1.75 0 0 0 1.341-.831l.613-1.062a1.75 1.75 0 0 1 2.052-.747l1.16.412a1.75 1.75 0 0 0 1.542-.235l.974-.707ZM12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />
                                                    </svg>
                                                    AUTO-SELECTED
                                                </span>
                                            </template>
                                            <template if:false={item.fieldName}>
                                                <span class="badge badge-user">
                                                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                                        stroke-linejoin="round">
                                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                                        <circle cx="12" cy="7" r="4" />
                                                    </svg>
                                                    USER-SELECTED
                                                </span>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Condition row: always show when fieldName exists -->
                                    <template if:true={item.fieldName}>
                                        <div class="card-condition" title={item.conditionTooltip}>
                                            <span class="cond-label">Condition:</span>
                                            {item.fieldLabel} should {item.operator}
                                            <template if:true={item.isToRequired}> to </template>
                                            &nbsp;{item.displayValueToShow}
                                        </div>
                                    </template>
                                    <!-- No-condition note: show when no fieldName -->
                                    <template if:false={item.fieldName}>
                                        <div class="card-condition no-condition" title={item.conditionTooltip}>
                                            There is no condition defined for completion.
                                        </div>
                                    </template>
                                    <!-- Description: always show when present, regardless of condition -->
                                    <template if:true={item.isDescription}>
                                        <div class="card-condition card-description" title={item.description}>
                                            <span class="cond-label">Description:</span>
                                            {item.description}
                                        </div>
                                    </template>

                                    <!-- Status row -->
                                    <div class="card-status-row">
                                        <span class="status-dot dot-completed"></span>
                                        <span class="status-label">{item.statusText}</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template if:false={hasCompletedItems}>
                        <div class="empty-section-card">
                            <div class="empty-section-icon completed-empty">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10b981"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10" />
                                    <polyline points="12 6 12 12 14 14" />
                                </svg>
                            </div>
                            <div class="empty-section-content">
                                <div class="empty-section-title">No Completed Items</div>
                                <div class="empty-section-subtitle">Complete items from Pending to see them here.</div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Empty state -->
        <template if:false={isDataAvailable}>
            <div class="exp-no-data-container">
                <img src="/resource/MVEX__emptyState" alt="" draggable="false">
                <div class="exp-no-data-message">No Checklist available for this object, please create a checklist
                    first.</div>
            </div>
        </template>
    </div>

    <lightning-layout>
        <template if:true={showEditModal}>
            <c-edit-check-list-modal onhidepopup={handleHideEditPopup}
                onhidepopupandrefresh={handleHideEditPopupAndRefresh} object-name={objectName} record-id={recordId}>
            </c-edit-check-list-modal>
        </template>
    </lightning-layout>

    <template if:true={isSpinner}>
        <c-spinner-component></c-spinner-component>
    </template>
</template>
