<!--
  description       : Display inquiry component to display all the properties
  author            : Rachit Shah
  last modified on  : 06-19-2024
-->
<template>

    <template if:true={isLoading}>
        <c-spinner-component></c-spinner-component>
    </template>

    <div class="main-card">

        <div class="filter-search-container">
            <div class="filter-section">
                <div class="search-bar">
                    <lightning-input variant="label-hidden" type="search" placeholder="Search Inquiry Name"
                        value={searchTerm} onchange={handleSearch} class="search-bar-input"></lightning-input>
                </div>

                <div class="open-mapping-div" onclick={handleInsideClick}>

                    <div class="btn-container">
                        <template if:true={isConfigOpen}>
                            <c-record-config-body-cmp feature-name="Suggested_Inquiry_Fields"
                                onclose={handleCloseModal}></c-record-config-body-cmp>
                        </template>

                        <button class="blue-btn-css" onclick={handleRefresh} title="Refresh">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M17.65 6.35C16.2 4.9 14.21 4 12 4C7.58 4 4.01 7.58 4.01 12C4.01 16.42 7.58 20 12 20C15.73 20 18.84 17.45 19.73 14H17.65C16.83 16.33 14.61 18 12 18C8.69 18 6 15.31 6 12C6 8.69 8.69 6 12 6C13.66 6 15.14 6.69 16.22 7.78L13 11H20V4L17.65 6.35Z"
                                    fill="white" />
                            </svg>
                            <template if:false={isMobileOrTablet}>Refresh</template>
                        </button>

                        <button class="blue-btn-css" onclick={goToNewInquiry}>
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 6.75H6.75V12H5.25V6.75H0V5.25H5.25V0H6.75V5.25H12V6.75Z" fill="white" />
                            </svg>
                            New Inquiry
                        </button>

                        <button class="blue-btn-css" onclick={showModalBox} aria-label="Filters">
                            <svg width="18px" height="18px" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M3 7C3 6.44772 3.44772 6 4 6H20C20.5523 6 21 6.44772 21 7C21 7.55228 20.5523 8 20 8H4C3.44772 8 3 7.55228 3 7ZM6 12C6 11.4477 6.44772 11 7 11H17C17.5523 11 18 11.4477 18 12C18 12.5523 17.5523 13 17 13H7C6.44772 13 6 12.5523 6 12ZM9 17C9 16.4477 9.44772 16 10 16H14C14.5523 16 15 16.4477 15 17C15 17.5523 14.5523 18 14 18H10C9.44772 18 9 17.5523 9 17Z"
                                    fill="white" />
                            </svg><template if:false={isMobileOrTablet}>Filters</template>
                        </button>

                        <div class="custom-dropdown-container" style="position: relative;">
                            <button class="blue-btn-css" onclick={toggleMoreActions}>
                                <svg width="18px" height="18px" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z"
                                        fill="white" />
                                    <path
                                        d="M5 15C6.65685 15 8 13.6569 8 12C8 10.3431 6.65685 9 5 9C3.34315 9 2 10.3431 2 12C2 13.6569 3.34315 15 5 15Z"
                                        fill="white" />
                                    <path
                                        d="M19 15C20.6569 15 22 13.6569 22 12C22 10.3431 20.6569 9 19 9C17.3431 9 16 10.3431 16 12C16 13.6569 17.3431 15 19 15Z"
                                        fill="white" />
                                </svg>
                            </button>

                            <template if:true={showMoreActions}>
                                <div class="custom-dropdown-menu"
                                    style="position: absolute; right: 0; top: calc(100% + 5px); background: #ffffff; border-radius: 4px; box-shadow: rgba(0, 0, 0, 0.16) 0px 3px 6px, rgba(0, 0, 0, 0.23) 0px 3px 6px; display: flex; flex-direction: column; gap: 8px; padding: 10px; z-index: 97; min-width: 200px; border: 1px solid #e5e7eb;">
                                    <button class="blue-btn-css" onclick={openConfigureSettings}
                                        style="width: 100%; justify-content: flex-start;"><svg fill="white"
                                            height="18px" width="18px" version="1.1" viewBox="0 0 512.003 512.003">
                                            <g>
                                                <path d="M491.584,192.579l-55.918-6.914c-0.919-2.351-1.884-4.682-2.892-6.993l34.648-44.428

                                                    c-2.312-1.008-4.644-1.974-6.994-2.894l-6.915-55.904c-1.443-11.66-11.348-20.415-23.097-20.415h-80.637
                                                    c-11.748,0-21.656,8.755-23.097,20.416l-6.914,55.904c-2.349,0.919-4.681,1.884-6.988,2.89l-44.415-34.642

                                                <path d="M255.997,155.153c-55.606,0-100.845,45.244-100.845,100.856c0,55.603,45.239,100.839,100.845,100.839
                                                    c55.609,0,100.852-45.236,100.852-100.839C356.849,200.397,311.606,155.153,255.997,155.153z M255.997,310.303
                                                    c-29.941,0-54.3-24.356-54.3-54.294c0-29.947,24.359-54.311,54.3-54.311c29.944,0,54.306,24.363,54.306,54.311
                                                    C310.303,285.947,285.941,310.303,255.997,310.303z" />
                                            </g>
                                        </svg>Customize View
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <template if:true={isShowModal}>
                        <div class="filter-div">
                            <div class="filter-fields">
                                <div class="filter-header">
                                    Filter Inquiries
                                </div>
                                <div class="scroll-div">
                                    <div class="condition-type-wrapper">
                                        <div class="slds-form_element slds-m-bottom_medium condition-type-field">
                                            <lightning-combobox name="conditionType" label="Condition Type"
                                                value={conditiontype} options={conditionOptions}
                                                onchange={handleConditionTypeChange}>
                                            </lightning-combobox>
                                        </div>
                                        <template if:true={showAddConditionIcon}>
                                            <button class="add-condition-icon-btn" onclick={addCondition}
                                                disabled={isAddConditionDisabled} title={addConditionTitle}>
                                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                                    xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="2.5"
                                                        stroke-linecap="round" />
                                                </svg>
                                            </button>
                                        </template>
                                    </div>

                                    <template if:true={isCustomLogicSelected}>
                                        <div class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                            <label><span class="required-class">*</span>Logical Expression</label>
                                            <lightning-input variant="label-hidden" data-id="condition-input"
                                                value={logicalExpression} onchange={handleLogicalExpressionChange}
                                                placeholder="Enter logical expression">
                                            </lightning-input>
                                        </div>
                                    </template>

                                    <div class="slds-m-top_medium">
                                        <template if:false={mappings.length}>
                                            <p class="slds-text-align_center slds-text-color_weak slds-p-around_medium">
                                                No filters applied for this object.</p>
                                        </template>

                                        <template for:each={mappings} for:item="mapping">


                                            <div key={mapping.id} class="parent-div">
                                                <div class={mappingClass} onclick={handleMappingClick}
                                                    data-id={mapping.id} data-name="mapping-box">
                                                    <span class="mapping-id">{mapping.id}</span>

                                                    <div class="mapping-data">
                                                        {mapping.label} <br>
                                                        {mapping.displayOperator} " {mapping.displayValue} "
                                                    </div>
                                                    <div class="delete-div" title="Delete" data-id={mapping.id}
                                                        onclick={handleDeleteMapping} data-name="delete">
                                                        <!-- <lightning-icon icon-name="utility:delete"  data-id={mapping.id} alternative-text="delete" size="small"></lightning-icon> -->
                                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                                            xmlns="http://www.w3.org/2000/svg" data-id={mapping.id}>
                                                            <path d="M3 6H5H21" stroke="#A30D11" stroke-width="2"
                                                                stroke-linecap="round" stroke-linejoin="round" />
                                                            <path
                                                                d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z"
                                                                stroke="#A30D11" stroke-width="2" stroke-linecap="round"
                                                                stroke-linejoin="round" />
                                                            <path d="M10 11V17" stroke="#A30D11" stroke-width="2"
                                                                stroke-linecap="round" stroke-linejoin="round" />
                                                            <path d="M14 11V17" stroke="#A30D11" stroke-width="2"
                                                                stroke-linecap="round" stroke-linejoin="round" />
                                                        </svg>

                                                        <span class="slds-assistive-text">Delete</span>
                                                    </div>
                                                </div>

                                            </div>
                                        </template>
                                    </div>
                                </div>

                            </div>
                            <div class="filter-footer">
                                <div class="add-condtion">
                                    <template if:true={isAddConditionModalVisible}>
                                        <div class="condition-div">
                                            <div class="filter-header">
                                                Configure Condition
                                            </div>
                                            <div class="condition-div-body">
                                                <div class="slds-form_element slds-m-bottom_medium">
                                                    <lightning-combobox name="inquiryField" label="Inquiry Field"
                                                        value={inquiryFieldObject.MVEX__Field_Name__c}
                                                        options={inquirypicklistoptions}
                                                        onchange={handleInquiryFieldChange} required>
                                                    </lightning-combobox>
                                                </div>

                                                <div class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                    <lightning-combobox name="conditionOperator" label="Condition"
                                                        value={selectedConditionOperator}
                                                        options={conditionOperatorOptions}
                                                        onchange={handleConditionOperatorChange} required>
                                                    </lightning-combobox>
                                                </div>

                                                <div class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                    <template if:false={isNullOperatorSelected}>
                                                        <lightning-input type="checkbox" label="Use Constant Value"
                                                            checked={isConstant} onchange={handleUseConstantChange}>
                                                        </lightning-input>
                                                    </template>
                                                </div>

                                                <template if:true={isNullOperatorSelected}>
                                                    <div
                                                        class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                        <label><span class="red">*</span>Value</label>
                                                        <lightning-combobox value={selectedListingField}
                                                            data-field="MVEX__Value__c" options={isNullPicklistOptions}
                                                            onchange={handleListingFieldChange} variant="label-hidden"
                                                            placeholder="Select True or False">
                                                        </lightning-combobox>
                                                    </div>
                                                </template>

                                                <template if:false={isNullOperatorSelected}>
                                                    <template if:true={isConstant}>
                                                        <div
                                                            class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                            <label><span class="red">*</span>Value</label>
                                                            <template if:true={inquiryFieldObject.isPrimary}>
                                                                <lightning-input
                                                                    type={inquiryFieldObject.MVEX__Data_Type__c}
                                                                    value={selectedListingField}
                                                                    data-field="MVEX__Value__c"
                                                                    onchange={handleListingFieldChange}
                                                                    variant="label-hidden"></lightning-input>
                                                            </template>
                                                            <template if:true={inquiryFieldObject.isPicklist}>
                                                                <lightning-combobox value={selectedListingField}
                                                                    data-field="MVEX__Value__c"
                                                                    options={inquiryFieldObject.picklistValues}
                                                                    onchange={handleListingFieldChange}
                                                                    variant="label-hidden"></lightning-combobox>
                                                            </template>
                                                            <template if:true={inquiryFieldObject.isReference}>
                                                                <lightning-record-picker value={selectedListingField}
                                                                    label="Reference" data-field="MVEX__Value__c"
                                                                    object-api-name={inquiryFieldObject.objectApiName}
                                                                    onchange={handleRefChange}
                                                                    variant="label-hidden"></lightning-record-picker>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <template if:false={isConstant}>
                                                        <div
                                                            class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                            <lightning-combobox name="listingField"
                                                                label="Listing Field" value={selectedListingField}
                                                                options={listingFieldOptions}
                                                                onchange={handleListingFieldChange} required>
                                                            </lightning-combobox>
                                                        </div>
                                                    </template>
                                                </template>
                                            </div>
                                            <div class="condition-div-footer">
                                                <button class="white-btn-css" onclick={closeAddConditionModal}>
                                                    <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                                                        xmlns="http://www.w3.org/2000/svg">
                                                        <path
                                                            d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                                            fill="currentColor" />
                                                    </svg>
                                                    Cancel
                                                </button>
                                                <button class="blue-btn-css" onclick={saveCondition}>
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                                        xmlns="http://www.w3.org/2000/svg">
                                                        <path
                                                            d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                                            fill="currentColor" />
                                                    </svg>
                                                    Save
                                                </button>
                                            </div>
                                            <div class="arrow"></div>
                                        </div>
                                    </template>
                                </div>
                                <div class="custom__footer">
                                    <button class="white-btn-css" onclick={hideModalBox}>
                                        <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                                fill="currentColor" />
                                        </svg>
                                        Cancel
                                    </button>
                                    <button class="blue-btn-css" onclick={applyModalFilters}
                                        disabled={isApplyButtonDisabled}>
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                                fill="currentColor" />
                                        </svg>
                                        Apply
                                    </button>
                                </div>
                            </div>
                        </div>

                    </template>
                </div>
            </div>
        </div>

        <div class="main_content_cls">
            <template if:true={pagedInquries.length}>
                <div class="table-content" id="table-content">
                    <table aria-multiselectable="true" class="slds-table"
                        aria-label="Example advanced table of Opportunities in actionable mode">
                        <thead>
                            <tr class="slds-line-height_reset fields-names table_tr_cls">
                                <th class="header-cell slds-text-align_right slds-cell_action-mode colume1" scope="col">
                                    <span id="column-group-header" class="slds-assistive-text">Choose a row</span>
                                    <div class="header-checkbox-div">
                                        <label class="custom-checkbox">
                                            <input type="checkbox" onchange={selectAllCheckbox} checked={checkAll}>
                                            <span class="checkmark"></span>
                                        </label>
                                    </div>
                                </th>


                                <th class="slds-is-resizable slds-is-sortable slds-cell_action-mode header-cell slds-truncate sorting_header"
                                    data-id="name" onclick={sortClick}>
                                    <div class="slds-text-link_rese sort-cover slds-has-flexi-truncate" role="button"
                                        tabindex="0">
                                        Inquiry Name
                                        <span class="slds-icon_container slds-icon-utility-arrowdown">
                                            <svg class="listing-manager-icon" aria-hidden="true" viewBox="0 0 384 512">
                                                <path
                                                    d="M374.6 246.6C368.4 252.9 360.2 256 352 256s-16.38-3.125-22.62-9.375L224 141.3V448c0 17.69-14.33 31.1-31.1 31.1S160 465.7 160 448V141.3L54.63 246.6c-12.5 12.5-32.75 12.5-45.25 0s-12.5-32.75 0-45.25l160-160c12.5-12.5 32.75-12.5 45.25 0l160 160C387.1 213.9 387.1 234.1 374.6 246.6z" />
                                            </svg>
                                        </span>
                                    </div>
                                </th>
                                <th class="slds-is-resizable slds-is-sortable slds-cell_action-mode header-cell slds-truncate sorting_header"
                                    data-id="contactname" onclick={sortClick}>
                                    <div class="slds-text-link_rese sort-cover slds-has-flexi-truncate" role="button"
                                        tabindex="0">
                                        Contact Name
                                        <span class="slds-icon_container slds-icon-utility-arrowdown">
                                            <svg class="listing-manager-icon" aria-hidden="true" viewBox="0 0 384 512">
                                                <path
                                                    d="M374.6 246.6C368.4 252.9 360.2 256 352 256s-16.38-3.125-22.62-9.375L224 141.3V448c0 17.69-14.33 31.1-31.1 31.1S160 465.7 160 448V141.3L54.63 246.6c-12.5 12.5-32.75 12.5-45.25 0s-12.5-32.75 0-45.25l160-160c12.5-12.5 32.75-12.5 45.25 0l160 160C387.1 213.9 387.1 234.1 374.6 246.6z" />
                                            </svg>
                                        </span>
                                    </div>
                                </th>
                                <template for:each={tableColumns} for:item="column">
                                    <th key={column.fieldName}
                                        class="slds-is-resizable slds-is-sortable slds-cell_action-mode header-cell slds-truncate sorting_header column2"
                                        data-id={column.fieldName} onclick={sortClick}>
                                        <div class="slds-text-link_rese sort-cover slds-has-flexi-truncate"
                                            role="button" tabindex="0">
                                            {column.label}
                                            <span class="slds-icon_container slds-icon-utility-arrowdown">
                                                <svg class="listing-manager-icon" aria-hidden="true"
                                                    viewBox="0 0 384 512">
                                                    <path
                                                        d="M374.6 246.6C368.4 252.9 360.2 256 352 256s-16.38-3.125-22.62-9.375L224 141.3V448c0 17.69-14.33 31.1-31.1 31.1S160 465.7 160 448V141.3L54.63 246.6c-12.5 12.5-32.75 12.5-45.25 0s-12.5-32.75 0-45.25l160-160c12.5-12.5 32.75-12.5 45.25 0l160 160C387.1 213.9 387.1 234.1 374.6 246.6z" />
                                                </svg>
                                            </span>
                                        </div>
                                    </th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={pagedInquries} for:item="inquiry">
                                <tr key={inquiry.id}>
                                    <td class="slds-text-align_right slds-cell_action-mode checkbox-cell"
                                        role="gridcell">
                                        <label class="custom-checkbox custom-checkbox-body">
                                            <input data-id={inquiry.id} type="checkbox" checked={inquiry.isSelected}
                                                value={inquiry.isSelected} onchange={checkBoxValueChange}>
                                            <span class="checkmark"></span>
                                        </label>
                                    </td>
                                    <td class="slds-truncate">
                                        <a href="javascript:void(0)" data-id={inquiry.id}
                                            onclick={navigateToRecord}>{inquiry.name}</a>
                                    </td>
                                    <td class="slds-truncate">
                                        <template if:true={inquiry.hasContact}>
                                            <a href="javascript:void(0)" data-id={inquiry.contactId}
                                                onclick={navigateToRecord}>{inquiry.contactName}</a>
                                        </template>
                                        <template if:false={inquiry.hasContact}>
                                            -
                                        </template>
                                    </td>
                                    <template for:each={inquiry.displayFields} for:item="field">
                                        <td key={field.key} class="slds-truncate">
                                            <template if:true={field.hasValue}>
                                                <template if:true={field.isNameField}>
                                                    <a href="javascript:void(0)" data-id={inquiry.id}
                                                        onclick={navigateToRecord}>{field.value}</a>
                                                </template>
                                                <template if:true={field.isReference}>
                                                    <a href="javascript:void(0)" data-id={field.recordId}
                                                        onclick={navigateToRecord}>{field.value}</a>
                                                </template>
                                                <template if:false={field.isNameField}>
                                                    <template if:false={field.isReference}>
                                                        <template if:true={field.isCurrency}>
                                                            {field.value}
                                                        </template>
                                                        <template if:false={field.isCurrency}>
                                                            {field.value}
                                                        </template>
                                                    </template>
                                                </template>
                                            </template>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template if:false={pagedInquries.length}>
                <div class="exp-no-data-container">
                    <img src="/resource/MVEX__emptyState" alt="" draggable="false">
                    <div class="exp-no-data-message">No Inquiry found. Please change your search filters and try again.</div>
                </div>
            </template>
            <template if:true={showPagination}>
                <div class="paginationDiv">
                    <div class="btnCover">
                        <div class="pagination-container">
                            <button class="pagination-btn-css" disabled={isFirstPage} onclick={handlePrevious}>
                                <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52" viewBox="0 0 520 520"
                                    fill="#fff">
                                    <path
                                        d="M342 477 134 272c-6-6-6-16 0-22L342 45c6-6 16-6 22 0l22 22c6 6 6 16 0 22L221 250c-6 6-6 16 0 22l163 161c6 6 6 16 0 22l-22 22c-5 5-14 5-20 0z" />
                                </svg>
                                Previous
                            </button>

                            <template for:each={pageNumbers} for:item="page">
                                <template if:false={page.isEllipsis}>
                                    <button key={page.number} data-id={page.number} class={page.className}
                                        onclick={handlePageChange}>
                                        {page.number}
                                    </button>
                                </template>
                                <template if:true={page.isEllipsis}>
                                    <span key={page.number} class="pagination-ellipsis">...</span>
                                </template>
                            </template>

                            <button class="pagination-btn-css" disabled={isLastPage} onclick={handleNext}>
                                Next
                                <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52" viewBox="0 0 520 520"
                                    fill="#fff">
                                    <path
                                        d="m179 44 207 205c6 6 6 16 0 22L179 476c-6 6-16 6-22 0l-22-22c-6-6-6-16 0-22l163-161c6-6 6-16 0-22L136 88c-6-6-6-16 0-22l22-22c6-5 15-5 21 0z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>



</template>
