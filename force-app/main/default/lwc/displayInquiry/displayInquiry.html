<!--
  description       : Display inquiry component to display all the properties
  author            : Rachit Shah
  last modified on  : 06-19-2024
-->
<template>

    <template if:true={isLoading}>
        <c-spinner-component></c-spinner-component>
    </template>

    <div class="inquiries-main-card">
        <div class="sub-main-header-css">
            <div class="header-block-css">
                Suggested Inquiries
            </div>
            <div class="header-buttons">
                <div class="open-mapping-div" onclick={handleInsideClick}>

                    <div class="btn-container">
                        <template if:true={isConfigOpen}>
                            <c-record-config-body-cmp feature-name="Suggested_Inquiry_Fields"
                                onclose={handleCloseModal}></c-record-config-body-cmp>
                        </template>

                        <button class="exp-blue-btn-css" onclick={goToNewInquiry}>
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 6.75H6.75V12H5.25V6.75H0V5.25H5.25V0H6.75V5.25H12V6.75Z" fill="white" />
                            </svg>
                            New Inquiry
                        </button>

                        <button class="exp-blue-btn-css" onclick={openConfigureSettings} title="Customize View">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M12 15.5C10.07 15.5 8.5 13.93 8.5 12C8.5 10.07 10.07 8.5 12 8.5C13.93 8.5 15.5 10.07 15.5 12C15.5 13.93 13.93 15.5 12 15.5ZM19.43 12.97C19.47 12.65 19.5 12.33 19.5 12C19.5 11.67 19.47 11.34 19.43 11L21.54 9.37C21.73 9.22 21.78 8.95 21.66 8.73L19.66 5.27C19.54 5.05 19.27 4.96 19.05 5.05L16.56 6.05C16.04 5.66 15.5 5.32 14.87 5.07L14.5 2.42C14.46 2.18 14.25 2 14 2H10C9.75 2 9.54 2.18 9.5 2.42L9.13 5.07C8.5 5.32 7.96 5.67 7.44 6.05L4.95 5.05C4.73 4.96 4.46 5.05 4.34 5.27L2.34 8.73C2.21 8.95 2.27 9.22 2.46 9.37L4.57 11C4.53 11.34 4.5 11.67 4.5 12C4.5 12.33 4.53 12.65 4.57 12.97L2.46 14.63C2.27 14.78 2.21 15.05 2.34 15.27L4.34 18.73C4.46 18.95 4.73 19.03 4.95 18.95L7.44 17.94C7.96 18.34 8.5 18.68 9.13 18.93L9.5 21.58C9.54 21.82 9.75 22 10 22H14C14.25 22 14.46 21.82 14.5 21.58L14.87 18.93C15.5 18.67 16.04 18.33 16.56 17.94L19.05 18.95C19.27 19.03 19.54 18.95 19.66 18.73L21.66 15.27C21.78 15.05 21.73 14.78 21.54 14.63L19.43 12.97Z"
                                    fill="white" />
                            </svg>
                            <template if:false={isMobileOrTablet}>Customize View</template>
                        </button>

                        <button class="exp-blue-btn-css" onclick={showModalBox} aria-label="Filters" title="Filters">
                            <svg width="18px" height="18px" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M3 7C3 6.44772 3.44772 6 4 6H20C20.5523 6 21 6.44772 21 7C21 7.55228 20.5523 8 20 8H4C3.44772 8 3 7.55228 3 7ZM6 12C6 11.4477 6.44772 11 7 11H17C17.5523 11 18 11.4477 18 12C18 12.5523 17.5523 13 17 13H7C6.44772 13 6 12.5523 6 12ZM9 17C9 16.4477 9.44772 16 10 16H14C14.5523 16 15 16.4477 15 17C15 17.5523 14.5523 18 14 18H10C9.44772 18 9 17.5523 9 17Z"
                                    fill="white" />
                            </svg><template if:false={isMobileOrTablet}>Filters</template>
                        </button>
                    </div>

                    <template if:true={isShowModal}>
                        <div class="filter-div">
                            <div class="filter-fields">
                                <div class="filter-header">
                                    Filter Inquiries
                                </div>
                                <div class="scroll-div">
                                    <div class="condition-type-wrapper">
                                        <div class="slds-form_element slds-m-bottom_medium condition-type-field">
                                            <lightning-combobox name="conditionType" label="Condition Type"
                                                value={conditiontype} options={conditionOptions}
                                                onchange={handleConditionTypeChange}>
                                            </lightning-combobox>
                                        </div>
                                        <template if:true={showAddConditionIcon}>
                                            <button class="add-condition-icon-btn" onclick={addCondition}
                                                disabled={isAddConditionDisabled} title={addConditionTitle}>
                                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                                    xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="2.5"
                                                        stroke-linecap="round" />
                                                </svg>
                                            </button>
                                        </template>
                                    </div>

                                    <template if:true={isCustomLogicSelected}>
                                        <div class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                            <label><span class="required-class">*</span>Logical Expression</label>
                                            <lightning-input variant="label-hidden" data-id="condition-input"
                                                value={logicalExpression} onchange={handleLogicalExpressionChange}
                                                placeholder="Enter logical expression">
                                            </lightning-input>
                                        </div>
                                    </template>

                                    <div class="slds-m-top_medium">
                                        <template if:false={mappings.length}>
                                            <p class="slds-text-align_center slds-text-color_weak slds-p-around_medium">
                                                No filters applied for this object.</p>
                                        </template>

                                        <template for:each={mappings} for:item="mapping">


                                            <div key={mapping.id} class="parent-div">
                                                <div class={mappingClass} onclick={handleMappingClick}
                                                    data-id={mapping.id} data-name="mapping-box">
                                                    <span class="mapping-id">{mapping.id}</span>

                                                    <div class="mapping-data">
                                                        {mapping.label} <br>
                                                        {mapping.displayOperator} " {mapping.displayValue} "
                                                    </div>
                                                    <div class="delete-div" title="Delete" data-id={mapping.id}
                                                        onclick={handleDeleteMapping} data-name="delete">
                                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                                            fill="#212529" stroke="#212529" stroke-width="0.6"
                                                            stroke-linejoin="round" width="15" height="15">
                                                            <path
                                                                d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z"
                                                                stroke-width="0.0625"></path>
                                                        </svg>
                                                        <span class="slds-assistive-text">Delete</span>
                                                    </div>
                                                </div>

                                            </div>
                                        </template>
                                    </div>
                                </div>

                            </div>
                            <div class="filter-footer">
                                <div class="add-condtion">
                                    <template if:true={isAddConditionModalVisible}>
                                        <div class="condition-div">
                                            <div class="filter-header">
                                                Configure Condition
                                            </div>
                                            <div class="condition-div-body">
                                                <div class="slds-form_element slds-m-bottom_medium">
                                                    <lightning-combobox name="inquiryField" label="Inquiry Field"
                                                        value={inquiryFieldObject.MVEX__Field_Name__c}
                                                        options={inquirypicklistoptions}
                                                        onchange={handleInquiryFieldChange} required>
                                                    </lightning-combobox>
                                                </div>

                                                <div class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                    <lightning-combobox name="conditionOperator" label="Condition"
                                                        value={selectedConditionOperator}
                                                        options={conditionOperatorOptions}
                                                        onchange={handleConditionOperatorChange} required>
                                                    </lightning-combobox>
                                                </div>

                                                <div class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                    <template if:false={isNullOperatorSelected}>
                                                        <lightning-input type="checkbox" label="Use Constant Value"
                                                            checked={isConstant} onchange={handleUseConstantChange}>
                                                        </lightning-input>
                                                    </template>
                                                </div>

                                                <template if:true={isNullOperatorSelected}>
                                                    <div
                                                        class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                        <label><span class="red">*</span>Value</label>
                                                        <lightning-combobox value={selectedListingField}
                                                            data-field="MVEX__Value__c" options={isNullPicklistOptions}
                                                            onchange={handleListingFieldChange} variant="label-hidden"
                                                            placeholder="Select True or False">
                                                        </lightning-combobox>
                                                    </div>
                                                </template>

                                                <template if:false={isNullOperatorSelected}>
                                                    <template if:true={isConstant}>
                                                        <div
                                                            class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                            <label><span class="red">*</span>Value</label>
                                                            <template if:true={inquiryFieldObject.isPrimary}>
                                                                <lightning-input
                                                                    type={inquiryFieldObject.MVEX__Data_Type__c}
                                                                    value={selectedListingField}
                                                                    data-field="MVEX__Value__c"
                                                                    onchange={handleListingFieldChange}
                                                                    variant="label-hidden"></lightning-input>
                                                            </template>
                                                            <template if:true={inquiryFieldObject.isPicklist}>
                                                                <lightning-combobox value={selectedListingField}
                                                                    data-field="MVEX__Value__c"
                                                                    options={inquiryFieldObject.picklistValues}
                                                                    onchange={handleListingFieldChange}
                                                                    variant="label-hidden"></lightning-combobox>
                                                            </template>
                                                            <template if:true={inquiryFieldObject.isReference}>
                                                                <lightning-record-picker value={selectedListingField}
                                                                    label="Reference" data-field="MVEX__Value__c"
                                                                    object-api-name={inquiryFieldObject.objectApiName}
                                                                    onchange={handleRefChange}
                                                                    variant="label-hidden"></lightning-record-picker>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <template if:false={isConstant}>
                                                        <div
                                                            class="slds-form_element slds-m-bottom_medium slds-m-top_medium">
                                                            <lightning-combobox name="listingField"
                                                                label="Listing Field" value={selectedListingField}
                                                                options={listingFieldOptions}
                                                                onchange={handleListingFieldChange} required>
                                                            </lightning-combobox>
                                                        </div>
                                                    </template>
                                                </template>
                                            </div>
                                            <div class="condition-div-footer">
                                                <button class="exp-white-btn-css" onclick={closeAddConditionModal}>
                                                    <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                                                        xmlns="http://www.w3.org/2000/svg">
                                                        <path
                                                            d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                                            fill="currentColor" />
                                                    </svg>
                                                    Cancel
                                                </button>
                                                <button class="exp-blue-btn-css" onclick={saveCondition}>
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                                        xmlns="http://www.w3.org/2000/svg">
                                                        <path
                                                            d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                                            fill="currentColor" />
                                                    </svg>
                                                    Save
                                                </button>
                                            </div>
                                            <div class="arrow"></div>
                                        </div>
                                    </template>
                                </div>
                                <div class="custom-footer">
                                    <button class="exp-white-btn-css" onclick={hideModalBox}>
                                        <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                                fill="currentColor" />
                                        </svg>
                                        Cancel
                                    </button>
                                    <button class="exp-blue-btn-css" onclick={applyModalFilters}
                                        disabled={isApplyButtonDisabled}>
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                                fill="currentColor" />
                                        </svg>
                                        Apply
                                    </button>
                                </div>
                            </div>
                        </div>

                    </template>
                </div>
            </div>
        </div>

        <template if:true={pagedInquries.length}>
            <div class="exp-main-content-cls">
                <div class="exp-table-content" id="exp-table-content">
                    <table aria-multiselectable="true"
                        class="slds-table slds-table_fixed-layout slds-table_resizable-cols" role="grid"
                        aria-label="Inquiries">
                        <thead>
                            <tr class="slds-line-height_reset fields-names exp-table-tr-cls">
                                <th class="header-cell slds-cell_action-mode column-1" scope="col">
                                    <span id="column-group-header" class="slds-assistive-text">Choose a row</span>
                                    <div class="header-checkbox-div">
                                        <lightning-input type="checkbox" variant="label-hidden" label="Select All"
                                            checked={checkAll} onchange={selectAllCheckbox}>
                                        </lightning-input>
                                    </div>
                                </th>
                                <th aria-sort="none" data-id="name" onclick={sortClick}
                                    class="slds-is-resizable slds-is-sortable slds-cell_action-mode exp-sorting-header colume2"
                                    scope="col">
                                    <div class="slds-text-link_reset exp-sort-cover" role="button" tabindex="0">
                                        <span class="slds-assistive-text">Sort by: </span>
                                        <div class="slds-has-flexi-truncate">
                                            <span class="slds-truncate" title="Inquiry Name">Inquiry Name</span>
                                            <span class="slds-icon_container slds-icon-utility-arrowdown">
                                                <svg data-index="name" class="exp-arrow-icon" viewBox="0 0 384 512"
                                                    xmlns="http://www.w3.org/2000/svg">
                                                    <path
                                                        d="M374.6 246.6C368.4 252.9 360.2 256 352 256s-16.38-3.125-22.62-9.375L224 141.3V448c0 17.69-14.33 31.1-31.1 31.1S160 465.7 160 448V141.3L54.63 246.6c-12.5 12.5-32.75 12.5-45.25 0s-12.5-32.75 0-45.25l160-160c12.5-12.5 32.75-12.5 45.25 0l160 160C387.1 213.9 387.1 234.1 374.6 246.6z" />
                                                </svg>
                                            </span>
                                        </div>
                                    </div>
                                </th>
                                <th aria-sort="none" data-id="contactname" onclick={sortClick}
                                    class="slds-is-resizable slds-is-sortable slds-cell_action-mode exp-sorting-header colume2"
                                    scope="col">
                                    <div class="slds-text-link_reset exp-sort-cover" role="button" tabindex="0">
                                        <span class="slds-assistive-text">Sort by: </span>
                                        <div class="slds-has-flexi-truncate">
                                            <span class="slds-truncate" title="Contact Name">Contact Name</span>
                                            <span class="slds-icon_container slds-icon-utility-arrowdown">
                                                <svg data-index="contactname" class="exp-arrow-icon"
                                                    viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg">
                                                    <path
                                                        d="M374.6 246.6C368.4 252.9 360.2 256 352 256s-16.38-3.125-22.62-9.375L224 141.3V448c0 17.69-14.33 31.1-31.1 31.1S160 465.7 160 448V141.3L54.63 246.6c-12.5 12.5-32.75 12.5-45.25 0s-12.5-32.75 0-45.25l160-160c12.5-12.5 32.75-12.5 45.25 0l160 160C387.1 213.9 387.1 234.1 374.6 246.6z" />
                                                </svg>
                                            </span>
                                        </div>
                                    </div>
                                </th>
                                <template for:each={tableColumns} for:item="column">
                                    <th key={column.fieldName} aria-sort="none" data-id={column.fieldName}
                                        onclick={sortClick}
                                        class="slds-is-resizable slds-is-sortable slds-cell_action-mode exp-sorting-header colume2"
                                        scope="col">
                                        <div class="slds-text-link_reset exp-sort-cover" role="button" tabindex="0">
                                            <span class="slds-assistive-text">Sort by: </span>
                                            <div class="slds-has-flexi-truncate">
                                                <span class="slds-truncate" title={column.label}>{column.label}</span>
                                                <span class="slds-icon_container slds-icon-utility-arrowdown">
                                                    <svg data-index={column.fieldName} class="exp-arrow-icon"
                                                        viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg">
                                                        <path
                                                            d="M374.6 246.6C368.4 252.9 360.2 256 352 256s-16.38-3.125-22.62-9.375L224 141.3V448c0 17.69-14.33 31.1-31.1 31.1S160 465.7 160 448V141.3L54.63 246.6c-12.5 12.5-32.75 12.5-45.25 0s-12.5-32.75 0-45.25l160-160c12.5-12.5 32.75-12.5 45.25 0l160 160C387.1 213.9 387.1 234.1 374.6 246.6z" />
                                                    </svg>
                                                </span>
                                            </div>
                                        </div>
                                    </th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={pagedInquries} for:item="inquiry">
                                <tr key={inquiry.id} aria-selected="false" class="table-tr">
                                    <td class="slds-cell_action-mode column-1 checkbox-cell" role="gridcell">
                                        <div class="row-checkbox-div">
                                            <lightning-input type="checkbox" variant="label-hidden"
                                                label="Select Inquiry" data-id={inquiry.id} checked={inquiry.isSelected}
                                                onchange={checkBoxValueChange}>
                                            </lightning-input>
                                        </div>
                                    </td>
                                    <td class="slds-cell_action-mode listing-cls" scope="row" title={inquiry.name}>
                                        <div class="slds-truncate center-trancate-text" title={inquiry.name}>
                                            <a href="javascript:void(0)" data-id={inquiry.id}
                                                onclick={navigateToRecord}>{inquiry.name}</a>
                                        </div>
                                    </td>
                                    <td class="slds-cell_action-mode" role="gridcell" title={inquiry.contactName}>
                                        <div class="slds-truncate center-trancate-text" title={inquiry.contactName}>
                                            <template if:true={inquiry.hasContact}>
                                                <a href="javascript:void(0)" data-id={inquiry.contactId}
                                                    onclick={navigateToRecord}>{inquiry.contactName}</a>
                                            </template>
                                            <template if:false={inquiry.hasContact}>
                                                -
                                            </template>
                                        </div>
                                    </td>
                                    <template for:each={inquiry.displayFields} for:item="field">
                                        <td key={field.key} class="slds-cell_action-mode" role="gridcell"
                                            title={field.value}>
                                            <div class="slds-truncate center-trancate-text" title={field.value}>
                                                <template if:true={field.hasValue}>
                                                    <template if:true={field.isNameField}>
                                                        <a href="javascript:void(0)" data-id={inquiry.id}
                                                            onclick={navigateToRecord}>{field.value}</a>
                                                    </template>
                                                    <template if:true={field.isReference}>
                                                        <a href="javascript:void(0)" data-id={field.recordId}
                                                            onclick={navigateToRecord}>{field.value}</a>
                                                    </template>
                                                    <template if:false={field.isNameField}>
                                                        <template if:false={field.isReference}>
                                                            <template if:true={field.isCurrency}>
                                                                {field.value}
                                                            </template>
                                                            <template if:false={field.isCurrency}>
                                                                {field.value}
                                                            </template>
                                                        </template>
                                                    </template>
                                                </template>
                                            </div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- FOOTER / PAGINATION -->
                <div class="exp-pagination-div">
                    <div class="exp-page-size-container">
                        <label class="exp-page-size-label">Rows per page : </label>
                        <select class="exp-page-size-select" onchange={handlePageSizeChange}>
                            <template for:each={pageSizeOptions} for:item="opt">
                                <option key={opt.value} value={opt.value} selected={opt.isSelected}>
                                    {opt.label}
                                </option>
                            </template>
                        </select>
                    </div>

                    <div class="exp-pagination-right">
                        <span class="exp-results-info">{recordCountInfo}</span>

                        <div class="exp-btn-cover">
                            <div class="exp-pagination-container">
                                <button class="exp-pagination-btn-css" disabled={isFirstPage} onclick={handlePrevious}>
                                    <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52" viewBox="0 0 520 520"
                                        fill="#fff">
                                        <path
                                            d="M342 477 134 272c-6-6-6-16 0-22L342 45c6-6 16-6 22 0l22 22c6 6 6 16 0 22L221 250c-6 6-6 16 0 22l163 161c6 6 6 16 0 22l-22 22c-5 5-14 5-20 0z" />
                                    </svg>
                                </button>

                                <template for:each={pageNumbers} for:item="page">
                                    <template if:false={page.isEllipsis}>
                                        <button key={page.number} data-id={page.number} class={page.className}
                                            onclick={handlePageChange}>
                                            {page.number}
                                        </button>
                                    </template>
                                    <template if:true={page.isEllipsis}>
                                        <span key={page.number} class="exp-pagination-ellipsis">...</span>
                                    </template>
                                </template>

                                <button class="exp-pagination-btn-css" disabled={isLastPage} onclick={handleNext}>
                                    <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52" viewBox="0 0 520 520"
                                        fill="#fff">
                                        <path
                                            d="M178 477l208-205c6-6 6-16 0-22L178 45c-6-6-16-6-22 0l-22 22c-6 6-6 16 0 22l163 161c6 6 6 16 0 22L134 433c-6 6-6 16 0 22l22 22c6 6 16 6 22 0z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <template if:false={pagedInquries.length}>
            <div class="exp-no-data-container">
                <img src="/resource/MVEX__emptyState" alt="" draggable="false">
                <div class="exp-no-data-message">No Inquiry found. Please change your search filters and try again.
                </div>
            </div>
        </template>
    </div>



</template>
