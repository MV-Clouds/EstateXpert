<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container modal-container">
            <div class="slds-modal__close exp-close-icon-css" onclick={handleDialogueClose}>
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                        fill="#1F2937" />
                </svg>
            </div>

            <div class="slds-modal__header exp-pop-up-header-css">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Manage Your Checklist
                </h1>
            </div>
            <div class="slds-modal__content background-css" id="modal-content-id-1">
                <div class="header-container-css">
                    <div class="object-name-css">
                        Selected Object : {selectedObjectName}
                    </div>
                    <div class="header_title_css">
                        <button class="exp-blue-btn-css" onclick={addNewRow}>
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <path d="M14 8H8V14H6V8H0V6H6V0H8V6H14V8Z" fill="white" />
                            </svg>
                            Add New
                        </button>
                    </div>
                </div>
                <div class="tableContainer">
                    <template if:true={isDataAvailable}>
                        <div class="exp-table-content">
                            <table class="slds-table slds-table_fixed-layout slds-table_resizable-cols">
                                <thead>
                                    <tr>
                                        <th scope="col" class="drag-column" aria-label="Drag to reorder">
                                            <!-- Drag handle column -->
                                        </th>
                                        <th scope="col" class="name">
                                            <div class="slds-truncate"><abbr title="required"
                                                    class="slds-required">*</abbr>Checklist Name</div>
                                        </th>
                                        <th scope="col" class="fieldname">
                                            <div class="slds-truncate">Field Name</div>
                                        </th>
                                        <th scope="col" class="operator">
                                            <div class="slds-truncate">Operator</div>
                                        </th>
                                        <th scope="col" class="value">
                                            <div class="slds-truncate">Value</div>
                                        </th>
                                        <th scope="col" class="description">
                                            <div class="slds-truncate">Description</div>
                                        </th>
                                        <th scope="col" class="action">
                                            <div class="slds-truncate order-btn-grp">Action</div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={checklistItems} for:item="item" for:index="index">
                                        <tr key={item.Id} class="popup__data-row" data-index={index} draggable="true"
                                            ondragstart={handleDragStart} ondragover={handleDragOver}
                                            ondrop={handleDrop} ondragend={handleDragEnd} ondragleave={handleDragLeave}>
                                            <td class="drag-handle" title="Drag to reorder">
                                                <svg height="18" width="18" viewBox="0 0 16 16" fill="#a0b2c6"
                                                    xmlns="http://www.w3.org/2000/svg">
                                                    <path
                                                        d="M7.333333333333333 7.333333333333333V3.88562L6.114379999999999 5.104566666666667 5.171573333333333 4.161759999999999 8 1.3333333333333333l2.8284000000000002 2.828426666666666 -0.9427999999999999 0.9428066666666666L8.666666666666666 3.88562V7.333333333333333h3.447733333333333l-1.2189999999999999 -1.2189533333333333 0.9428666666666665 -0.9428066666666666L14.666666666666666 8l-2.8284000000000002 2.8284000000000002 -0.9428666666666665 -0.9427999999999999L12.1144 8.666666666666666H8.666666666666666v3.447733333333333l1.2189333333333332 -1.2189999999999999 0.9427999999999999 0.9428666666666665L8 14.666666666666666l-2.828426666666666 -2.8284000000000002 0.9428066666666666 -0.9428666666666665L7.333333333333333 12.1144V8.666666666666666H3.88562l1.2189466666666666 1.2189333333333332 -0.9428066666666666 0.9427999999999999L1.3333333333333333 8l2.828426666666666 -2.828426666666666 0.9428066666666666 0.9428066666666666L3.88562 7.333333333333333H7.333333333333333Z"
                                                        stroke-width="0.6667"></path>
                                                </svg>
                                            </td>
                                            <td data-label="name">
                                                <lightning-input type="text" value={item.Name} data-index={index}
                                                    data-field="Name" onchange={handleInputChange}
                                                    variant="label-hidden"></lightning-input>
                                            </td>

                                            <!-- Custom Searchable Field Name Combobox -->
                                            <td data-label="fieldname" class="searchable-combobox-cell">
                                                <div class="searchable-combobox" data-index={index} tabindex="0"
                                                    onfocusout={handleFieldComboboxFocusOut}>
                                                    <div class="combobox-trigger" data-index={index}
                                                        onclick={handleFieldComboboxOpen}>
                                                        <span
                                                            class={item.fieldComboboxTriggerClass}>{item.fieldDisplayLabel}</span>
                                                        <svg class="combobox-arrow" width="10" height="6"
                                                            viewBox="0 0 10 6" fill="none">
                                                            <path d="M1 1L5 5L9 1" stroke="#6B7280" stroke-width="1.5"
                                                                stroke-linecap="round" stroke-linejoin="round" />
                                                        </svg>
                                                    </div>
                                                    <template if:true={item.isFieldComboboxOpen}>
                                                        <div class="combobox-dropdown" data-index={index}>
                                                            <div class="combobox-search-wrapper">
                                                                <svg class="search-icon" width="14" height="14"
                                                                    viewBox="0 0 24 24" fill="none">
                                                                    <path
                                                                        d="M21 21L15 15M17 11C17 14.3137 14.3137 17 11 17C7.68629 17 5 14.3137 5 11C5 7.68629 7.68629 5 11 5C14.3137 5 17 7.68629 17 11Z"
                                                                        stroke="#9CA3AF" stroke-width="2"
                                                                        stroke-linecap="round" />
                                                                </svg>
                                                                <input type="text" class="combobox-search-input"
                                                                    placeholder="Search fields..."
                                                                    value={item.fieldSearchTerm} data-index={index}
                                                                    oninput={handleFieldSearch}
                                                                    onclick={handleSearchInputClick} />
                                                            </div>
                                                            <div class="combobox-options-list">
                                                                <template for:each={item.filteredFieldOptions}
                                                                    for:item="opt">
                                                                    <div key={opt.value} class={opt.optionClass}
                                                                        data-index={index} data-value={opt.value}
                                                                        data-label={opt.label}
                                                                        onclick={handleFieldOptionSelect}>
                                                                        {opt.label}
                                                                    </div>
                                                                </template>
                                                                <template if:true={item.noFieldResults}>
                                                                    <div class="combobox-no-results">No fields found
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </td>

                                            <!-- Operator -->
                                            <td data-label="operator">
                                                <lightning-combobox value={item.MVEX__Operator__c}
                                                    data-fieldapiname={item.MVEX__Field_Name__c} data-index={index}
                                                    data-field="MVEX__Operator__c" options={item.operatorOptionsForRow}
                                                    onchange={handleOperatorChange} variant="label-hidden">
                                                </lightning-combobox>
                                            </td>

                                            <td data-label="value">
                                                <template if:true={item.isPrimary}>
                                                    <lightning-input type={item.MVEX__Data_Type__c}
                                                        value={item.MVEX__Value__c} data-index={index}
                                                        data-field="MVEX__Value__c" onchange={handleInputChange}
                                                        variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={item.isPicklist}>
                                                    <lightning-combobox value={item.MVEX__Value__c} data-index={index}
                                                        data-field="MVEX__Value__c" options={item.picklistValues}
                                                        onchange={handleInputChange}
                                                        variant="label-hidden"></lightning-combobox>
                                                </template>
                                                <template if:true={item.isReference}>
                                                    <lightning-record-picker value={item.MVEX__Value__c}
                                                        label="Reference" data-index={index} data-field="MVEX__Value__c"
                                                        object-api-name={item.objectApiName} onchange={handleRefChange}
                                                        variant="label-hidden"></lightning-record-picker>
                                                </template>
                                            </td>
                                            <td data-label="description">
                                                <lightning-input type="text" value={item.MVEX__Description__c}
                                                    data-index={index} data-field="MVEX__Description__c"
                                                    onchange={handleInputChange}
                                                    variant="label-hidden"></lightning-input>
                                            </td>
                                            <td data-label="action">
                                                <div class="order-btn-grp">
                                                    <button class="exp-delete-icon-css" onclick={handleDelete}
                                                        data-index={index}>
                                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                                            fill="#000000" width="14" height="14">
                                                            <path
                                                                d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z"
                                                                stroke-width="0.0625"></path>
                                                        </svg>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:false={isDataAvailable}>
                        <div class="exp-no-data-container">
                            <img src="/resource/MVEX__emptyState" alt="" draggable="false">
                            <div class="exp-no-data-message">No Checklist available for this object, please create a
                                checklist first.</div>
                        </div>
                    </template>
                </div>
                <div class="footerbtns">
                    <button class="exp-white-btn-css" aria-label="Cancel and close" onclick={handleDialogueClose}>
                        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                fill="currentColor" />
                        </svg>
                        Cancel
                    </button>
                    <button class="exp-blue-btn-css" onclick={saveChecklistRecords}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor" />
                        </svg>
                        Save
                    </button>
                </div>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

    <template if:true={isSpinner}>
        <c-spinner-component></c-spinner-component>
    </template>
</template>
