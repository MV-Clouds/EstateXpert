<template>
    <div class="wrapper">
        <template if:true={isLoading}>
            <c-spinner-component></c-spinner-component>
        </template>

        <!-- ===================== CONNECTED ===================== -->
        <template if:true={hasConnection}>

            <!-- Account card -->
            <div class="account-card">
                <div class="account-header">
                    <div class="account-left">
                        <div class="account-icon-container">
                            <img src="/resource/MVEX__controlcenterimg/google.png" alt="Google" draggable="false">
                        </div>
                        <div class="account-titles">
                            <div class="account-name-row">
                                <span class="account-name">{connectedTitle}</span>
                                <div class="connected-pill">
                                    <span class="connected-dot"></span>
                                    Connected
                                </div>
                            </div>
                            <div class="account-subtitle">Google Ads Account</div>
                        </div>
                    </div>
                    <div class="account-right">
                        <button class="action-outline-btn" onclick={openWebhookModal} disabled={isWebhookLocked} title={webhookButtonTitle}>
                            <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
                                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                            Webhook Site
                        </button>
                        <button class="disconnect-btn" onclick={handleDisconnectClick}>
                            <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22v-5"></path>
                                <path d="M9 8V2"></path>
                                <path d="M15 8V2"></path>
                                <path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"></path>
                                <line x1="2" y1="2" x2="22" y2="22"></line>
                            </svg>
                            Disconnect
                        </button>
                        <button class="exp-blue-btn-css" onclick={openNewMappingModal}>
                            <svg class="btn-icon" width="14" height="14" viewBox="0 0 20 20" fill="none">
                                <path d="M10 2V18M2 10H18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                            New Mapping
                        </button>
                    </div>
                </div>

                <div class="account-details">
                    <div class="detail-col">
                        <div class="detail-label">GOOGLE ACCOUNT</div>
                        <div class="detail-value" title={connectedEmail}>{connectedEmail}</div>
                    </div>
                    <div class="detail-col">
                        <div class="detail-label">GOOGLE ADS ACCOUNTS</div>
                        <div class="detail-value">{accountCount}</div>
                    </div>
                    <div class="detail-col">
                        <div class="detail-label">DATE CONNECTED</div>
                        <div class="detail-value">{connectedDateLabel}</div>
                    </div>
                </div>
            </div>

            <template if:true={showWebhookHint}>
                <div class="hint-notice" role="status">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="flex-shrink-0">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
                        <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                    <span>Select a Force.com site under <strong>Webhook Site</strong> before creating your first mapping.</span>
                </div>
            </template>

            <div class="main_content_cls">
                <template if:true={hasMappings}>
                    <div class="exp-table-content exp-main-table-wrapper main-table">
                        <table class="slds-table slds-table_fixed-layout" role="grid">
                            <thead>
                                <tr class="slds-line-height_reset exp-table-tr-cls">
                                    <th scope="col" class="col-action"><div></div></th>
                                    <th scope="col" class="col-no"><div class="slds-truncate header-cell-padding" title="No.">No.</div></th>
                                    <th scope="col"><div class="slds-truncate header-cell-padding" title="Google Ads Account">Google Ads Account</div></th>
                                    <th scope="col" class="col-id"><div class="slds-truncate header-cell-padding" title="Customer ID">Customer ID</div></th>
                                    <th scope="col" class="col-count"><div class="slds-truncate header-cell-padding" title="Mapped Forms">Mapped Forms</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={shownTableData} for:item="row">
                                    <!-- Parent row -->
                                    <tr key={row.id} class={row.rowClass}>
                                        <td class="expand-cell">
                                            <div class="flex-center">
                                                <div class="action-icon-container" data-id={row.id} onclick={handleToggleRow} title="Show or hide mapped forms">
                                                    <svg class="action-arrow" viewBox="0 0 24 24" fill="none">
                                                        <template if:true={row.isExpanded}>
                                                            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                                        </template>
                                                        <template if:false={row.isExpanded}>
                                                            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                                        </template>
                                                    </svg>
                                                </div>
                                            </div>
                                        </td>
                                        <td><div class="slds-truncate center-text">{row.index}</div></td>
                                        <td><div class="slds-truncate center-text" title={row.accountName}>{row.accountName}</div></td>
                                        <td><div class="slds-truncate center-text">{row.accountId}</div></td>
                                        <td>
                                            <div class="slds-truncate center-text">
                                                <div class="mapped-forms-pill">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                        <polyline points="14 2 14 8 20 8"></polyline>
                                                        <line x1="16" y1="13" x2="8" y2="13"></line>
                                                        <line x1="16" y1="17" x2="8" y2="17"></line>
                                                    </svg>
                                                    <span>{row.formCount}</span>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>

                                    <!-- Accordion row -->
                                    <template if:true={row.isExpanded}>
                                        <tr key={row.accordionId} class="accordion-row">
                                            <td colspan="5" class="no-padding-td">
                                                <div class="exp-accordion-wrapper">
                                                    <template if:true={row.hasForms}>
                                                        <div class="exp-accordion-header-container">
                                                            <div class="exp-accordion-title-section">
                                                                <h3 class="exp-accordion-title">Mapped Forms</h3>
                                                                <span class="exp-accordion-badge">{row.formCount}</span>
                                                            </div>
                                                        </div>
                                                        <div class="exp-table-content exp-accordion-table-content">
                                                            <table class="slds-table slds-no-row-hover slds-table_fixed-layout no-border" role="grid">
                                                                <thead>
                                                                    <tr class="slds-line-height_reset exp-table-tr-cls">
                                                                        <th scope="col" class="col-no"><div class="slds-truncate header-cell-padding" title="No.">No.</div></th>
                                                                        <th scope="col"><div class="slds-truncate header-cell-padding" title="Form Name">Form Name</div></th>
                                                                        <th scope="col" class="col-id"><div class="slds-truncate header-cell-padding" title="Form ID">Form ID</div></th>
                                                                        <th scope="col" class="col-count"><div class="slds-truncate header-cell-padding" title="Mapped Fields">Mapped Fields</div></th>
                                                                        <th scope="col" class="col-actions"><div class="slds-truncate header-cell-padding" title="Actions">Actions</div></th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    <template for:each={row.forms} for:item="form">
                                                                        <tr key={form.id}>
                                                                            <td><div class="slds-truncate center-text">{form.index}</div></td>
                                                                            <td>
                                                                                <div class="form-name-cell">
                                                                                    <span class="slds-truncate form-name-text" title={form.formName}>{form.formName}</span>
                                                                                    <template if:true={form.failedCount}>
                                                                                        <button type="button" class="failed-count-badge" data-id={form.id} onclick={handleFailedLeadsClick} title="View failed leads">
                                                                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                                                                                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5"></circle>
                                                                                                <path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></path>
                                                                                            </svg>
                                                                                            <span>{form.failedCount} Failed</span>
                                                                                        </button>
                                                                                    </template>
                                                                                </div>
                                                                            </td>
                                                                            <td><div class="slds-truncate center-text">{form.formId}</div></td>
                                                                            <td><div class="slds-truncate center-text">{form.mappedCount}</div></td>
                                                                            <td>
                                                                                <div class="action-buttons-wrapper">
                                                                                    <button class="action-div" data-id={form.id} onclick={handleEditRow} title="Edit Mapping">
                                                                                        <svg width="16" height="16" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                                                            <path d="M13.0416 13.0417H8.45831M0.958313 13.0417L4.49998 12.2083L12.2441 4.46426C12.5695 4.13882 12.5695 3.61119 12.2441 3.28575L10.7142 1.75593C10.3888 1.43049 9.86115 1.43049 9.53573 1.75593L1.79165 9.50001L0.958313 13.0417Z" stroke="#212529" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
                                                                                        </svg>
                                                                                    </button>
                                                                                    <button class="delete-div" data-id={form.id} onclick={handleDeleteRow} title="Delete Mapping">
                                                                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#212529" height="16" width="16">
                                                                                            <path d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z" stroke-width="0.0625"></path>
                                                                                        </svg>
                                                                                    </button>
                                                                                </div>
                                                                            </td>
                                                                        </tr>
                                                                    </template>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </template>
                                                    <template if:false={row.hasForms}>
                                                        <div class="inner-empty-state">No forms mapped for this account.</div>
                                                    </template>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination footer -->
                    <div class="exp-pagination-div">
                        <div class="exp-page-size-container">
                            <label class="exp-page-size-label">Rows per page : </label>
                            <select class="exp-page-size-select" onchange={handlePageSizeChange}>
                                <template for:each={pageSizeOptions} for:item="opt">
                                    <option key={opt.value} value={opt.value} selected={opt.isSelected}>{opt.label}</option>
                                </template>
                            </select>
                        </div>

                        <div class="exp-pagination-right">
                            <span class="exp-results-info">{recordCountInfo}</span>
                            <div class="exp-btn-cover">
                                <div class="exp-pagination-container">
                                    <button class="exp-pagination-btn-css" disabled={isFirstPage} onclick={handlePrevious}>
                                        <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52" viewBox="0 0 520 520" fill="#fff">
                                            <path d="M342 477 134 272c-6-6-6-16 0-22L342 45c6-6 16-6 22 0l22 22c6 6 6 16 0 22L221 250c-6 6-6 16 0 22l163 161c6 6 6 16 0 22l-22 22c-5 5-14 5-20 0z" />
                                        </svg>
                                    </button>

                                    <template for:each={pageNumbers} for:item="page">
                                        <template if:false={page.isEllipsis}>
                                            <button key={page.key} data-id={page.number} class={page.className} onclick={handlePageChange}>{page.number}</button>
                                        </template>
                                        <template if:true={page.isEllipsis}>
                                            <span key={page.key} class="exp-pagination-ellipsis">...</span>
                                        </template>
                                    </template>

                                    <button class="exp-pagination-btn-css" disabled={isLastPage} onclick={handleNext}>
                                        <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52" viewBox="0 0 520 520" fill="#fff">
                                            <path d="m179 44 207 205c6 6 6 16 0 22L179 476c-6 6-16 6-22 0l-22-22c-6-6-6-16 0-22l163-161c6-6 6-16 0-22L136 88c-6-6-6-16 0-22l22-22c6-5 15-5 21 0z" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <template if:false={hasMappings}>
                    <div class="no-records-message">
                        <div class="empty-state">
                            <div class="empty-state__content">
                                <div class="empty-icon">
                                    <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
                                        <path d="M4 4h16v16H4z" stroke="#0176D3" stroke-width="1.5" stroke-linejoin="round"></path>
                                        <path d="M8 9h8M8 13h5" stroke="#0176D3" stroke-width="1.5" stroke-linecap="round"></path>
                                    </svg>
                                </div>
                                <div class="empty-state__message">No Data Available to Show.</div>
                                <div class="empty-state__submessage">Click New Mapping to map a Google lead form to Salesforce fields.</div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- ===================== NOT CONNECTED ===================== -->
        <template if:true={showConnectionScreen}>
            <div class="connect-stage">
                <div class="connect-card">
                    <div class="connect-head">
                        <div class="connect-icon">
                            <img src="/resource/MVEX__controlcenterimg/google.png" alt="Google" draggable="false">
                        </div>
                        <div class="connect-head-text">
                            <div class="connect-title">Connect Google Ads</div>
                            <div class="connect-desc">Link your Google account to automatically pull leads from your Google Ads lead form extensions into this workspace. You'll sign in with Google to get started.</div>
                        </div>
                    </div>

                    <div class="connect-body">
                        <!-- Left: action column -->
                        <div class="connect-left">

                            <!-- Step 1: start -->
                            <template if:true={showConnectIntro}>
                                <div class="connect-label">GOOGLE ACCOUNT</div>
                                <button class="exp-blue-btn-css conn-btn" onclick={login} disabled={isLoading}>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
                                        <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                    </svg>
                                    Connect with Google
                                </button>
                                <div class="connect-hint">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                    You will be redirected to Google to authorize access.
                                </div>
                                <button type="button" class="link-btn" onclick={handleShowTokenInput} disabled={isLoading}>I already have a refresh token</button>
                            </template>

                            <!-- Step 2: paste token -->
                            <template if:true={showTokenForm}>
                                <div class="connect-label">GOOGLE REFRESH TOKEN</div>
                                <lightning-textarea class="token-textarea" label="Refresh Token" variant="label-hidden" placeholder="Paste your Google refresh token here..." value={refreshToken} onchange={handleChange} disabled={isLoading}></lightning-textarea>
                                <div class="connect-actions">
                                    <button class="exp-blue-btn-css conn-btn" onclick={saveConnection} disabled={isSaveConnectionDisabled}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"></path>
                                        </svg>
                                        Save
                                    </button>
                                    <button class="exp-white-btn-css conn-btn" onclick={handleCancelConnection} disabled={isLoading}>Cancel</button>
                                </div>
                                <div class="connect-hint">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                    Finish signing in on the Google tab, then paste the token here.
                                </div>
                            </template>

                            <!-- Step 3: waiting for the token to be applied -->
                            <template if:true={isConnectionPending}>
                                <div class="connect-label">CONNECTION PENDING</div>
                                <div class="connect-pending-text">Your token is saved and is being applied. Check the status in a moment.</div>
                                <div class="connect-actions">
                                    <button class="exp-blue-btn-css conn-btn" onclick={checkConnectionStatus} disabled={isLoading}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="23 4 23 10 17 10"></polyline>
                                            <polyline points="1 20 1 14 7 14"></polyline>
                                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                                        </svg>
                                        Check status
                                    </button>
                                </div>
                                <button type="button" class="link-btn" onclick={handleChangeToken} disabled={isLoading}>Use a different token</button>
                            </template>
                        </div>

                        <!-- Right: info panel -->
                        <div class="connect-info">
                            <div class="connect-info-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                                What happens when you connect?
                            </div>
                            <ul class="connect-list">
                                <li>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    <span>Google Ads lead forms sync instantly into your Salesforce contact mappings.</span>
                                </li>
                                <li>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    <span>New leads are pushed in real time through a secure webhook endpoint.</span>
                                </li>
                                <li>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    <span>Failed deliveries are captured so you can retry them without losing data.</span>
                                </li>
                            </ul>
                            <div class="connect-note">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="16" x2="12" y2="12"></line>
                                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                </svg>
                                <span>Note: It might take 3-5 minutes to process after connecting.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ===================== Mapping wizard modal ===================== -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="google-wizard-title" class="slds-modal slds-fade-in-open slds-modal_medium section_css">
                <div class="slds-modal__container">
                    <div class="slds-modal__close close-icon-css" role="button" aria-label="Close" onclick={closeModal}>
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="#1F2937" />
                        </svg>
                    </div>

                    <div class="slds-modal__header blue-header">
                        <h1 id="google-wizard-title" class="slds-modal__title slds-hyphenate">Form Mapping Wizard</h1>
                    </div>

                    <div class="slds-modal__content modalbody">
                        <div class="content_body relative-position">
                            <template if:false={isEditMode}>
                                <!-- Step 1 -->
                                <div class="wizard-section">
                                    <div class="wizard-step-label">
                                        <span class="wizard-step-badge">Step 1</span>
                                        Select Google Ads Account
                                    </div>
                                    <lightning-combobox name="googleAccount" label="" value={selectedAccount} placeholder="-- Choose an Account --" options={accountOptions} onchange={handleAccountChange} disabled={isAccountLocked} variant="label-hidden" class="custom-combobox"></lightning-combobox>
                                </div>

                                <div class="wizard-divider"></div>

                                <!-- Step 2 -->
                                <div class="wizard-section">
                                    <div class="wizard-step-label">
                                        <span class={formStepBadgeClass}>Step 2</span>
                                        Select Lead Form
                                        <template if:true={isFormSectionDisabled}>
                                            <span class="wizard-hint-muted">&nbsp;— Select an account first</span>
                                        </template>
                                    </div>
                                    <lightning-combobox name="formSelect" label="" value={selectedFormId} placeholder="-- Choose a Form --" options={formOptions} onchange={handleFormChange} disabled={isFormDropdownDisabled} variant="label-hidden" class="custom-combobox"></lightning-combobox>
                                    <template if:true={showNoFormsMsg}>
                                        <div class="wizard-hint-error">No available forms. All forms may already be mapped.</div>
                                    </template>
                                </div>
                            </template>

                            <template if:true={isEditMode}>
                                <div class="edit-context">
                                    <span>Account: <strong>{editAccountName}</strong></span>
                                    <span>Form: <strong>{editFormName}</strong></span>
                                </div>
                            </template>

                            <!-- Step 3 -->
                            <template if:true={hasFormFields}>
                                <template if:false={isEditMode}>
                                    <div class="wizard-divider"></div>
                                </template>
                                <div class="wizard-section">
                                    <div class="wizard-step-label">
                                        <template if:false={isEditMode}>
                                            <span class="wizard-step-badge">Step 3</span>
                                        </template>
                                        Map Fields
                                    </div>
                                    <div class="wizard-hint-muted wizard-hint-spaced">
                                        Match each Salesforce field to a Google form field or a fixed custom value.
                                    </div>

                                    <template if:true={currentFormFields.length}>
                                        <div class="mapping-header-new">
                                            <div class="mapping-header-col">SALESFORCE FIELD</div>
                                            <div class="mapping-header-col right-col">GOOGLE FORM FIELD / CUSTOM VALUE</div>
                                        </div>
                                        <template for:each={currentFormFields} for:item="field">
                                            <div key={field.key} class={field.rowClass}>
                                                <div class="mapping-col left-col">
                                                    <div class="sf-field-box" title={field.label}>{field.label}</div>
                                                    <template if:true={field.required}>
                                                        <span class="required-badge">REQUIRED</span>
                                                    </template>
                                                </div>

                                                <div class="mapping-icon-swap">
                                                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M9.25 6.12V4.87h-7l3-2.05-.71-1L.59 4.45A1.29 1.29 0 0 0 0 5.5a1.29 1.29 0 0 0 .59 1l3.93 2.72.71-1-3-2.06zm6.16 3.33-3.93-2.67-.71 1 3 2.06h-7v1.25h7.03l-3 2 .71 1 3.93-2.67a1.23 1.23 0 0 0 0-2.1z"></path></svg>
                                                </div>

                                                <div class="mapping-col right-col">
                                                    <div class="mapping-input-wrapper">
                                                        <div class="mapping-type-pill">
                                                            <button type="button" data-key={field.key} data-type="google" onclick={handleSourceTypeChangeFromTab} class={field.googleTabClass}>Google Form Field</button>
                                                            <button type="button" data-key={field.key} data-type="custom" onclick={handleSourceTypeChangeFromTab} class={field.customTabClass}>Custom Value</button>
                                                        </div>

                                                        <div class="mapping-input-container">
                                                            <template if:true={field.isGoogleField}>
                                                                <lightning-combobox data-key={field.key} value={field.googleField} options={googleOptions} onchange={handleGoogleFieldChange} placeholder="-- Select Google Form Field --" variant="label-hidden" class="custom-combobox mapping-secondary-input"></lightning-combobox>
                                                            </template>
                                                            <template if:true={field.isCustomValue}>
                                                                <template if:true={field.isReferenceField}>
                                                                    <lightning-record-picker data-key={field.key} label={field.label} placeholder="Search and select record" object-api-name={field.referenceTo} value={field.customValue} onchange={handleReferenceChange} class="mapping-secondary-input"></lightning-record-picker>
                                                                </template>
                                                                <template if:false={field.isReferenceField}>
                                                                    <lightning-input data-key={field.key} type="text" value={field.customValue} onchange={handleCustomValueChange} placeholder="Enter custom value" variant="label-hidden" class="mapping-secondary-input"></lightning-input>
                                                                </template>
                                                            </template>
                                                        </div>
                                                        <template if:true={field.showRequiredError}>
                                                            <div class="wizard-hint-error">This required field must be mapped.</div>
                                                        </template>
                                                    </div>

                                                    <div class="mapping-action-delete">
                                                        <button type="button" data-key={field.key} onclick={handleRemoveField} class="delete-div" title="Remove Field" disabled={field.required}>
                                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#212529" height="16" width="16">
                                                                <path d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z" stroke-width="0.0625"></path>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>

                                        <div class="add-field-section">
                                            <template if:false={showAddField}>
                                                <button type="button" class="add-field-btn" onclick={handleShowAddField}>
                                                    <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
                                                        <path d="M10 2V18M2 10H18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                                    </svg>
                                                    Add Field
                                                </button>
                                            </template>
                                            <template if:true={showAddField}>
                                                <div class="add-field-box">
                                                    <div class="add-field-title">Add Salesforce Field</div>
                                                    <div class="add-field-controls">
                                                        <lightning-combobox value={selectedAdditionalField} options={additionalFieldOptions} onchange={handleAdditionalFieldChange} placeholder="-- Select Salesforce Field --" variant="label-hidden" class="custom-combobox add-field-combobox"></lightning-combobox>
                                                        <button type="button" class="save_btn_css" onclick={handleAddField} disabled={isAddFieldDisabled}>Add</button>
                                                        <button type="button" class="cancel_btn_css" onclick={handleCancelAddField}>Cancel</button>
                                                    </div>
                                                    <template if:false={hasAdditionalFieldOptions}>
                                                        <div class="wizard-hint-muted">All available Salesforce fields have already been added.</div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:false={currentFormFields.length}>
                                        <div class="wizard-disabled-box">No Salesforce fields are available for mapping.</div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <template if:true={hasPendingRetry}>
                            <div class="retry-banner">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                                {retryBannerText}
                            </div>
                        </template>

                        <div class="footerbtns">
                            <button class="cancel_btn_css" aria-label="Cancel and close" onclick={closeModal}>
                                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="currentColor" />
                                </svg>
                                Cancel
                            </button>
                            <button class="save_btn_css" disabled={isSaveDisabled} onclick={saveMapping}>
                                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor" />
                                </svg>
                                {saveButtonLabel}
                            </button>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- ===================== Webhook site modal ===================== -->
        <template if:true={isWebhookModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="google-webhook-title" class="slds-modal slds-fade-in-open slds-modal_small section_css">
                <div class="slds-modal__container">
                    <div class="slds-modal__close close-icon-css" role="button" aria-label="Close" onclick={closeWebhookModal}>
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="#1F2937" />
                        </svg>
                    </div>
                    <div class="slds-modal__header blue-header">
                        <h1 id="google-webhook-title" class="slds-modal__title slds-hyphenate">Webhook Site</h1>
                    </div>
                    <div class="slds-modal__content modalbody">
                        <div class="content_body relative-position">
                            <div class="wizard-section">
                                <div class="wizard-step-label">Select Active Force.com Site</div>
                                <template if:true={hasWebhookUrl}>
                                    <div class="webhook-current">Current: {webhookUrl}</div>
                                </template>
                                <template if:true={hasSiteOptions}>
                                    <lightning-combobox name="webhookSite" label="" value={selectedSite} placeholder="-- Choose a Site --" options={siteOptions} onchange={handleSiteChange} variant="label-hidden" class="custom-combobox"></lightning-combobox>
                                    <template if:true={selectedSite}>
                                        <div class="webhook-url-box">
                                            <svg class="flex-shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                                            </svg>
                                            <span class="webhook-url-text">{webhookEndpointPreview}</span>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasSiteOptions}>
                                    <div class="wizard-disabled-box">No active Force.com sites were found.</div>
                                </template>
                            </div>
                        </div>
                        <div class="footerbtns">
                            <button class="cancel_btn_css" onclick={closeWebhookModal}>Cancel</button>
                            <button class="save_btn_css" disabled={isSaveWebhookDisabled} onclick={saveWebhookSite}>Save</button>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- ===================== Failed leads modal ===================== -->
        <template if:true={isFailedModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="google-failed-title" class="slds-modal slds-fade-in-open slds-modal_medium section_css">
                <div class="slds-modal__container">
                    <div class="slds-modal__close close-icon-css" role="button" aria-label="Close" onclick={closeFailedModal}>
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="#1F2937" />
                        </svg>
                    </div>
                    <div class="slds-modal__header blue-header">
                        <h1 id="google-failed-title" class="slds-modal__title slds-hyphenate">{failedModalTitle}</h1>
                    </div>
                    <div class="slds-modal__content modalbody">
                        <div class="content_body relative-position min-height-200">
                            <template if:true={hasFailedLeads}>
                                <span class="failed-summary-label">{failedSummary}</span>
                                <div class="exp-table-content exp-main-table-wrapper table-content main-table">
                                    <table class="slds-table" role="grid">
                                        <thead>
                                            <tr class="slds-line-height_reset exp-table-tr-cls">
                                                <th scope="col" class="col-check">
                                                    <div class="flex-center">
                                                        <lightning-input type="checkbox" variant="label-hidden" label="Select all" checked={isAllFailedSelected} onchange={handleSelectAllFailed}></lightning-input>
                                                    </div>
                                                </th>
                                                <th scope="col" class="col-no-sm"><div class="slds-truncate header-cell-padding" title="No.">No.</div></th>
                                                <th scope="col" class="col-lead"><div class="slds-truncate header-cell-padding" title="Lead ID">Lead ID</div></th>
                                                <th scope="col" class="col-lead"><div class="slds-truncate header-cell-padding" title="Received At">Received At</div></th>
                                                <th scope="col"><div class="slds-truncate header-cell-padding" title="Failure Reason">Failure Reason</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={failedLeads} for:item="lead">
                                                <tr key={lead.id}>
                                                    <td>
                                                        <div class="flex-center">
                                                            <lightning-input type="checkbox" variant="label-hidden" label="Select lead" data-id={lead.id} checked={lead.isSelected} onchange={handleFailedLeadSelect}></lightning-input>
                                                        </div>
                                                    </td>
                                                    <td>{lead.index}</td>
                                                    <td class="lead-id-cell"><div class="slds-truncate" title={lead.leadId}>{lead.leadId}</div></td>
                                                    <td>{lead.receivedOnLabel}</td>
                                                    <td class="reason-cell">{lead.reason}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>
                            <template if:false={hasFailedLeads}>
                                <div class="wizard-disabled-box mt-40">No failed leads found for this form.</div>
                            </template>
                        </div>
                        <div class="footerbtns">
                            <button class="white-btn-css" onclick={closeFailedModal}>
                                <svg width="12" height="12" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="currentColor" />
                                </svg>
                                Close
                            </button>
                            <button class="white-btn-css red-text-btn" disabled={isFailedActionDisabled} onclick={handleDiscardSelected}>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" height="14" width="14">
                                    <path d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875Z" stroke-width="0.0625"></path>
                                </svg>
                                Discard Selected
                            </button>
                            <button class="white-btn-css" disabled={isFailedActionDisabled} onclick={handleEditMappingAndRetry}>
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M13.0416 13.0417H8.45831M0.958313 13.0417L4.49998 12.2083L12.2441 4.46426C12.5695 4.13882 12.5695 3.61119 12.2441 3.28575L10.7142 1.75593C10.3888 1.43049 9.86115 1.43049 9.53573 1.75593L1.79165 9.50001L0.958313 13.0417Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                Edit Mapping &amp; Retry
                            </button>
                            <button class="blue-btn-css" disabled={isFailedActionDisabled} onclick={handleRetrySelected}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="23 4 23 10 17 10"></polyline>
                                    <polyline points="1 20 1 14 7 14"></polyline>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                                </svg>
                                Retry Selected
                            </button>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <c-message-popup onconfirmation={handleConfirmation}></c-message-popup>
    </div>
</template>
