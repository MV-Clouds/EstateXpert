<template>
  <template if:true={showSpinner}>
    <c-spinner-component></c-spinner-component>
  </template>
  <div class="img-main-div">
    <div class="sub-main-header-css">
      <div class="header-block-css">
        Listing Media
      </div>
      <div class="header-buttons">
        <button class="exp-blue-btn-css" onclick={saveChanges} disabled={disableEnableBtn} aria-label="Save Changes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H16L21 8V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21Z"
              stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M17 21V13H7V21" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M7 3V8H15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <template if:false={isMobileOrTablet}>Save Changes</template>
        </button>
        <button class="exp-white-btn-css" onclick={cancelChanges} disabled={disableEnableBtn} aria-label="Cancel">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
              fill="#0176D3" />
          </svg>
          <template if:false={isMobileOrTablet}>Cancel</template>
        </button>
        <button class="exp-blue-btn-css" onclick={modalPopup} aria-label="Add New Files">
          <svg width="14" height="14" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 6.75H6.75V12H5.25V6.75H0V5.25H5.25V0H6.75V5.25H12V6.75Z" fill="white" />
          </svg>
          <template if:false={isMobileOrTablet}>Add New Files</template>
        </button>
        <button class="exp-white-btn-css" onclick={toDeleteAllMedia} disabled={isAllDelete} aria-label="Delete All">
          <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16" fill="#0176d3" width="14" height="14">
              <path
                  d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z"
                  stroke-width="0.0625"></path>
          </svg>
          <template if:false={isMobileOrTablet}>Delete All</template>
        </button>
      </div>
    </div>

    <template if:true={isData}>
      <div class="main-div-continer">
        <div class="section-container">
          <div class="image-tab-container">
            <div class="tab-menu">
              <ul>
                <li onclick={tabing} data-name="Sort On exposeData"><a class="active-tab" data-tab-id="tab1">Sort On
                    Expose</a></li>
                <li onclick={tabing} data-name="Sort On websiteData"><a data-tab-id="tab2">Sort On Website</a></li>
                <li onclick={tabing} data-name="Sort On portalData Feed"><a data-tab-id="tab3">Sort On Portal Feed</a>
                </li>
              </ul>
            </div>

            <div class="image-tab active-tab-content" data-id="tab1">
              <div class="sort-container">
                <div class="sorting-btn">
                  <button class="sort-btn-white" onclick={getExpose}>
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M12 6.75H6.75V12H5.25V6.75H0V5.25H5.25V0H6.75V5.25H12V6.75Z" fill="#0176D3" />
                    </svg>
                    Add All
                  </button>
                  <button class="sort-btn-white" onclick={clearExpose}>
                    <svg width="12" height="12" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                        fill="#0176D3" />
                    </svg>
                    Clear All
                  </button>
                  <button class="sort-btn-white" onclick={showImages} data-name="Expose">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                        fill="#0176D3" />
                    </svg>
                    View All
                  </button>
                </div>
              </div>
              <div class="dragable-container" ondragover={handleDragOver} ondrop={handledDrop} data-type="exposeData">
                <template for:each={exposeData} for:item="imageUrl" for:index="index">
                  <div key={imageUrl.Id} data-index={index} style={imageUrl.displayStyle} class="dropable-image"
                    ondragenter={handleDragEnter} ondragleave={handleDragLeave}>
                    <div class="image-thumb-cross" onclick={deleteIcon} data-id={imageUrl.Id} data-field="MVEX__IsOnExpose__c">
                      <svg width="10" height="10" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                          d="M7.0999 7.5L4.3999 4.8L1.6999 7.5L0.899902 6.7L3.5999 4L0.899902 1.3L1.6999 0.5L4.3999 3.2L7.0999 0.5L7.8999 1.3L5.1999 4L7.8999 6.7L7.0999 7.5Z"
                          fill="white" />
                      </svg>
                    </div>
                    <img src={imageUrl.MVEX__BaseUrl__c} alt="Image" draggable="true" ondragstart={handleDragStart}
                      data-index={index} onerror={handleImageError}></img>
                  </div>
                </template>
              </div>
            </div>

            <div class="image-tab" data-id="tab2">
              <div class="sort-container">
                <div class="sorting-btn">
                  <button class="sort-btn-white" onclick={getWebsite}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z" fill="#0176D3" />
                    </svg>
                    Add All
                  </button>
                  <button class="sort-btn-white" onclick={clearWebsite}>
                    <svg width="12" height="12" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                        fill="#0176D3" />
                    </svg>
                    Clear All
                  </button>
                  <button class="sort-btn-white" onclick={showImages} data-name="Website">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                        fill="#0176D3" />
                    </svg>
                    View All
                  </button>
                </div>
              </div>
              <div class="dragable-container" ondragover={handleDragOver} ondrop={handledDrop} data-type="websiteData">
                <template for:each={websiteData} for:item="imageUrl" for:index="index">
                  <div key={imageUrl.Id} data-index={index} style={imageUrl.displayStyle} class="dropable-image"
                    ondragenter={handleDragEnter} ondragleave={handleDragLeave}>
                    <div class="image-thumb-cross" onclick={deleteIcon} data-id={imageUrl.Id} data-field="MVEX__IsOnWebsite__c">
                      <svg width="10" height="10" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                          d="M7.0999 7.5L4.3999 4.8L1.6999 7.5L0.899902 6.7L3.5999 4L0.899902 1.3L1.6999 0.5L4.3999 3.2L7.0999 0.5L7.8999 1.3L5.1999 4L7.8999 6.7L7.0999 7.5Z"
                          fill="white" />
                      </svg>
                    </div>
                    <img key={imageUrl.Id} src={imageUrl.MVEX__BaseUrl__c} alt="Image" draggable="true"
                      ondragstart={handleDragStart} data-index={index} onerror={handleImageError}></img>
                  </div>
                </template>
              </div>
            </div>

            <div class="image-tab" data-id="tab3">
              <div class="sort-container">
                <div class="sorting-btn">
                  <button class="sort-btn-white" onclick={getPortal}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z" fill="#0176D3" />
                    </svg>
                    Add All
                  </button>
                  <button class="sort-btn-white" onclick={clearPortal}>
                    <svg width="12" height="12" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                        fill="#0176D3" />
                    </svg>
                    Clear All
                  </button>
                  <button class="sort-btn-white" onclick={showImages} data-name="Portal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                        fill="#0176D3" />
                    </svg>
                    View All
                  </button>
                </div>
              </div>
              <div class="dragable-container" ondragover={handleDragOver} ondrop={handledDrop} data-type="portalData">
                <template for:each={portalData} for:item="imageUrl" for:index="index">
                  <div key={imageUrl.Id} data-index={index} style={imageUrl.displayStyle} class="dropable-image"
                    ondragenter={handleDragEnter} ondragleave={handleDragLeave}>
                    <div class="image-thumb-cross" onclick={deleteIcon} data-id={imageUrl.Id} data-field="MVEX__IsOnPortalFeed__c">
                      <svg width="10" height="10" viewBox="0 0 8 8" fill="none">
                        <path
                          d="M7.0999 7.5L4.3999 4.8L1.6999 7.5L0.899902 6.7L3.5999 4L0.899902 1.3L1.6999 0.5L4.3999 3.2L7.0999 0.5L7.8999 1.3L5.1999 4L7.8999 6.7L7.0999 7.5Z"
                          fill="white" />
                      </svg>
                    </div>
                    <img key={imageUrl.Id} src={imageUrl.MVEX__BaseUrl__c} alt="Image" draggable="true"
                      ondragstart={handleDragStart} data-index={index} onerror={handleImageError}></img>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>

        <div class="exp-main-content-cls">
          <div class="exp-table-content" id="exp-table-content">
            <table aria-multiselectable="true" class="slds-table slds-table_fixed-layout slds-table_resizable-cols"
              role="grid" aria-label="Images & Media">
            <thead>
              <tr class="slds-line-height_reset fields-names exp-table-tr-cls">
                <th class="thumbnail-col" scope="col">
                  <div class="slds-truncate" title="Thumbnail">Thumbnail</div>
                </th>
                <th aria-sort="none" data-id="Name" onclick={sortClick}
                  class="title-col slds-is-resizable slds-is-sortable slds-cell_action-mode exp-sorting-header"
                  scope="col">
                  <div class="slds-text-link_reset exp-sort-cover" role="button" tabindex="0">
                    <span class="slds-assistive-text">Sort by: </span>
                    <div class="slds-has-flexi-truncate">
                      <span class="slds-truncate" title="Title">Title</span>
                      <span class="slds-icon_container slds-icon-utility-arrowdown">
                        <svg data-index="Name" class="exp-arrow-icon" viewBox="0 0 384 512"
                          xmlns="http://www.w3.org/2000/svg">
                          <path
                            d="M374.6 246.6C368.4 252.9 360.2 256 352 256s-16.38-3.125-22.62-9.375L224 141.3V448c0 17.69-14.33 31.1-31.1 31.1S160 465.7 160 448V141.3L54.63 246.6c-12.5 12.5-32.75 12.5-45.25 0s-12.5-32.75 0-45.25l160-160c12.5-12.5 32.75-12.5 45.25 0l160 160C387.1 213.9 387.1 234.1 374.6 246.6z" />
                        </svg>
                      </span>
                    </div>
                  </div>
                </th>
                <th aria-sort="none" data-id="MVEX__Size__c" onclick={sortClick}
                  class="size-col slds-is-resizable slds-is-sortable slds-cell_action-mode exp-sorting-header"
                  scope="col">
                  <div class="slds-text-link_reset exp-sort-cover" role="button" tabindex="0">
                    <span class="slds-assistive-text">Sort by: </span>
                    <div class="slds-has-flexi-truncate">
                      <span class="slds-truncate" title="Size (kb)">Size (kb)</span>
                      <span class="slds-icon_container slds-icon-utility-arrowdown">
                        <svg data-index="MVEX__Size__c" class="exp-arrow-icon" viewBox="0 0 384 512"
                          xmlns="http://www.w3.org/2000/svg">
                          <path
                            d="M374.6 246.6C368.4 252.9 360.2 256 352 256s-16.38-3.125-22.62-9.375L224 141.3V448c0 17.69-14.33 31.1-31.1 31.1S160 465.7 160 448V141.3L54.63 246.6c-12.5 12.5-32.75 12.5-45.25 0s-12.5-32.75 0-45.25l160-160c12.5-12.5 32.75-12.5 45.25 0l160 160C387.1 213.9 387.1 234.1 374.6 246.6z" />
                        </svg>
                      </span>
                    </div>
                  </div>
                </th>
                <th class="tags-col" scope="col">
                  <div class="slds-truncate" title="Tags">Tags</div>
                </th>
                <th class="status-col" scope="col">
                  <div class="slds-truncate" title="Status">Status</div>
                </th>
                <th class="actions-col" scope="col">
                  <div class="slds-truncate" title="Actions">Actions</div>
                </th>
              </tr>
            </thead>
            <tbody>
              <template for:each={pagedData} for:item="item" for:index="index">
                <tr class={item.rowClass} key={item.Id} aria-selected="false">
                  <td data-label="Thumbnail" class="slds-cell_action-mode" role="gridcell">
                    <div class="thumbnail-cell">
                      <div class="thumbnail-wrapper"
                        data-recid={item.Id} data-index={index}
                        data-description={item.Name} data-src={item.MVEX__BaseUrl__c}
                        data-exturl={item.MVEX__ExternalLink__c} data-size={item.MVEX__Size__c}
                        data-mimetype={item.MVEX__MimeType__c} onclick={handleImgClick}
                        title="Click to preview">
                        <img src={item.MVEX__BaseUrl__c}
                          class="slds-avatar slds-avatar_rectangle slds-avatar_large listing-img" alt="Thumbnail"
                          draggable="false" onerror={handleImageError} />
                        <div class="thumbnail-overlay">
                          <div class="thumbnail-preview-btn">
                            <svg width="16" height="16" fill="#ffffff" xmlns="http://www.w3.org/2000/svg"
                              viewBox="0 0 52 52" enable-background="new 0 0 52 52" xml:space="preserve">
                              <path
                                d="M51.8,25.1C47.1,15.6,37.3,9,26,9S4.9,15.6,0.2,25.1c-0.3,0.6-0.3,1.3,0,1.8C4.9,36.4,14.7,43,26,43 s21.1-6.6,25.8-16.1C52.1,26.3,52.1,25.7,51.8,25.1z M26,37c-6.1,0-11-4.9-11-11s4.9-11,11-11s11,4.9,11,11S32.1,37,26,37z">
                              </path>
                              <path d="M26,19c-3.9,0-7,3.1-7,7s3.1,7,7,7s7-3.1,7-7S29.9,19,26,19z">
                              </path>
                            </svg>
                          </div>
                        </div>
                      </div>
                    </div>
                  </td>
                  <td data-label="Title" class="slds-cell_action-mode exp-truncate-css" role="gridcell"
                    title={item.Name}>
                    <div class="slds-truncate center-trancate-text">
                      {item.Name}
                    </div>
                  </td>
                  <td data-label="Size (kb)" class="slds-cell_action-mode" role="gridcell"
                    title={item.MVEX__Size__c}>
                    <div class="slds-truncate center-trancate-text">
                      {item.MVEX__Size__c}
                    </div>
                  </td>
                  <td data-label="Tags" class="slds-cell_action-mode exp-truncate-css" role="gridcell" title={item.tagsDisplay}>
                    <div class="slds-truncate center-trancate-text">
                      {item.tagsDisplay}
                    </div>
                  </td>
                  <td data-label="Status" class="slds-cell_action-mode exp-truncate-css" role="gridcell" title={item.statusDisplay}>
                    <div class="slds-truncate center-trancate-text">
                      {item.statusDisplay}
                    </div>
                  </td>
                  <td data-label="Actions" class="slds-cell_action-mode actions-cell" role="gridcell">
                    <div class="action-dropdown-wrapper">
                      <button class={item.actionButtonClass}
                        data-id={item.Id}
                        onclick={toggleActionMenu}
                        aria-haspopup="true"
                        aria-expanded={item.isActionMenuOpen}
                        title="Actions">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                          <circle cx="5" cy="12" r="2.25"></circle>
                          <circle cx="12" cy="12" r="2.25"></circle>
                          <circle cx="19" cy="12" r="2.25"></circle>
                        </svg>
                      </button>
                      <template if:true={item.isActionMenuOpen}>
                        <div class={item.actionMenuClass} onclick={handleDropdownClick}>
                          <div class="exp-action-menu-item"
                            data-key={item.Id} data-url={item.MVEX__BaseUrl__c}
                            data-name={item.Name} data-isexternal={item.MVEX__Size__c}
                            onclick={handleMenuDownload}>
                            <div class="exp-menu-icon exp-menu-icon-download">
                              <svg width="15" height="15" viewBox="0 0 14 14" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                  d="M13.0417 8.45834V11.375C13.0417 11.5408 12.9758 11.6997 12.8586 11.8169C12.7414 11.9342 12.5825 12 12.4167 12H1.58333C1.41754 12 1.25867 11.9342 1.14146 11.8169C1.02425 11.6997 0.958336 11.5408 0.958336 11.375V8.45834M3.875 5.54167L7 8.66667M7 8.66667L10.125 5.54167M7 8.66667V2"
                                  stroke="#212529" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
                              </svg>
                            </div>
                            <span class="exp-menu-label">Download</span>
                          </div>
                          <div class="exp-action-menu-item"
                            data-key={item.Id} data-url={item.MVEX__BaseUrl__c}
                            data-tags={item.MVEX__Tags__c} data-name={item.Name}
                            onclick={handleMenuEdit}>
                            <div class="exp-menu-icon exp-menu-icon-edit">
                              <svg width="15" height="15" viewBox="0 0 14 14" fill="none"

                            onclick={handleMenuDelete}>
                            <div class="exp-menu-icon exp-menu-icon-delete">
                              <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 16 16" fill="#000000" width="14" height="14">
                                <path

            </tbody>
          </table>
        </div>

        <!-- FOOTER / PAGINATION -->
        <div class="exp-pagination-div">
          <div class="exp-page-size-container">
            <label class="exp-page-size-label">Rows per page : </label>
            <select class="exp-page-size-select" onchange={handlePageSizeChange}>
              <template for:each={pageSizeOptions} for:item="opt">
                <option key={opt.value} value={opt.value} selected={opt.isSelected}>
                  {opt.label}
                </option>
              </template>
            </select>
          </div>

          <div class="exp-pagination-right">
            <span class="exp-results-info">{recordCountInfo}</span>

            <div class="exp-btn-cover">
              <div class="exp-pagination-container">
                <button class="exp-pagination-btn-css" disabled={isFirstPage} onclick={handlePrevious}>
                  <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52" viewBox="0 0 520 520" fill="#fff">
                    <path
                      d="M342 477 134 272c-6-6-6-16 0-22L342 45c6-6 16-6 22 0l22 22c6 6 6 16 0 22L221 250c-6 6-6 16 0 22l163 161c6 6 6 16 0 22l-22 22c-5 5-14 5-20 0z" />

                </button>

                <template for:each={pageNumbers} for:item="page">
                  <template if:false={page.isEllipsis}>
                    <button key={page.number} data-id={page.number} class={page.className} onclick={handlePageChange}>
                      {page.number}
                    </button>
                  </template>
                  <template if:true={page.isEllipsis}>
                    <span key={page.number} class="exp-pagination-ellipsis">...</span>
                  </template>
                </template>

                <button class="exp-pagination-btn-css" disabled={isLastPage} onclick={handleNext}>
                  <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52" viewBox="0 0 520 520" fill="#fff">
                    <path
                      d="M178 477l208-205c6-6 6-16 0-22L178 45c-6-6-16-6-22 0l-22 22c-6 6-6 16 0 22l163 161c6 6 6 16 0 22L134 433c-6 6-6 16 0 22l22 22c6 6 16 6 22 0z" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>
    <template if:false={isData}>
      <div class="exp-no-data-container">
        <img src="/resource/MVEX__emptyState" alt="" draggable="false">
        <div class="exp-no-data-message">No images are available for this listing.</div>
      </div>
    </template>


    <div lwc:dom="manual" class="download-container"></div>

    <template if:true={isEdit}>
      <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open slds-modal_medium">
        <div class="slds-modal__container edit-details-modal-container">
          <div class="slds-modal__close exp-close-icon-css" onclick={closePopupEdit}>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                fill="#1F2937" />
            </svg>
          </div>

          <div class="slds-modal__header exp-pop-up-header-css">
            <h1 class="slds-modal__title slds-hyphenate" tabindex="-1">Edit Media Details</h1>
          </div>
          <div class="slds-modal__content modalbody" id="modal-content-id-1">
            <div class="content-body">
              <div class="edit-field-group">
                <label class="edit-name-label"><abbr title="required" class="slds-required">*</abbr>Name</label>
                <lightning-input onchange={storeImgName} value={currentImgName} label="Name"
                  variant="label-hidden"></lightning-input>
              </div>

              <div class="edit-field-group slds-m-top_medium">
                <lightning-dual-listbox name="tags" label="Tags" source-label="Available" selected-label="Selected"
                  options={tagOptions} value={selectedTags} size="4" onchange={handleTagsChange}>
                </lightning-dual-listbox>
              </div>

              <div class="edit-field-group slds-m-top_medium">
                <lightning-dual-listbox name="status" label="Status" source-label="Available" selected-label="Selected"
                  options={statusOptions} value={selectedStatus} size="3" onchange={handleStatusChange}>
                </lightning-dual-listbox>
              </div>
            </div>
            <div class="edit-modal-footerbtns">
              <button class="exp-white-btn-css" aria-label="Cancel and close" onclick={closePopupEdit}>
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                    fill="currentColor" />
                </svg>
                Close
              </button>
              <button class="exp-blue-btn-css" onclick={confirmEdit}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor" />
                </svg>
                Save
              </button>
            </div>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template if:true={isPopup}>
      <c-aws-file-uploader property-id={propertyId} onclose={closePopupModal}
        oncloseandrefresh={closePopupAndRefresh}></c-aws-file-uploader>
    </template>

    <template if:true={isdelete}>
      <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
          <div class="slds-modal__close exp-close-icon-css" onclick={closePopup}>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                fill="#1F2937" />
            </svg>
          </div>

          <div class="slds-modal__header exp-pop-up-header-css">
            <h1 class="slds-modal__title slds-hyphenate" tabindex="-1">Delete Media</h1>
          </div>
          <div class="slds-modal__content modalbody">
            <div class="content-body delete-modal-font-css">
              <p>Are you sure to delete Media?</p>
            </div>
            <div class="edit-modal-footerbtns">
              <button class="exp-white-btn-css" onclick={closePopup}>
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                    fill="currentColor" />
                </svg>
                No
              </button>
              <button class="exp-red-btn-css" onclick={handleDelete}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor" />
                </svg>
                Yes
              </button>
            </div>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template if:true={isDeleteAll}>
      <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
          <div class="slds-modal__close exp-close-icon-css" onclick={closePopup}>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                fill="#1F2937" />
            </svg>
          </div>

          <div class="slds-modal__header exp-pop-up-header-css">
            <h1 class="slds-modal__title slds-hyphenate" tabindex="-1">Delete All Media</h1>
          </div>
          <div class="slds-modal__content modalbody">
            <div class="content-body delete-modal-font-css">
              <p>Are you sure to delete all Media?</p>
            </div>
            <div class="edit-modal-footerbtns">
              <button class="exp-white-btn-css" aria-label="Cancel and close" onclick={closePopup}>
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                    fill="currentColor" />
                </svg>
                No
              </button>
              <button class="exp-red-btn-css" onclick={deleteAllMedia}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor" />
                </svg>
                Yes
              </button>
            </div>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </div>

  <template if:true={showImagePreview}>
    <div class="slds-modal slds-fade-in-open listing-image-preview" style='background: rgba(0, 0, 0, 0.8);' role="dialog"
      aria-modal="true">
      <div class="image-control-bar" style="background: #0000008c;" onclick={stopEventPropogation}>
        <div class="image-title">
          <lightning-icon icon-name="doctype:image" title="Image" size="medium"></lightning-icon>
          <h2>{previewImageTitle}</h2>
        </div>
        <div class="close-img" onclick={closeImagePreview}>
          <lightning-icon icon-name="utility:close" title="close" size="small"></lightning-icon>
        </div>
      </div>
      <div class="img-preview-container">
        <template if:true={isImageHavePreview}>
          <img src={previewImageSrc} onload={handleImageLoaded} onerror={handleImageError}
            onclick={stopEventPropogation} />
        </template>
        <template if:false={isImageHavePreview}>
          <h2 style="color: white; font-size: 1rem;"> Sorry, This Image Preview Does Not Supported</h2>
        </template>
        <template if:true={previewImgSpinner}>
          <div class="slds-spinner_container" style="position: absolute; background : #04040466">
            <div class="slds-spinner--brand  slds-spinner slds-spinner--large slds-is-relative" role="alert">
              <span class="slds-assistive-text">Loading</span>
              <div class="slds-spinner__dot-a"></div>
              <div class="slds-spinner__dot-b"></div>
            </div>
          </div>
        </template>
      </div>
      <div if:true={isNextAndPreviousBtn} class="next-previous-btn">
        <template if:true={notFirstImg}>
          <div class="previous-img-btn" onclick={changeImg} data-name="Previous_Image">
            <lightning-icon icon-name="utility:chevronleft" title="Previous" size="small"></lightning-icon>
          </div>
        </template>
        <template if:true={notLastImg}>
          <div class="next-img-btn" onclick={changeImg} data-name="Next_Image">
            <lightning-icon icon-name="utility:chevronright" title="Next" size="small"></lightning-icon>
          </div>
        </template>
      </div>
    </div>
  </template>
</template>
