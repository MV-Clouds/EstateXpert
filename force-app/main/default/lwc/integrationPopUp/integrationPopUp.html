<template>
    <template if:true={isLoading}>
        <c-spinner-component></c-spinner-component>
    </template>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <div class="slds-modal__close close-icon-css" onclick={closeModal}>
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                            fill="#1F2937" />
                    </svg>
                </div>

                <div class="slds-modal__header blue-header">
                    <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">{integrationname}
                        Integration</h1>
                </div>
                <div class="slds-modal__content modalbody">
                    <div class="content_body">
                        <div class="body-cover">
                            <div class="image-container">
                                <img src="/resource/MVEX__integrationPopupImg" alt="Integration Graphic"
                                    class="integration-image" draggable="false">
                            </div>
                            <div class="content-section">
                                <div class="input-cover">
                                    <template for:each={formFields} for:item="field">
                                        <lightning-input key={field.id} label={field.label} value={field.value}
                                            placeholder={field.placeholder} onchange={handleInputChange}
                                            data-id={field.id} class="custom-input" required={field.required}>
                                        </lightning-input>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="footerbtns">
                        <button class="white-btn-css" onclick={closeModal}>
                            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                    fill="currentColor" />
                            </svg>
                            Cancel
                        </button>
                        <button class="blue-btn-css" onclick={saveDetails} disabled={saveDisable}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                    fill="currentColor" />
                            </svg>
                            Save
                        </button>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
