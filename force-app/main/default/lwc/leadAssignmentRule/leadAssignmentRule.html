<template>
    <template if:true={isLoading}>
        <c-spinner-component></c-spinner-component>
    </template>
    <div class="wrapper">
        <div class="rules-container">
            <div class="header-new-btn">
                <!-- Email Notification compact toggle -->
                <div class="email-notif-toggle-inline">
                    <svg viewBox="0 0 16 16" height="15" width="20" fill="#000000" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M2 2h12c0.36819999999999997 0 0.6666666666666666 0.29847999999999997 0.6666666666666666 0.6666666666666666v10.666666666666666c0 0.36819999999999997 -0.29846666666666666 0.6666666666666666 -0.6666666666666666 0.6666666666666666H2c-0.36818666666666666 0 -0.6666666666666666 -0.29846666666666666 -0.6666666666666666 -0.6666666666666666V2.6666666666666665c0 -0.36818666666666666 0.29847999999999997 -0.6666666666666666 0.6666666666666666 -0.6666666666666666Zm11.333333333333332 2.82528L8.047866666666666 9.558666666666666 2.6666666666666665 4.810626666666666V12.666666666666666h10.666666666666666V4.825279999999999ZM3.0076399999999994 3.333333333333333l5.033626666666667 4.441333333333333L13.000666666666667 3.333333333333333H3.0076399999999994Z"
                            stroke-width="0.6667"></path>
                    </svg>
                    <span class="email-notif-label">Email Notify</span>
                    <label class="email-toggle-switch">
                        <input type="checkbox" checked={emailNotificationEnabled} onchange={handleEmailToggle} />
                        <span class="email-toggle-slider"></span>
                    </label>
                </div>
                <template if:true={hasUnsavedChanges}>
                    <button class="exp-blue-btn-css" onclick={saveOrderChanges}>
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"
                            lwc-7de60ikrj="">
                            <path
                                d="M13.5 0H1.5C0.671573 0 0 0.671573 0 1.5V14.5C0 15.3284 0.671573 16 1.5 16H14.5C15.3284 16 16 15.3284 16 14.5V2.5L13.5 0ZM8 14C6.34315 14 5 12.6569 5 11C5 9.34315 6.34315 8 8 8C9.65685 8 11 9.34315 11 11C11 12.6569 9.65685 14 8 14ZM11 3H2V1H11V3Z"
                                fill="white" lwc-7de60ikrj="" cursorshover="true"></path>
                        </svg>
                        Save Order
                    </button>
                </template>
                <button class="exp-blue-btn-css" onclick={openNewRulePopup}>
                    <svg width="12" height="12" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 8H8V14H6V8H0V6H6V0H8V6H14V8Z" fill="currentColor" />
                    </svg>
                    New Rule
                </button>
            </div>
            <template if:true={isRulesAvailable}>
                <div class="rules-list" ondragover={handleDragOver} ondrop={handleDrop}>
                    <template for:each={userGroups} for:item="group" for:index="index">
                        <div key={group.Id} class="rule-item" draggable="true" data-index={index}
                            ondragstart={handleDragStart}>
                            <div class="rule-header">
                                <span class="rule-drag-icon">
                                    <svg height="18" width="18" viewBox="0 0 16 16" fill="#a0b2c6"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M7.333333333333333 7.333333333333333V3.88562L6.114379999999999 5.104566666666667 5.171573333333333 4.161759999999999 8 1.3333333333333333l2.8284000000000002 2.828426666666666 -0.9427999999999999 0.9428066666666666L8.666666666666666 3.88562V7.333333333333333h3.447733333333333l-1.2189999999999999 -1.2189533333333333 0.9428666666666665 -0.9428066666666666L14.666666666666666 8l-2.8284000000000002 2.8284000000000002 -0.9428666666666665 -0.9427999999999999L12.1144 8.666666666666666H8.666666666666666v3.447733333333333l1.2189333333333332 -1.2189999999999999 0.9427999999999999 0.9428666666666665L8 14.666666666666666l-2.828426666666666 -2.8284000000000002 0.9428066666666666 -0.9428666666666665L7.333333333333333 12.1144V8.666666666666666H3.88562l1.2189466666666666 1.2189333333333332 -0.9428066666666666 0.9427999999999999L1.3333333333333333 8l2.828426666666666 -2.828426666666666 0.9428066666666666 0.9428066666666666L3.88562 7.333333333333333H7.333333333333333Z"
                                            stroke-width="0.6667"></path>
                                    </svg>
                                </span>
                                <button class="action-div dropdown-btn" onclick={toggleConditions} data-index={index}>
                                    <lightning-icon icon-name={group.visibleIconName} alternative-text="Filter" colo
                                        size="x-small"></lightning-icon>
                                </button>
                                <span class="rule-serial">{group.serialNumber}</span>
                                <span class="rule-user">Assigned User: {group.displayUserName}</span>
                                <div class="rule-actions">
                                    <button class="action-div" onclick={openEditRulePopup} data-index={index}>
                                        <svg width="16" height="16" viewBox="0 0 14 14" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M13.0416 13.0417H8.45831M0.958313 13.0417L4.49998 12.2083L12.2441 4.46426C12.5695 4.13882 12.5695 3.61119 12.2441 3.28575L10.7142 1.75593C10.3888 1.43049 9.86115 1.43049 9.53573 1.75593L1.79165 9.50001L0.958313 13.0417Z"
                                                stroke="#212529" stroke-width="1.25" stroke-linecap="round"
                                                stroke-linejoin="round" />
                                        </svg>
                                    </button>
                                    <button class="delete-div" onclick={openDeleteConfirmation} data-index={index}>
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#212529"
                                            stroke="#212529" stroke-width="0.6" stroke-linejoin="round" width="15"
                                            height="15">
                                            <path
                                                d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z"
                                                stroke-width="0.0625"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class={group.conditionsBlockClass}>
                                <div class="conditions-list">
                                    <p>Logic: {group.displayLogicalExpression}</p>
                                    <template for:each={group.conditions} for:item="condition">
                                        <div key={condition.Id} class="condition-item slds-p-around_medium">
                                            <span class="slds-text-body_regular">{condition.order}.
                                                {condition.displayCondition}</span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={isRulesAvailable}>
                <div class="exp-no-data-container">
                    <img src="/resource/MVEX__emptyState" alt="" draggable="false">
                    <div class="exp-no-data-message">No Rules Found</div>
                </div>
            </template>

            <!-- Default Assignee Section -->
            <div class="default-assignee-section">
                <div class="default-assignee-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1Z"
                            fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5"
                            stroke-linejoin="round" />
                    </svg>
                    Default Assignee
                    <span class="default-assignee-hint">Fallback when no rule matches</span>
                </div>

                <!-- Configured card -->
                <template if:true={hasDefaultAssignee}>
                    <div class="default-assignee-card">
                        <div class="default-assignee-info">
                            <span class="default-user-avatar">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5" />
                                    <path d="M4 20C4 17 7.58 14 12 14C16.42 14 20 17 20 20" stroke="currentColor"
                                        stroke-width="1.5" stroke-linecap="round" />
                                </svg>
                            </span>
                            <span class="default-user-name">{defaultAssigneeDisplayName}</span>
                        </div>
                        <div class="default-assignee-actions">
                            <button class="action-div" onclick={openDefaultAssigneePopup} title="Edit Default Assignee">
                                <svg width="15" height="15" viewBox="0 0 14 14" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M13.0416 13.0417H8.45831M0.958313 13.0417L4.49998 12.2083L12.2441 4.46426C12.5695 4.13882 12.5695 3.61119 12.2441 3.28575L10.7142 1.75593C10.3888 1.43049 9.86115 1.43049 9.53573 1.75593L1.79165 9.50001L0.958313 13.0417Z"
                                        stroke="#212529" stroke-width="1.25" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </button>
                            <button class="delete-div" onclick={removeDefaultAssignee} title="Remove Default Assignee">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#212529"
                                    stroke="#212529" stroke-width="0.6" stroke-linejoin="round" width="15" height="15">
                                    <path
                                        d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z"
                                        stroke-width="0.0625"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </template>

                <!-- Empty / not-configured card -->
                <template if:false={hasDefaultAssignee}>
                    <button class="default-empty-card" onclick={openDefaultAssigneePopup}>
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14 8H8V14H6V8H0V6H6V0H8V6H14V8Z" fill="currentColor" />
                        </svg>
                        Set Default Assignee
                    </button>
                </template>
            </div>
        </div>

        <!-- Configure Default Assignee Popup -->
        <template if:true={showDefaultAssigneePopup}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="default-modal-heading"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__close exp-close-icon-css" onclick={closeDefaultAssigneePopup}>
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                fill="#1F2937" />
                        </svg>
                    </div>
                    <div class="slds-modal__header blue-header">
                        <h1 id="default-modal-heading" class="slds-modal__title slds-hyphenate" tabindex="-1">
                            {defaultAssigneePopupTitle}</h1>
                    </div>
                    <div class="slds-modal__content modalbody">
                        <div class="content_body">
                            <div class="form-group">
                                <p class="default-assignee-popup-hint">
                                    This user will be assigned when no assignment rule conditions are matched.
                                </p>
                                <div class="condition-row align-baseline">
                                    <div class="input-div-css">
                                        <label class="slds-form-element__label">Default Assignee User</label>
                                        <lightning-combobox options={userOptions} value={defaultAssigneeUser}
                                            onchange={handleDefaultUserChange} placeholder="Select User"
                                            variant="label-hidden">
                                        </lightning-combobox>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="footerbtns">
                            <button class="exp-white-btn-css" onclick={closeDefaultAssigneePopup}>
                                <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                        fill="currentColor" />
                                </svg>
                                Cancel
                            </button>
                            <button class="exp-blue-btn-css" onclick={saveDefaultAssignee}>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                        fill="currentColor" />
                                </svg>
                                Save
                            </button>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Rule Popup (Add/Edit) -->
        <template if:true={showRulePopup}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">
                    <div class="slds-modal__close exp-close-icon-css" onclick={closeRulePopup}>
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                fill="#1F2937" />
                        </svg>
                    </div>
                    <div class="slds-modal__header blue-header">
                        <h1 class="slds-modal__title slds-hyphenate" tabindex="-1">{rulePopupTitle}</h1>
                    </div>
                    <div class="slds-modal__content modalbody">
                        <div class="content_body">
                            <div class="form-group">
                                <div class="condition-row align-baseline">
                                    <div class="input-div-css">
                                        <label class="slds-form-element__label">Assigned User</label>
                                        <lightning-combobox options={userOptions} value={currentRule.selectedUser}
                                            onchange={handleUserChange} placeholder="Select User"
                                            variant="label-hidden"></lightning-combobox>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="condition-heading">
                                    <label class="slds-form-element__label">Conditions</label>
                                    <button class="exp-blue-btn-css" onclick={addNewCondition}
                                        disabled={isConditionLimitReached}>
                                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path d="M14 8H8V14H6V8H0V6H6V0H8V6H14V8Z" fill="currentColor" />
                                        </svg>
                                        Add Condition
                                    </button>
                                </div>
                                <template if:true={currentRule.conditions.length}>
                                    <div class="exp-main-content-cls">
                                        <div class="exp-table-content popup-exp-table-content">
                                            <table class="slds-table slds-table_cell-buffer">
                                                <thead>
                                                    <tr>
                                                        <th scope="col">
                                                            <div>No.</div>
                                                        </th>
                                                        <th scope="col">
                                                            <div>Contact Field</div>
                                                        </th>
                                                        <th scope="col">
                                                            <div>Operator</div>
                                                        </th>
                                                        <th scope="col" class="value-width-css">
                                                            <div>Value</div>
                                                        </th>
                                                        <th scope="col" class="actions">
                                                            <div>Action</div>
                                                        </th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={currentRule.conditions} for:item="condition"
                                                        for:index="conditionIndex">
                                                        <tr key={condition.Id}>
                                                            <td data-label="No.">
                                                                <div class="index-display">{condition.order}</div>
                                                            </td>
                                                            <td data-label="Lead Field">
                                                                <div class="combobox_cls">
                                                                    <lightning-combobox options={sortedFieldOptions}
                                                                        value={condition.selectedField}
                                                                        data-condition-index={conditionIndex}
                                                                        onchange={handleFieldChange}
                                                                        placeholder="Select Field"
                                                                        dropdown-alignment="auto"
                                                                        variant="label-hidden">
                                                                    </lightning-combobox>
                                                                </div>
                                                            </td>
                                                            <td data-label="Condition">
                                                                <div class="combobox_cls">
                                                                    <lightning-combobox
                                                                        options={condition.conditionOptions}
                                                                        value={condition.selectedCondition}
                                                                        data-condition-index={conditionIndex}
                                                                        onchange={handleConditionChange}
                                                                        placeholder="Select Condition"
                                                                        dropdown-alignment="auto"
                                                                        variant="label-hidden">
                                                                    </lightning-combobox>
                                                                </div>
                                                            </td>
                                                            <td data-label="Value">
                                                                <div class="combobox_cls">
                                                                    <template if:true={condition.isCombobox}>
                                                                        <lightning-combobox
                                                                            options={condition.valueOptions}
                                                                            value={condition.selectedValue}
                                                                            data-condition-index={conditionIndex}
                                                                            onchange={handleValueChange}
                                                                            placeholder="Select Value"
                                                                            dropdown-alignment="auto"
                                                                            variant="label-hidden">
                                                                        </lightning-combobox>
                                                                    </template>
                                                                    <template if:true={condition.isReference}>
                                                                        <lightning-record-picker
                                                                            object-api-name={condition.referenceObject}
                                                                            value={condition.selectedValue}
                                                                            data-condition-index={conditionIndex}
                                                                            onchange={handleValueChange}
                                                                            placeholder="Select Record"
                                                                            label="Reference" variant="label-hidden">
                                                                        </lightning-record-picker>
                                                                    </template>
                                                                    <template if:false={condition.isCombobox}>
                                                                        <template if:false={condition.isReference}>
                                                                            <lightning-input type={condition.inputType}
                                                                                value={condition.selectedValue}
                                                                                data-condition-index={conditionIndex}
                                                                                onchange={handleValueChange}
                                                                                placeholder={condition.placeholder}
                                                                                variant="label-hidden">
                                                                            </lightning-input>
                                                                        </template>
                                                                    </template>
                                                                </div>
                                                            </td>
                                                            <td data-label="Actions">
                                                                <div class="action-btn">
                                                                    <template if:true={canDeleteCondition}>
                                                                        <button class="exp-delete-icon-css"
                                                                            data-condition-index={conditionIndex}
                                                                            onclick={deleteCondition}>
                                                                            <svg width="14" height="14"
                                                                                viewBox="0 0 14 14" fill="none"
                                                                                xmlns="http://www.w3.org/2000/svg">
                                                                                <path
                                                                                    d="M2.62502 3.45834L3.32598 11.5194C3.40087 12.3807 4.12187 13.0417 4.98638 13.0417H9.01369C9.87819 13.0417 10.5992 12.3807 10.674 11.5194L11.375 3.45834M5.12502 3.25V2.625C5.12502 1.70453 5.87119 0.958336 6.79169 0.958336H7.20835C8.12885 0.958336 8.87502 1.70453 8.87502 2.625V3.25M1.16669 3.45834H12.8334"
                                                                                    stroke="currentColor"
                                                                                    stroke-width="1.25"
                                                                                    stroke-linecap="round"
                                                                                    stroke-linejoin="round" />
                                                                            </svg>
                                                                        </button>
                                                                    </template>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="form-group">
                                <label class="slds-form-element__label">Custom Logic</label>
                                <lightning-input type="text" value={currentRule.logicalExpression}
                                    onchange={handleLogicChange} placeholder="e.g., (1 AND 2) OR 3"
                                    disabled={isLogicDisabled} variant="label-hidden"></lightning-input>
                                <template if:true={logicError}>
                                    <p class="logic-error-css">{logicError}</p>
                                </template>
                                <p class="logic-hint">
                                    <template if:true={isLogicDisabled}>
                                        Add more than 1 condition to enable custom logic.
                                    </template>
                                    <template if:false={isLogicDisabled}>
                                        Use condition numbers with AND/OR operators (e.g., (1 AND 2) OR 3). All
                                        condition numbers must be included. Leave blank for all AND.
                                    </template>
                                </p>
                            </div>
                        </div>
                        <div class="footerbtns">
                            <button class="exp-white-btn-css" onclick={closeRulePopup}>
                                <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                        fill="currentColor" />
                                </svg>
                                Cancel
                            </button>
                            <button class="exp-blue-btn-css" onclick={saveRule}>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                        fill="currentColor" />
                                </svg>
                                Save
                            </button>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Delete Confirmation Popup -->
        <template if:true={showDeleteConfirmation}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__close exp-close-icon-css" onclick={closeDeleteConfirmation}>
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                fill="#1F2937" />
                        </svg>
                    </div>
                    <div class="slds-modal__header blue-header">
                        <h1 class="slds-modal__title slds-hyphenate" tabindex="-1">Confirmation</h1>
                    </div>
                    <div class="slds-modal__content modalbody map-confirm-modal delete_modal_font_css"
                        id="modal-content-id-1">
                        <div class="content_body map-confirm-content">
                            <p class="slds-text-align_center con-msg">Are you sure you want to delete this rule?</p>
                        </div>
                        <div class="footerbtns">
                            <button class="exp-white-btn-css" onclick={closeDeleteConfirmation}>
                                <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                        fill="currentColor" />
                                </svg>
                                Cancel
                            </button>
                            <button class="exp-red-btn-css" onclick={confirmDelete}>
                                <svg class="confirm-delete-icon" width="14" height="14" viewBox="0 0 14 14" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M2.62502 3.45834L3.32598 11.5194C3.40087 12.3807 4.12187 13.0417 4.98638 13.0417H9.01369C9.87819 13.0417 10.5992 12.3807 10.674 11.5194L11.375 3.45834M5.12502 3.25V2.625C5.12502 1.70453 5.87119 0.958336 6.79169 0.958336H7.20835C8.12885 0.958336 8.87502 1.70453 8.87502 2.625V3.25M1.16669 3.45834H12.8334"
                                        stroke="#FFFFFF" stroke-width="1.25" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
</template>
