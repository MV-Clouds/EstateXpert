<template>
    <template if:false={isDirectAccess}>
        <template if:true={isLoading}>
            <c-spinner-component></c-spinner-component>
        </template>
        <div class="wrapper">
                <div class="exp-main-content-cls">
                    <div class="navbar slds-m-around_small">
                        <div class="save-btn">
                            <button onclick={addNewPair} class="exp-blue-btn-css">
                                <svg width="12" height="12" viewBox="0 0 14 14" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M14 8H8V14H6V8H0V6H6V0H8V6H14V8Z" fill="currentColor" />
                                </svg>
                                <template if:false={isMobileOrTablet}>Add</template>
                            </button>
                            <button disabled={savebutton} onclick={handleAddPairClick} class="exp-blue-btn-css">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59L9 16.17Z"
                                        fill="currentColor" />
                                </svg>
                                <template if:false={isMobileOrTablet}>Save Changes</template>
                            </button>
                            <button disabled={isRevertDisabled} onclick={revertChanges} class="exp-blue-btn-css">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M12 5V1L7 6L12 11V7C15.31 7 18 9.69 18 13C18 16.31 15.31 19 12 19C8.69 19 6 16.31 6 13H4C4 17.42 7.58 21 12 21C16.42 21 20 17.42 20 13C20 8.58 16.42 5 12 5Z"
                                        fill="currentColor" />
                                </svg>
                                <template if:false={isMobileOrTablet}>Revert Changes</template>
                            </button>
                            <button onclick={handleDefaults} class="exp-blue-btn-css">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M13 3C8.03 3 4 7.03 4 12H1L4.89 15.89L4.96 16.03L9 12H6C6 8.13 9.13 5 13 5C16.87 5 20 8.13 20 12C20 15.87 16.87 19 13 19C11.07 19 9.32 18.21 8.06 16.94L6.64 18.36C8.27 19.99 10.51 21 13 21C17.97 21 22 16.97 22 12C22 7.03 17.97 3 13 3ZM12 8V13L16.28 15.54L17 14.33L13.5 12.25V8H12Z"
                                        fill="currentColor" />
                                </svg>
                                <template if:false={isMobileOrTablet}>Restore Defaults</template>
                            </button>
                        </div>
                    </div>

                    <template if:true={isDropDownpairAvailable}>
                        <div class="exp-table-content">
                            <table class="slds-table slds-table_fixed-layout">
                                <thead>
                                    <tr class="exp-table-tr-cls">
                                        <th scope="col" class="mf-sno-col">
                                            <div class="display_cls">No.</div>
                                        </th>
                                        <th scope="col" class="mf-field-col">
                                            <div>Listing Field</div>
                                        </th>
                                        <th scope="col" class="mf-field-col">
                                            <div>Property Field</div>
                                        </th>
                                        <th scope="col" class="mf-action-col">
                                            <div>Action</div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={dropDownPairsWithIndex} for:item="pair">
                                        <tr key={pair.id}>
                                            <td data-label="S.No.">
                                                <div class="index-display">{pair.displayIndex}</div>
                                            </td>

                                            <!-- Listing Field -->
                                            <td data-label="Listing Field">
                                                <div class="combobox_cls">
                                                    <div class="custom-combobox">
                                                        <input type="text" class="combobox-input"
                                                            value={pair.listingInputValue}
                                                            placeholder="Search Listing Field&#8230;"
                                                            data-index={pair._index} data-field="listing"
                                                            onfocus={handleComboFocus} onblur={handleComboBlur}
                                                            oninput={handleSearchInput}
                                                            autocomplete="off" />
                                                        <span class="combobox-chevron">
                                                            <svg width="12" height="8" viewBox="0 0 12 8" fill="none"
                                                                xmlns="http://www.w3.org/2000/svg">
                                                                <path d="M1 1L6 6L11 1" stroke="currentColor"
                                                                    stroke-width="1.5" stroke-linecap="round"
                                                                    stroke-linejoin="round" />
                                                            </svg>
                                                        </span>
                                                        <template if:true={pair.listingOpen}>
                                                            <div class="combobox-dropdown">
                                                                <template for:each={pair.listingFiltered} for:item="opt">
                                                                    <div key={opt.value} class={opt.itemClass}
                                                                        data-value={opt.value} data-index={pair._index}
                                                                        data-field="listing"
                                                                        onmousedown={handleOptionSelect}>
                                                                        {opt.label}
                                                                    </div>
                                                                </template>
                                                                <template if:true={pair.listingHasNoResults}>
                                                                    <div class="combobox-no-results">No results found</div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </td>

                                            <!-- Property Field -->
                                            <td data-label="Property Field">
                                                <div class="combobox_cls">
                                                    <div class="custom-combobox">
                                                        <input type="text" class="combobox-input"
                                                            value={pair.propertyInputValue}
                                                            placeholder={pair.propertyPlaceholder} data-index={pair._index}
                                                            data-field="property" onfocus={handleComboFocus}
                                                            onblur={handleComboBlur} oninput={handleSearchInput}
                                                            disabled={pair.isPropertyDisabled} autocomplete="off" />
                                                        <span class="combobox-chevron">
                                                            <svg width="12" height="8" viewBox="0 0 12 8" fill="none"
                                                                xmlns="http://www.w3.org/2000/svg">
                                                                <path d="M1 1L6 6L11 1" stroke="currentColor"
                                                                    stroke-width="1.5" stroke-linecap="round"
                                                                    stroke-linejoin="round" />
                                                            </svg>
                                                        </span>
                                                        <template if:true={pair.propertyOpen}>
                                                            <div class="combobox-dropdown">
                                                                <template for:each={pair.propertyFiltered} for:item="opt">
                                                                    <div key={opt.value} class={opt.itemClass}
                                                                        data-value={opt.value} data-index={pair._index}
                                                                        data-field="property"
                                                                        onmousedown={handleOptionSelect}>
                                                                        {opt.label}
                                                                    </div>
                                                                </template>
                                                                <template if:true={pair.propertyHasNoResults}>
                                                                    <div class="combobox-no-results">No results found</div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </td>

                                            <td data-label="Actions">
                                                <div class="action-btn">
                                                    <button class="exp-delete-icon-css" data-id={pair._index}
                                                        onclick={deletePair}>
                                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#000000" height="16" width="16">
                                                            <path d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z" stroke-width="0.0625"></path>
                                                        </svg>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination Footer -->
                        <div class="exp-pagination-div">
                            <div class="exp-page-size-container">
                                <label class="exp-page-size-label">Rows per page : </label>
                                <select class="exp-page-size-select" onchange={handlePageSizeChange}>
                                    <template for:each={pageSizeOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value} selected={opt.isSelected}>
                                            {opt.label}
                                        </option>
                                    </template>
                                </select>
                            </div>
                            <div class="exp-pagination-right">
                                <span class="exp-results-info">{recordCountInfo}</span>
                                <div class="exp-btn-cover">
                                    <div class="exp-pagination-container">
                                        <button class="exp-pagination-btn-css" disabled={isFirstPage}
                                            onclick={handlePrevious}>
                                            <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52"
                                                viewBox="0 0 520 520" fill="#fff">
                                                <path
                                                    d="M342 477 134 272c-6-6-6-16 0-22L342 45c6-6 16-6 22 0l22 22c6 6 6 16 0 22L221 250c-6 6-6 16 0 22l163 161c6 6 6 16 0 22l-22 22c-5 5-14 5-20 0z" />
                                            </svg>
                                        </button>
                                        <template for:each={pageNumbers} for:item="page">
                                            <template if:false={page.isEllipsis}>
                                                <button key={page.number} data-id={page.number}
                                                    class={page.className} onclick={handlePageChange}>
                                                    {page.number}
                                                </button>
                                            </template>
                                            <template if:true={page.isEllipsis}>
                                                <span key={page.number} class="exp-pagination-ellipsis">...</span>
                                            </template>
                                        </template>
                                        <button class="exp-pagination-btn-css" disabled={isLastPage}
                                            onclick={handleNext}>
                                            <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52"
                                                viewBox="0 0 520 520" fill="#fff">
                                                <path
                                                    d="m179 44 207 205c6 6 6 16 0 22L179 476c-6 6-16 6-22 0l-22-22c-6-6-6-16 0-22l163-161c6-6 6-16 0-22L136 88c-6-6-6-16 0-22l22-22c6-5 15-5 21 0z" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:false={isDropDownpairAvailable}>
                        <div class="exp-no-data-container">
                            <img src="/resource/MVEX__emptyState" alt="" draggable="false">
                            <div class="exp-no-data-message">No Data Found</div>
                        </div>
                    </template>
                </div>
        </div>

        <!-- Modal section -->
        <template if:true={showConfirmationModal}>
            <div class="slds-backdrop slds-backdrop_open"></div>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__close exp-close-icon-css" onclick={closeConfirmationModal}>
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                fill="#1F2937" />
                        </svg>
                    </div>

                    <div class="slds-modal__header blue-header">
                        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Confirmation
                        </h1>
                    </div>
                    <div class="slds-modal__content modalbody" id="modal-content-id-1">
                        <div class="content_body">
                            <p class="slds-text-align_center con-msg">Are you sure you want to save the changes?</p>
                        </div>
                        <div class="footerbtns">
                            <button class="exp-white-btn-css" onclick={closeConfirmationModal}>
                                <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                        fill="currentColor" />
                                </svg>
                                <template if:false={isMobileOrTablet}>Cancel</template>
                            </button>
                            <button class="exp-blue-btn-css" onclick={handleConfirmAddPair}>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
                                        fill="currentColor" />
                                </svg>
                                <template if:false={isMobileOrTablet}>Save</template>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </template>
    </template>

    <template if:true={isDirectAccess}>
        <div class="slds-grid slds-wrap slds-align_absolute-center full-page-container">
            <div class="invalid-access">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
                        fill="currentColor" />
                </svg>
                <h1>Invalid Access Path</h1>
                <p>This page can only be accessed from the Control Center. Please navigate to Control Center to
                    configure listing and property mappings.</p>
            </div>
        </div>
    </template>
</template>
