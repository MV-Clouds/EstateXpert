<template>
  <template lwc:if={showPopup}>
    <template lwc:if={isPopupType}>
      <!-- ==== ====== ====== POPUP Type ================ -->
      <template lwc:if={showDoneBtn}>
        <div class="popupOuterContainer" style={loadStyle}>
          <div class="popupContainer">
            <div class="popupBody">
              <div class="contentSection">
                <div class="titleDiv">
                  <h2>{title}</h2>
                </div>
                <div class="messageDiv">
                  <p>{message}</p>
                </div>
                <div class="doneBtn" onclick={closeModal} data-type="popup">
                  <div>Okay</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template lwc:if={isWarning}> 
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <div class="slds-modal__close exp-close-icon-css" data-name="not-conform" onclick={handleConfirmation}>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" data-name="not-conform">
                    <path data-name="not-conform"
                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                fill="#1F2937" />
                </svg>
            </div>

            <div class="slds-modal__header blue-header">
                <h1 class="slds-modal__title slds-hyphenate" tabindex="-1">{title}</h1>
            </div>
          <div class="slds-modal__content modalbody">
            <div class="content_body">
              <div class="delete_modal_font_css">
                <p>{message}</p>
              </div>
                </div>
            <div class="footerbtns">
              <button class="exp-white-btn-css" data-name="not-conform" onclick={handleConfirmation}>
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" data-name="not-conform">
                  <path data-name="not-conform" d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="currentColor"/>
                </svg>
                No
              </button>
              <button class="exp-blue-btn-css" data-name="conform" onclick={handleConfirmation}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" data-name="conform">
                  <path data-name="conform" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
                </svg>
                Yes
              </button>
                </div>
            </div>
        </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
      </template>
    </template>
  </template>
</template>
