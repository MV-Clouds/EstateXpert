<template>
  <template lwc:if={showPopup}>
    <template lwc:if={isPopupType}>
      <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
          
          <!-- CLOSE ICON -->
          <div class="slds-modal__close exp-close-icon-css" onclick={handleCloseModal}>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="#1F2937" />
            </svg>
          </div>

          <!-- HEADER -->
          <div class="exp-popup-header">
            <div class="exp-popup-header-left">
              <div class="exp-popup-icon-box" style={loadStyle}>
                <!-- Warning Icon -->
                <template lwc:if={isWarning}>
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5.99L19.53 19H4.47L12 5.99ZM12 2L1 21H23L12 2ZM13 16H11V18H13V16ZM13 10H11V14H13V10Z" fill={statusIconColor}/>
                  </svg>
                </template>
                <!-- Success Icon -->
                <template lwc:if={isSuccess}>
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59L9 16.17Z" fill={statusIconColor}/>
                  </svg>
                </template>
                <!-- Error Icon -->
                <template lwc:if={isError}>
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z" fill={statusIconColor}/>
                  </svg>
                </template>
              </div>
              <div class="exp-popup-title-group">
                <h2 class="exp-popup-title">{title}</h2>
              </div>
            </div>
            
          </div>

          <!-- BODY -->
          <div class="slds-modal__content slds-p-around_medium" style="text-align: left; font-size: 14px; color: #4b5563;">
            <p>{message}</p>
          </div>

          <!-- FOOTER -->
          <div class="exp-popup-footer">
            <div>
                <button type="button" class="exp-white-btn-css" data-name="not-conform" onclick={handleCloseModal}>
                  <svg width="12" height="12" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="currentColor"/>
                  </svg>
                  No
                </button>
            </div>
            <div class="exp-popup-footer-right">
              <template lwc:if={showDoneBtn}>
                <button type="button" class="exp-blue-btn-css" onclick={handleCloseModal}>
                  Okay
                </button>
              </template>
              <template lwc:if={isWarning}>
                <button type="button" class="exp-blue-btn-css" data-name="conform" onclick={handleConfirmation}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
                  </svg>
                  Yes
                </button>
              </template>
            </div>
          </div>
          
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </template>
</template>
