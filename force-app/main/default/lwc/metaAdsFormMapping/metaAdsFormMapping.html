                                    </template>
                                </template>

                                <button class="exp-pagination-btn-css" disabled={isLastPage} onclick={handleNext}>
                                    <svg xmlns="http://www.w3.org/2000/svg" height="52" width="52" viewBox="0 0 520 520" fill="#fff">
                                        <path d="m179 44 207 205c6 6 6 16 0 22L179 476c-6 6-16 6-22 0l-22-22c-6-6-6-16 0-22l163-161c6-6 6-16 0-22L136 88c-6-6-6-16 0-22l22-22c6-5 15-5 21 0z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- No Records -->
            <template if:false={hasMappings}>
                <div class="no-records-message">
                    <div class="empty-state">
                        <div class="empty-state__content">
                            <div class="empty-icon">
                                <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
                                    <path d="M4 4h16v16H4z" stroke="#0176D3" stroke-width="1.5" stroke-linejoin="round"></path>
                                    <path d="M8 9h8M8 13h5" stroke="#0176D3" stroke-width="1.5" stroke-linecap="round"></path>
                                </svg>
                            </div>
                            <div class="empty-state__message">No Data Available to Show.</div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- ─── Single-Page Mapping Wizard Modal ──────────────────────────────── -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                class="slds-modal slds-fade-in-open slds-modal_medium section_css">
                <div class="slds-modal__container">

                    <div class="slds-modal__close close-icon-css" onclick={closeModal}>
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="#1F2937" />
                        </svg>
                    </div>

                    <div class="slds-modal__header blue-header">
                        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Form Mapping Wizard</h1>
                    </div>

                    <div class="slds-modal__content modalbody" id="modal-content-id-1">
                        <div class="content_body relative-position">

                            <!-- Spinner Overlay (covers entire screen while loading) -->
                            <template if:true={isModalLoading}>
                                <c-spinner-component></c-spinner-component>
                            </template>

                            <template if:false={isEditingMode}>
                                <!-- Section 1: Select Page (always visible) -->
                                <div class="wizard-section">
                                    <div class="wizard-step-label">
                                        <span class="wizard-step-badge">Step 1</span>
                                        Select Meta Page
                                    </div>
                                    <lightning-combobox
                                        name="pageSelect"
                                        label=""
                                        value={selectedPageId}
                                        placeholder="-- Choose a Page --"
                                        options={pageOptions}
                                        onchange={handlePageSelection}
                                        disabled={isPageSelectionDisabled}
                                        variant="label-hidden"
                                        class="custom-combobox">
                                    </lightning-combobox>
                                    <template if:false={pageOptions.length}>
                                        <div class="wizard-hint-error">No pages found. Please connect a Meta Ads account first.</div>
                                    </template>
                                </div>

                                <div class="wizard-divider"></div>

                                <!-- Section 2: Select Form (disabled until page selected) -->
                                <div class="wizard-section">
                                    <div class="wizard-step-label">
                                        <span class="wizard-step-badge" class:wizard-step-badge-disabled={isFormSectionDisabled}>Step 2</span>
                                        Select Lead Form
                                        <template if:true={isFormSectionDisabled}>
                                            <span class="wizard-hint-muted">&nbsp;— Select a page first</span>
                                        </template>
                                    </div>
                                    <lightning-combobox
                                        name="formSelect"
                                        label=""
                                        value={selectedFormId}
                                        placeholder="-- Choose a Form --"
                                        options={formOptions}
                                        onchange={handleFormSelection}
                                        disabled={isFormDropdownDisabled}
                                        variant="label-hidden"
                                        class="custom-combobox">
                                    </lightning-combobox>
                                    <template if:true={showNoFormsMsg}>
                                        <div class="wizard-hint-error">No available forms. All forms may already be mapped.</div>
                                    </template>
                                </div>
                            </template>

                            <template if:true={isEditingMode}>
                                <div class="edit-context">
                                    <span>Page: <strong>{editPageName}</strong></span>
                                    <span>Form: <strong>{editFormName}</strong></span>
                                </div>
                            </template>

                            <!-- Section 3: Field Mappings (only visible after form selected) -->
                            <template if:true={hasFormFields}>
                                <template if:false={isEditingMode}>
                                    <div class="wizard-divider"></div>
                                </template>
                                <div class="wizard-section">
                                    <div class="wizard-step-label">
                                        <template if:false={isEditingMode}>
                                            <span class="wizard-step-badge">Step 3</span>
                                        </template>
                                        Map Fields
                                    </div>
                                    <div class="wizard-hint-muted wizard-hint-spaced">
                                        Match each Salesforce Contact field to a Meta form field or a fixed custom value.
                                    </div>
                                    <template if:true={currentFormFields.length}>
                                        <div class="mapping-header-new">
                                            <div class="mapping-header-col">SALESFORCE CONTACT FIELD</div>
                                            <div class="mapping-header-col right-col">META FORM FIELD / CUSTOM VALUE</div>
                                        </div>
                                        <template for:each={currentFormFields} for:item="field">
                                            <div key={field.key} class={field.rowClass}>
                                                <div class="mapping-col left-col">
                                                    <div class="sf-field-box" title={field.label}>
                                                        {field.label}
                                                    </div>
                                                    <template if:true={field.required}>
                                                        <span class="required-badge">REQUIRED</span>
                                                    </template>
                                                </div>
                                                
                                                <div class="mapping-icon-swap">
                                                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><g stroke-width="0"></g><g stroke-linecap="round" stroke-linejoin="round"></g><g><path d="M9.25 6.12V4.87h-7l3-2.05-.71-1L.59 4.45A1.29 1.29 0 0 0 0 5.5a1.29 1.29 0 0 0 .59 1l3.93 2.72.71-1-3-2.06zm6.16 3.33-3.93-2.67-.71 1 3 2.06h-7v1.25h7.03l-3 2 .71 1 3.93-2.67a1.23 1.23 0 0 0 0-2.1z"></path></g></svg>
                                                </div>
                                                
                                                <div class="mapping-col right-col">
                                                    <div class="mapping-input-wrapper">
                                                        <div class="mapping-type-pill">
                                                            <button type="button" data-key={field.key} data-type="Meta Form Field" onclick={handleSourceTypeChangeFromTab} class={field.metaTabClass}>Meta Form Field</button>
                                                            <button type="button" data-key={field.key} data-type="Custom Value" onclick={handleSourceTypeChangeFromTab} class={field.customTabClass}>Custom Value</button>
                                                        </div>
                                                        
                                                        <div class="mapping-input-container">
                                                            <template if:true={field.isMetaField}>
                                                                <lightning-combobox
                                                                    data-key={field.key}
                                                                    value={field.metaField}
                                                                    options={field.metaOptions}
                                                                    onchange={handleMetaFieldChange}
                                                                    placeholder="-- Select Meta Form Field --"
                                                                    variant="label-hidden"
                                                                    class="custom-combobox mapping-secondary-input">
                                                                </lightning-combobox>
                                                            </template>
                                                            <template if:true={field.isCustomValue}>
                                                                <template if:true={field.isReferenceField}>
                                                                    <lightning-record-picker 
                                                                        data-key={field.key} 
                                                                        label={field.label} 
                                                                        placeholder="Search and select record" 
                                                                        object-api-name={field.referenceTo} 
                                                                        value={field.customValue} 
                                                                        onchange={handleReferenceChange} 
                                                                        class="mapping-secondary-input">
                                                                    </lightning-record-picker>
                                                                </template>
                                                                <template if:false={field.isReferenceField}>
                                                                    <lightning-input 
                                                                        data-key={field.key} 
                                                                        type="text" 
                                                                        value={field.customValue} 
                                                                        onchange={handleCustomValueChange} 
                                                                        placeholder="Enter custom value" 
                                                                        variant="label-hidden" 
                                                                        class="mapping-secondary-input">
                                                                    </lightning-input>
                                                                </template>
                                                            </template>
                                                            <template if:true={field.showRequiredError}>
                                                                <div class="wizard-hint-error">This required field must be mapped.</div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                    
                                                    <div class="mapping-action-delete">
                                                        <button type="button" data-key={field.key} onclick={handleRemoveField} class="delete-div" title="Delete Field" disabled={field.required}>
                                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#212529" height="16" width="16">
                                                                <path d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z" stroke-width="0.0625"></path>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                        <div class="add-field-section">
                                            <template if:false={showAddField}>
                                                <button type="button" class="add-field-btn" onclick={handleShowAddField}>
                                                    <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
                                                        <path d="M10 2V18M2 10H18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                                    </svg>
                                                    Add Field
                                                </button>
                                            </template>
                                            <template if:true={showAddField}>
                                                <div class="add-field-box">
                                                    <div class="add-field-title">Add Salesforce Lead Field</div>
                                                    <div class="add-field-controls">
                                                        <lightning-combobox value={selectedAdditionalField} options={additionalFieldOptions} onchange={handleAdditionalFieldChange} placeholder="-- Select Salesforce Field --" variant="label-hidden" class="custom-combobox add-field-combobox"></lightning-combobox>
                                                        <button type="button" class="save_btn_css" onclick={handleAddField} disabled={isAddFieldDisabled}>
                                                            Add
                                                        </button>
                                                        <button type="button" class="cancel_btn_css" onclick={handleCancelAddField}>
                                                            Cancel
                                                        </button>
                                                    </div>
                                                    <template if:false={hasAdditionalFieldOptions}>
                                                        <div class="wizard-hint-muted">All available Salesforce fields have already been added.</div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:false={currentFormFields.length}>
                                        <div class="exp-no-data-container">
                                            <img src="/resource/MVEX__emptyState" alt="" draggable="false">
                                            <div class="exp-no-data-message">No Salesforce Contact fields are available for mapping.</div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                        </div>

                        <!-- Retry Banner -->
                        <template if:true={hasPendingRetry}>
                            <div class="retry-banner">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                                {retryBannerText}
                            </div>
                        </template>

                        <!-- Footer -->
                        <div class="footerbtns">
                            <button class="cancel_btn_css" aria-label="Cancel and close" onclick={closeModal}>
                                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="currentColor" />
                                </svg>
                                Cancel
                            </button>
                            <button class="save_btn_css" disabled={isSaveDisabled} onclick={saveMapping}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor" />
                                </svg>
                                {saveButtonLabel}
                            </button>
                        </div>

                    </div>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
    <c-message-popup onconfirmation={handleConfirmation}></c-message-popup>

    <!-- ─── Failed Leads Modal ──────────────────────────────── -->
    <template if:true={isFailedLeadsModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-02" class="slds-modal slds-fade-in-open slds-modal_medium section_css">
            <div class="slds-modal__container">

                <div class="slds-modal__close close-icon-css" onclick={closeFailedLeadsModal}>
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="#1F2937" />
                    </svg>
                </div>

                <div class="slds-modal__header blue-header">
                    <h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate" tabindex="-1">Failed Webhook Leads</h1>
                </div>

                <div class="slds-modal__content modalbody" id="modal-content-id-2">
                    <div class="content_body relative-position min-height-200">
                        
                        <!-- Spinner Overlay -->
                        <template if:true={isRetrying}>
                            <c-spinner-component></c-spinner-component>
                        </template>

                        <template if:true={isFailedWizardStep1}>
                        <template if:true={failedLeads.length}>
                            <div class="exp-table-content table-content">
                                <table class="slds-table full-width">
                                    <thead>
                                        <tr class="slds-line-height_reset fields-names exp-table-tr-cls">
                                            <th class="col-checkbox header-cell-padding align-center">
                                                <lightning-input type="checkbox" variant="label-hidden" label="Select all" onchange={handleSelectAllFailedLeads} checked={isAllFailedLeadsSelected}></lightning-input>
                                            </th>
                                            <th class="header-cell-padding">No.</th>
                                            <th class="header-cell-padding">Lead ID</th>
                                            <th class="header-cell-padding">Received At</th>
                                            <th class="header-cell-padding failure-reason">Failure Reason</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={failedLeads} for:item="lead">
                                            <tr key={lead.Id}>
                                                <td class="align-center header-cell-padding">
                                                    <lightning-input type="checkbox" variant="label-hidden" label="Select lead" data-id={lead.Id} checked={lead.selected} onchange={handleFailedLeadSelection}></lightning-input>
                                                </td>
                                                <td class="header-cell-padding">{lead.index}</td>
                                                <td class="header-cell-padding">
                                                    <div class="slds-truncate" title={lead.leadId}>{lead.leadId}</div>
                                                </td>
                                                <td class="header-cell-padding">{lead.Date}</td>
                                                <td class="header-cell-padding">
                                                    <div class="slds-truncate" title={lead.reason}>{lead.reason}</div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template if:false={failedLeads.length}>
                            <div class="wizard-disabled-box mt-40 align-center">
                                No failed leads found for this form.
                            </div>
                        </template>
                        </template>
                    </div>

                    
                    <!-- Footer -->
                    <div class="footerbtns">
                        <template if:true={isFailedWizardStep1}>
                            <span class="failed-summary-label">{failedSummary}</span>
                            <button class="white-btn-css" onclick={closeFailedLeadsModal}>
                                <svg width="12" height="12" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="currentColor" />
                                </svg>
                                Close
                            </button>
                            <button class="white-btn-css red-text-btn" disabled={isFailedActionDisabled} onclick={discardSelectedFailedLeads}>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" height="14" width="14">
                                    <path d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z" stroke-width="0.0625"></path>
                                </svg>
                                Discard Selected
                            </button>
                            <button class="white-btn-css" disabled={isEditMappingDisabled} onclick={reviewSelectedFailedLead}>
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M13.0416 13.0417H8.45831M0.958313 13.0417L4.49998 12.2083L12.2441 4.46426C12.5695 4.13882 12.5695 3.61119 12.2441 3.28575L10.7142 1.75593C10.3888 1.43049 9.86115 1.43049 9.53573 1.75593L1.79165 9.50001L0.958313 13.0417Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                Edit Mapping &amp; Retry
                            </button>
                            <button class="blue-btn-css" disabled={isFailedActionDisabled} onclick={retrySelectedFailedLeads}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="23 4 23 10 17 10"></polyline>
                                    <polyline points="1 20 1 14 7 14"></polyline>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                                </svg>
                                Retry Selected
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
    



</template>
