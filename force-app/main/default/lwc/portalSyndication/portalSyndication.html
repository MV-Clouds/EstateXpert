<template>
    <div class="portal-syndication">
        <h2>Portal Syndication</h2>
        <!-- When Listing is Eligible for Portal Syndication -->
        <template if:true={isEligibleForPortals}>
            <template if:true={isDataAvailable}>
                <div class="main_content_cls">
                    <div class="table-content">
                        <table aria-multiselectable="true"
                            class="slds-table">
                        <thead>
                            <tr class="table_tr_cls">
                                <th scope="col" class="header-cell">
                                    <div>Name</div>
                                </th>
                                <th scope="col" class="header-cell">
                                    <div>Status</div>
                                </th>
                                <th scope="col" class="header-cell">
                                    <div>Action</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={portals} for:item="portal" for:index="index">
                                <tr key={portal.id}>
                                    <td data-label="Name">
                                        <div class="slds-truncate">{portal.name}</div>
                                    </td>
                                    <td data-label="Status">
                                        <span class={portal.badgeColor}>
                                            {portal.status}
                                        </span>
                                    </td>
                                    <td data-label="Action">
                                        <template if:true={portal.isPublished}>
                                            <button class="red-btn-css" onclick={handleToggleStatus} data-id={portal.id}
                                                data-pname={portal.pname} data-button-label={portal.buttonLabel}>
                                                <svg width="12" height="12" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path
                                                    d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                                    fill="white" />
                                                </svg>
                                                {portal.buttonLabel}
                                            </button>
                                        </template>
                                        <template if:false={portal.isPublished}>
                                            <button class="blue-btn-css" onclick={handleToggleStatus} data-id={portal.id}
                                                data-pname={portal.pname} data-button-label={portal.buttonLabel}>
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" fill="white"/>
                                                </svg>
                                                {portal.buttonLabel}
                                            </button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    </div>
                </div>
            </template>

            <template if:false={isDataAvailable}>
                <div class="no-data-container">
                    <img src="/resource/MVEX__emptyState" alt="" draggable="false">
                    <div class="no-data-message">No Data Found</div>
                </div>
            </template>
        </template>

        <!-- When Listing is NOT Eligible for Portal Syndication -->
        <template if:false={isEligibleForPortals}>
            <div class="requirement-screen-container">
                <div class="requirement-card">
                    <div class="requirement-icon-wrapper">
                        <svg class="requirement-header-icon" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </div>
                    <div class="requirement-header">
                        <h3 class="requirement-title">Portal Syndication Requirements</h3>
                        <p class="requirement-subtitle">
                            To publish this listing on external portals, please ensure the following conditions are met in the listing record:
                        </p>
                    </div>

                    <div class="requirement-list">
                        <!-- Requirement 1: Listing Status must be Active -->
                        <div class="requirement-item">
                            <div class="requirement-status-col">
                                <template if:true={isListingActive}>
                                    <span class="req-icon-badge req-met" title="Requirement Met">
                                        <svg viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                                        </svg>
                                    </span>
                                </template>
                                <template if:false={isListingActive}>
                                    <span class="req-icon-badge req-unmet" title="Requirement Pending">
                                        <svg viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                        </svg>
                                    </span>
                                </template>
                            </div>
                            <div class="requirement-text-col">
                                <div class="req-item-label">Listing Status</div>
                                <template if:true={isListingActive}>
                                    <div class="req-item-desc">Status is Active</div>
                                </template>
                                <template if:false={isListingActive}>
                                    <div class="req-item-desc">Status must be Active (Current: {listingStatus})</div>
                                </template>
                            </div>
                            <div class="requirement-badge-col">
                                <template if:true={isListingActive}>
                                    <span class="req-pill req-pill-met">Active</span>
                                </template>
                                <template if:false={isListingActive}>
                                    <span class="req-pill req-pill-unmet">{listingStatus}</span>
                                </template>
                            </div>
                        </div>

                        <!-- Requirement 2: Listing Allowed For Portals must be true -->
                        <div class="requirement-item">
                            <div class="requirement-status-col">
                                <template if:true={isListingAllowedForPortals}>
                                    <span class="req-icon-badge req-met" title="Requirement Met">
                                        <svg viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                                        </svg>
                                    </span>
                                </template>
                                <template if:false={isListingAllowedForPortals}>
                                    <span class="req-icon-badge req-unmet" title="Requirement Pending">
                                        <svg viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                        </svg>
                                    </span>
                                </template>
                            </div>
                            <div class="requirement-text-col">
                                <div class="req-item-label">Listing Allowed For Portals</div>
                                <template if:true={isListingAllowedForPortals}>
                                    <div class="req-item-desc">Listing Allowed For Portals is enabled</div>
                                </template>
                                <template if:false={isListingAllowedForPortals}>
                                    <div class="req-item-desc">Must be enabled in listing record</div>
                                </template>
                            </div>
                            <div class="requirement-badge-col">
                                <template if:true={isListingAllowedForPortals}>
                                    <span class="req-pill req-pill-met">Enabled</span>
                                </template>
                                <template if:false={isListingAllowedForPortals}>
                                    <span class="req-pill req-pill-unmet">Disabled</span>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <template if:true={showSpinner}>
            <lightning-spinner variant="brand" alternative-text="Loading Portals" size="medium">
            </lightning-spinner>
        </template>
    </div>
    <template if:true={isErrorPopup}>
        <div class="popup-container my_popup_container">
            <c-error-popup-for-portals jsonbody={errorBody} portalname={portalName} type={errorType}
                onhidepopup={handleHidePopup}></c-error-popup-for-portals>
        </div>
    </template>
</template>
