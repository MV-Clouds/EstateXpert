<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open slds-modal_small">
        <div class="slds-modal__container">
            <div class="slds-modal__close exp-close-icon-css" onclick={handleDialogueClose}>
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                        fill="#1F2937" />
                </svg>
            </div>

            <div class="slds-modal__header blue-header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Configure Data View
                </h1>
            </div>

            <div class="slds-modal__content background_css custom-modal-container" id="modal-content-id-1">

                <template if:true={isLoading}>
                    <c-spinner-component is-absolute="true"></c-spinner-component>
                </template>

                <div class="main-div">
                    <div class="header_container_css">
                        <div class="header-action">
                            <div class="header-block-css">
                                {featureTitle}
                            </div>
                            <button class="exp-blue-btn-css" onclick={addNewRow}>
                                <svg width="12" height="12" viewBox="0 0 16 16" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M6.85714 9.14286H0V6.85714H6.85714V0H9.14286V6.85714H16V9.14286H9.14286V16H6.85714V9.14286Z"
                                        fill="white" />
                                </svg>
                                Add Row
                            </button>
                        </div>
                    </div>

                    <div class="table-body-div">
                        <div class="tableContainer">
                            <template if:true={isDataAvailable}>
                                <div class="exp-table-content tableContainer">
                                    <table aria-multiselectable="true"
                                        class="slds-table slds-table_fixed-layout slds-table_resizable-cols record-config-table">
                                        <thead>
                                            <tr class="exp-table-tr-cls slds-line-height_reset">
                                                <th scope="col" style="width: 50px;"></th>
                                                <th scope="col" class="exp-sorting-header">
                                                    <div class="slds-truncate" title="Field">Field</div>
                                                </th>
                                                <th scope="col" class="exp-sorting-header">
                                                    <div class="slds-truncate" title="Display Format">Display Format
                                                    </div>
                                                </th>
                                                <th scope="col" class="exp-sorting-header" style="width: 80px;">
                                                    <div class="slds-truncate" title="Delete">Delete</div>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={checklistItems} for:item="item" for:index="index">
                                                <tr key={item.id} class={item.rowClass} draggable="true"
                                                    data-index={index} ondragstart={handleDragStart}
                                                    ondragover={handleDragOver} ondrop={handleDrop}
                                                    ondragleave={handleDragLeave} ondragend={handleDragEnd}>

                                                    <td>
                                                        <div class="drag-icon" title="Drag to reorder">
                                                            <svg height="18" width="18" viewBox="0 0 16 16"
                                                                fill="#a0b2c6" xmlns="http://www.w3.org/2000/svg">
                                                                <path
                                                                    d="M7.333333333333333 7.333333333333333V3.88562L6.114379999999999 5.104566666666667 5.171573333333333 4.161759999999999 8 1.3333333333333333l2.8284000000000002 2.828426666666666 -0.9427999999999999 0.9428066666666666L8.666666666666666 3.88562V7.333333333333333h3.447733333333333l-1.2189999999999999 -1.2189533333333333 0.9428666666666665 -0.9428066666666666L14.666666666666666 8l-2.8284000000000002 2.8284000000000002 -0.9428666666666665 -0.9427999999999999L12.1144 8.666666666666666H8.666666666666666v3.447733333333333l1.2189333333333332 -1.2189999999999999 0.9427999999999999 0.9428666666666665L8 14.666666666666666l-2.828426666666666 -2.8284000000000002 0.9428066666666666 -0.9428666666666665L7.333333333333333 12.1144V8.666666666666666H3.88562l1.2189466666666666 1.2189333333333332 -0.9428066666666666 0.9427999999999999L1.3333333333333333 8l2.828426666666666 -2.828426666666666 0.9428066666666666 0.9428066666666666L3.88562 7.333333333333333H7.333333333333333Z"
                                                                    stroke-width="0.6667"></path>
                                                            </svg>
                                                        </div>
                                                    </td>

                                                    <td>
                                                        <div class="combobox-cover">
                                                            <div class="combobox-input" data-index={index}
                                                                data-field="fieldName" data-id={index}
                                                                onclick={handleFocus1}>
                                                                <div class="input-show" title={item.label}>{item.label}
                                                                </div>
                                                                <div class="add-btn-class" data-index={index}
                                                                    data-field="fieldName" data-id={index}
                                                                    onclick={handleFocus1}>
                                                                    <svg width="16" height="10" viewBox="0 0 16 10"
                                                                        fill="none" xmlns="http://www.w3.org/2000/svg">
                                                                        <path d="M2 1.75L8 7.75L14 1.75"
                                                                            stroke="#131314" stroke-width="2"
                                                                            stroke-linecap="square" />
                                                                    </svg>
                                                                </div>

                                                                <template if:true={item.isFocused}>
                                                                    <div class="options-box">
                                                                        <input type="text"
                                                                            class="slds-input slds-combobox__input picklist-input"
                                                                            placeholder="Search Picklist Value"
                                                                            data-id={index} data-index={index}
                                                                            data-field="fieldName"
                                                                            onkeyup={handleSearchChange}
                                                                            onfocus={handleFocus1} onblur={handleBlur1}
                                                                            minlength="0" maxlength="25" />
                                                                        <ul class="options-cover"
                                                                            onmousedown={handlePreventDefault}>
                                                                            <template for:each={filteredFieldOptions}
                                                                                for:item="option1">
                                                                                <template
                                                                                    if:false={option1.showRightIcon}>
                                                                                    <template
                                                                                        if:false={option1.showRightRef}>
                                                                                        <li key={option1.value}
                                                                                            data-index={index}
                                                                                            data-label={option1.label}
                                                                                            data-type={option1.fieldType}
                                                                                            data-id={option1.value}
                                                                                            onclick={selectOption1}
                                                                                            class="options-value">
                                                                                            <span
                                                                                                class="slds-media__body">
                                                                                                <span
                                                                                                    class="_entity slds-truncate"
                                                                                                    title={option1.label}>{option1.label}</span>
                                                                                            </span>
                                                                                        </li>
                                                                                    </template>
                                                                                </template>
                                                                            </template>
                                                                        </ul>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </td>

                                                    <td>
                                                        <div class="slds-truncate">
                                                            <lightning-combobox options={item.picklist}
                                                                variant="label-hidden" value={item.format}
                                                                onchange={handleFormatChange} data-id={index}
                                                                disabled={item.isDisable}></lightning-combobox>
                                                        </div>
                                                    </td>

                                                    <td class="order_btn_grp">
                                                        <div class="exp-delete-icon-css" onclick={handleDelete}
                                                            data-index={index}>
                                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                                                fill="currentColor" stroke="currentColor"
                                                                stroke-width="0.6" stroke-linejoin="round" width="15"
                                                                height="15">
                                                                <path
                                                                    d="M14.76391875 2.61960625H11.5356875v-0.768625c0 -0.93390625 -0.75708125 -1.69098125 -1.69098125 -1.69098125H6.15529375c-0.9339 0 -1.69098125 0.757075 -1.69098125 1.69098125v0.768625H1.23608125c-0.35501875 0.00001875 -0.57690625 0.38434375 -0.39938125 0.6917875 0.08238125 0.142675 0.234625 0.23056875 0.39938125 0.23056875h0.768625v11.22195625c0 0.59430625 0.481775 1.07608125 1.076075 1.07608125h9.83843125c0.59430625 0 1.07608125 -0.481775 1.07608125 -1.07608125V3.5419625h0.768625c0.35501875 0 0.5769 -0.38431875 0.39939375 -0.69176875 -0.08238125 -0.14268125 -0.2346375 -0.23058125 -0.39939375 -0.2305875Zm-9.37725 -0.768625c0 -0.4245 0.344125 -0.76863125 0.768625 -0.76863125h3.6894125c0.4245 0 0.768625 0.34413125 0.768625 0.76863125v0.768625H5.38666875Zm7.686275 12.9129375c0 0.0849 -0.06883125 0.153725 -0.15373125 0.15373125H3.08078125c-0.0849 0 -0.153725 -0.068825 -0.153725 -0.15373125V3.5419625h10.1458875ZM6.61646875 6.77019375v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Zm3.6894125 0v4.91921875c0 0.3550125 -0.3843125 0.5769 -0.6917625 0.3993875 -0.1426875 -0.08238125 -0.2305875 -0.234625 -0.2305875 -0.3993875v-4.91921875c0 -0.3550125 0.3843125 -0.57689375 0.6917625 -0.3993875 0.1426875 0.08238125 0.2305875 0.234625 0.2305875 0.3993875Z"
                                                                    stroke-width="0.0625"></path>
                                                            </svg>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>
                            <template if:false={isDataAvailable}>
                                <div class="exp-no-data-container">
                                    <img src="/resource/MVEX__emptyState" alt="" draggable="false">
                                    <div class="exp-no-data-message">No Fields Are Selected. Please Add New Fields</div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="footerbtns">
                    <button class="exp-white-btn-css" aria-label="Cancel and close" onclick={handleDialogueClose}>
                        <svg width="12" height="12" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                fill="currentColor" />
                        </svg>
                        Cancel
                    </button>
                    <button class="exp-blue-btn-css" onclick={saveChecklistRecords}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor" />
                        </svg>
                        Save
                    </button>
                </div>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
