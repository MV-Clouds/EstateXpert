<template>
    <template if:true={showModal}>
        <div class="wrapper">
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">
                    <div class="slds-modal__close closs_icon_css" onclick={closeModal}>
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                fill="white" />
                        </svg>
                    </div>

                    <header class="slds-modal__header custom-header">
                        <h2 class="slds-text-heading_medium slds-hyphenate">Send Emails</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium custom-content">
                        <div class="combined-campaign-wrapper animate-fade-in">
                            <!-- Section 1: Email Details & Template Configuration -->
                            <div class="section-card">
                                <div class="section-header slds-m-bottom_small">
                                    <h2 class="section-title">Email & Template Configuration</h2>
                                </div>
                                
                                <div class="campaign-info-grid slds-m-bottom_medium">
                                    <div class="config-item">
                                        <lightning-input type="text" name="campaignName" label="Email Name"
                                            value={campaignDetails.campaignName} placeholder="Enter email name"
                                            data-id="campaignName" onchange={handleCampaignFieldChange} required
                                            class="custom-input"></lightning-input>
                                    </div>
                                    <div class="config-item">
                                        <lightning-combobox name="messagingService" label="Messaging Service"
                                            value={campaignDetails.messagingService} placeholder="Choose service..."
                                            options={messagingServiceOptions} data-id="messagingService"
                                            dropdown-alignment="auto" onchange={handleCampaignFieldChange} required
                                            class="custom-combobox"></lightning-combobox>
                                    </div>
                                </div>

                                <div class="config-grid slds-m-bottom_medium">
                                    <div class="config-item">
                                        <lightning-combobox name="templateRelatedObject"
                                            label="Select Related Object"
                                            value={campaignDetails.templateRelatedObject}
                                            options={templateObjectOptions} onchange={handleRelatedObjectChange}
                                            dropdown-alignment="auto" required class="custom-combobox">
                                        </lightning-combobox>
                                    </div>
                                    <template if:true={showSingleListingSelector}>
                                        <div class="config-item">
                                            <label class="form-label slds-m-bottom_xx-small"><span
                                                    style="color: red;">*</span> Select Listing</label>
                                            <div class="custom-combobox-container">
                                                <div class="combobox-input-wrapper"
                                                    onclick={handleListingComboboxClick}>
                                                    <input type="text" class="combobox-input"
                                                        placeholder="Search listing..." value={selectedListingName}
                                                        readonly />
                                                    <lightning-icon icon-name="utility:down" size="x-small"
                                                        class="combobox-icon"></lightning-icon>
                                                    <template if:true={selectedListing}>
                                                        <lightning-icon icon-name="utility:close" size="x-small"
                                                            class="combobox-clear-icon"
                                                            onclick={handleClearSingleListing}></lightning-icon>
                                                    </template>
                                                </div>
                                                <template if:true={isListingDropdownOpen}>
                                                    <div class="combobox-dropdown"
                                                        onclick={handleListingDropdownClick}>
                                                        <div class="combobox-search-wrapper">
                                                            <lightning-icon icon-name="utility:search"
                                                                size="x-small" class="search-icon"></lightning-icon>
                                                            <input type="text" class="combobox-search-input"
                                                                placeholder="Search listing..."
                                                                value={listingSearchTerm}
                                                                oninput={handleListingSearchInput} />
                                                        </div>
                                                        <div class="combobox-options">
                                                            <template if:true={filteredListingsOptions.length}>
                                                                <template for:each={filteredListingsOptions}
                                                                    for:item="option">
                                                                    <div key={option.value} class="combobox-option"
                                                                        data-value={option.value}
                                                                        data-label={option.label}
                                                                        onclick={handleSingleListingSelect}>
                                                                        {option.label}
                                                                    </div>
                                                                </template>
                                                            </template>
                                                            <template if:false={filteredListingsOptions.length}>
                                                                <div class="combobox-no-results">No matching
                                                                    listings found</div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="template-section">
                                    <label class="form-label slds-m-bottom_xx-small"><span style="color: red;">*</span> Email Template</label>
                                    <div class="template-input-group">
                                        <lightning-combobox variant="label-hidden" value={selectedTemplate}
                                            options={availableTemplates} onchange={handleTemplateSelect}
                                            placeholder="Choose a template..." dropdown-alignment="auto"
                                            class="custom-combobox">
                                        </lightning-combobox>
                                        <button class="blue-btn-css" onclick={handlePreviewSingleTemplate}
                                            disabled={selectedTemplateDisalbed}>
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <path
                                                    d="M12 5C6 5 2 12 2 12C2 12 6 19 12 19C18 19 22 12 22 12C22 12 18 5 12 5ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16Z"
                                                    fill="currentColor" />
                                            </svg>
                                            Preview
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Section 2: Recipients -->
                            <div class="recipient-selection-container">
                                <div class="recipient-grid">
                                    <div class="section-card recipient-list-card primary-recipients">
                                        <div class="recipient-header">
                                            <h3 class="section-title">Primary Recipients</h3>
                                            <div class="badge-count">{totalRecipientCount}</div>
                                        </div>
                                        <div class="combobox-container">
                                            <c-custom-combobox data-id="primary-combo"
                                                placeholder="Search contacts..." options={allContactOptions}
                                                onselect={handlePrimaryContactSelect} searchable="true"
                                                multiselect="true" value={selectedContacts} show-clear-button="true"
                                                class="contact-combobox"></c-custom-combobox>
                                            <template if:true={selectedContactsDetails.length}>
                                                <div class="selected-contacts-pills slds-m-top_small">
                                                    <template for:each={selectedContactsDetails} for:item="contact">
                                                        <span key={contact.id} class="custom-pill slds-pill"
                                                            title={contact.name}>
                                                            <span
                                                                class="slds-icon_container slds-icon-standard-account"
                                                                title="Account">
                                                                <lightning-icon icon-name="standard:account"
                                                                    alternative-text="Account"
                                                                    size="small"></lightning-icon>
                                                            </span>
                                                            <span class="slds-pill__label">{contact.name}</span>
                                                            <button
                                                                class="slds-button slds-button_icon slds-pill__remove"
                                                                title="Remove" name={contact.id}
                                                                onclick={handleRemovePrimaryContact}>
                                                                <lightning-icon icon-name="utility:close"
                                                                    alternative-text="Remove"></lightning-icon>
                                                                <span class="slds-assistive-text">Remove</span>
                                                            </button>
                                                        </span>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <template if:true={showBroadcastGroups}>
                                            <div class="broadcast-groups-section slds-m-top_large">
                                                <div class="section-divider">
                                                    <span>Contact Groups</span>
                                                </div>
                                                <div class="broadcast-groups-list">
                                                    <template for:each={filteredBroadcastGroups} for:item="group">
                                                        <div key={group.value}
                                                            class="group-item-card slds-m-bottom_x-small">
                                                            <input type="checkbox" id={group.value}
                                                                data-value={group.value}
                                                                onchange={handleBroadcastGroupChange}
                                                                checked={group.selected} class="group-checkbox" />
                                                            <label for={group.value} class="group-label">
                                                                <div class="group-info">
                                                                    <span class="group-name"
                                                                        title={group.label}>{group.label}</span>
                                                                    <span class="group-count">{group.contactCount}
                                                                        contacts</span>
                                                                </div>
                                                                <div class="checkbox-custom"></div>
                                                            </label>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="section-card recipient-list-card cc-recipients">
                                        <div class="recipient-header">
                                            <h3 class="section-title">CC Recipients</h3>
                                            <div class="badge-count">{selectedCCContactsDetails.length}</div>
                                        </div>
                                        <div class="combobox-container">
                                            <c-custom-combobox data-id="cc-combo" placeholder="Search for CC..."
                                                options={allContactOptions} onselect={handleCCContactSelect}
                                                searchable="true" multiselect="true" value={selectedCCContacts}
                                                show-clear-button="true"
                                                class="contact-combobox"></c-custom-combobox>
                                            <template if:true={selectedCCContactsDetails.length}>
                                                <div class="selected-contacts-pills slds-m-top_small">
                                                    <template for:each={selectedCCContactsDetails}
                                                        for:item="contact">
                                                        <span key={contact.id} class="custom-pill slds-pill pill-cc"
                                                            title={contact.name}>
                                                            <span
                                                                class="slds-icon_container slds-icon-standard-account"
                                                                title="Account">
                                                                <lightning-icon icon-name="standard:account"
                                                                    alternative-text="Account"
                                                                    size="small"></lightning-icon>
                                                            </span>
                                                            <span class="slds-pill__label">{contact.name}</span>
                                                            <button
                                                                class="slds-button slds-button_icon slds-pill__remove"
                                                                title="Remove" name={contact.id}
                                                                onclick={handleRemoveCCContact}>
                                                                <lightning-icon icon-name="utility:close"
                                                                    alternative-text="Remove"></lightning-icon>
                                                                <span class="slds-assistive-text">Remove</span>
                                                            </button>
                                                        </span>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="recipient-empty-state"
                                            if:false={selectedCCContactsDetails.length}>
                                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                                stroke-linejoin="round">
                                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                                <circle cx="9" cy="7" r="4"></circle>
                                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                            </svg>
                                            <p>Optional CC Recipients</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Footer -->
                        <footer class="custom-footer">
                            <button class="white-btn-css" onclick={closeModal}>Cancel</button>
                            <button class="blue-btn-css send-emails-btn" onclick={handleFinish} disabled={isSendDisabled}>
                                Send Emails
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                                </svg>
                            </button>
                        </footer>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
            <template if:true={isPreviewModal}>
                <c-template-preview-modal templateid={selectedTemplateId} objectname={previewObjectName}
                    template-type="Marketing Template" is-active={templateStatus}
                    onclosemodal={handleCloseModal}></c-template-preview-modal>
            </template>
        </div>
    </template>
</template>
