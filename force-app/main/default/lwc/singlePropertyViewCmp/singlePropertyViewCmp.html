<template>
    <!-- ============ Empty / error state ============ -->
    <template if:true={showEmptyState}>
        <div class="exp-no-data-container">
            <img src={emptyStateUrl} alt="No Property Found" draggable="false">
            <div class="exp-no-data-message">{errorTitle}</div>
            <div class="exp-no-sub-data-message">{errorMessage}</div>
        </div>
    </template>

    <template if:false={showEmptyState}>
        <template if:true={spinnerdatatable}>
            <c-spinner-component></c-spinner-component>
        </template>

        <template if:false={showOfferForm}>
            <template if:true={hasProperty}>
                <div class="page">

                    <!-- ============ Header ============ -->
                    <header class="page-header">
                        <div class="title-block">
                            <h1 class="page-title">{property.Name}</h1>
                            <p class="page-address">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                <span>{formattedAddress}</span>
                            </p>
                        </div>
                        <template if:true={hasAgent}>
                            <div class="agent-pill">
                                <span class="avatar avatar-sm">
                                    <template if:true={agentPhotoUrl}><img src={agentPhotoUrl} alt={agentName} /></template>
                                    <template if:false={agentPhotoUrl}>{agentInitials}</template>
                                </span>
                                <span class="agent-pill-name">{agentName}</span>
                            </div>
                        </template>
                    </header>

                    <div class="layout">
                        <div class="overview-layout">

                            <!-- ============ Gallery ============ -->
                            <section class="gallery">
                            <template if:true={hasImages}>
                                <div class="carousel" ontouchstart={handleTouchStart} ontouchend={handleTouchEnd}>
                                    <div class="carousel-inner" style={carouselStyle}>
                                        <template for:each={slides} for:item="slide">
                                            <div class="carousel-item" key={slide.Id}>
                                                <template if:true={slide.isLoading}>
                                                    <div class="image-spinner">
                                                        <lightning-spinner alternative-text="Loading image..." size="medium"></lightning-spinner>
                                                    </div>
                                                </template>
                                                <template if:true={slide.isVideo}>
                                                    <video class="carousel-image" src={slide.mediaUrl} controls playsinline
                                                        preload="metadata" data-id={slide.Id} data-index={slide.index}
                                                        onloadeddata={handleImageLoaded} onerror={handleImageError}>
                                                    </video>
                                                </template>
                                                <template if:false={slide.isVideo}>
                                                    <img class="carousel-image" src={slide.mediaUrl} alt="Property photo"
                                                        loading="lazy" data-id={slide.Id} data-index={slide.index}
                                                        onload={handleImageLoaded} onerror={handleImageError}
                                                        onclick={openPreview} />
                                                </template>
                                            </div>
                                        </template>
                                    </div>

                                    <template if:true={hasMultipleImages}>
                                        <button class="carousel-control prev" onclick={prevSlide} aria-label="Previous media">
                                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                                        </button>
                                        <button class="carousel-control next" onclick={nextSlide} aria-label="Next media">
                                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                                        </button>
                                    </template>
                                    <span class="carousel-counter">{slideCounter}</span>
                                </div>

                                <template if:true={hasMultipleImages}>
                                    <div class="thumb-strip">
                                        <template for:each={slides} for:item="slide">
                                            <button class={slide.thumbClass} key={slide.Id} data-index={slide.index}
                                                aria-label={slide.label} aria-current={slide.ariaCurrent}
                                                onclick={selectSlide}>
                                                <template if:true={slide.isVideo}>
                                                    <video src={slide.mediaUrl} muted playsinline preload="metadata"
                                                        aria-label={slide.label} data-id={slide.Id} onerror={handleImageError}>
                                                    </video>
                                                    <span class="thumb-video-indicator" aria-hidden="true">▶</span>
                                                </template>
                                                <template if:false={slide.isVideo}>
                                                    <img src={slide.mediaUrl} alt="" loading="lazy"
                                                        data-id={slide.Id} onerror={handleImageError} />
                                                </template>
                                            </button>
                                        </template>
                                    </div>
                                </template>
                            </template>
                            <template if:false={hasImages}>
                                <div class="gallery-empty">
                                    <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
                                    <p>No photos or videos available for this property yet.</p>
                                </div>
                            </template>
                            </section>

                            <!-- ============ Sticky summary card ============ -->
                            <aside class="summary-card">
                            <div class="summary-top">
                                <p class="summary-label">{priceLabel}</p>
                                <p class="summary-price">
                                    <span class="summary-price-amount">{priceAmount}</span>
                                    <template if:true={priceSuffix}><span class="summary-price-suffix">{priceSuffix}</span></template>
                                </p>
                            </div>

                            <template if:true={showSiteVisit}>
                                <span class={statusPillClass}><span class="status-dot"></span>{statusPillLabel}</span>
                            </template>

                            <template if:true={hasAgent}>
                                <div class="summary-divider"></div>
                                <div class="agent-row">
                                    <span class="avatar avatar-md">
                                        <template if:true={agentPhotoUrl}><img src={agentPhotoUrl} alt={agentName} /></template>
                                        <template if:false={agentPhotoUrl}>{agentInitials}</template>
                                    </span>
                                    <div class="agent-row-text">
                                        <p class="agent-row-name">{agentName}</p>
                                        <p class="agent-row-meta">{agentMeta}</p>
                                        <template if:true={agentMailHref}>
                                            <a class="agent-row-email" href={agentMailHref} title="Email agent">{agentEmail}</a>
                                        </template>
                                    </div>
                                    <template if:true={agentTelHref}>
                                        <a class="round-btn" href={agentTelHref} aria-label="Call agent" title="Call agent">
                                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                                        </a>
                                    </template>
                                </div>
                            </template>

                            <!-- Offer / booking -->
                            <template if:true={showOffer}>
                                <button class="btn btn-blue" onclick={makeOffer}>Make an Offer</button>
                            </template>
                            <template if:true={showBooking}>
                                <button class="btn btn-blue" onclick={makeBooking}>Make a Booking</button>
                            </template>

                            <!-- Site visit -->
                            <template if:true={showSiteVisit}>
                                <template if:true={showingDate}>
                                    <div class="showing-box">
                                        <span class="showing-icon">
                                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
                                        </span>
                                        <div class="showing-text">
                                            <p class="showing-label">Your showing</p>
                                            <p class="showing-date">{showingDate}</p>
                                            <template if:true={showingDurationLabel}>
                                                <p class="showing-meta">{showingDurationLabel}</p>
                                            </template>
                                            <template if:true={rescheduleMessage}>
                                                <p class="showing-reschedule">{rescheduleMessage}</p>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Status message (shown when no buttons are visible) -->
                                <template if:true={showStatusMessageBox}>
                                    <div class="status-note">
                                        <p>{statusMessage}</p>
                                        <template if:true={cancellationNote}>
                                            <p class="status-note-sub">{cancellationNote}</p>
                                        </template>
                                    </div>
                                </template>

                                <!-- Action buttons -->
                                <template if:false={showStatusMessageBox}>
                                    <div class="action-stack">
                                        <template if:true={showConfirmButton}>
                                            <button class="btn btn-green" onclick={confirmSiteVisit}>
                                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                                                Confirm showing
                                            </button>
                                        </template>
                                        <template if:true={showRescheduleButton}>
                                            <button class="btn btn-blue" onclick={rescheduleSiteVisit}>
                                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4M8 2v4M3 10h5"/><circle cx="16" cy="16" r="6"/><path d="M16 14v2l1 1"/></svg>
                                                Reschedule
                                            </button>
                                        </template>
                                        <template if:true={showCancelButton}>
                                            <button class="btn btn-outline" onclick={cancelSiteVisit}>
                                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                                                Cancel
                                            </button>
                                        </template>
                                        <template if:true={showReactivateButton}>
                                            <button class="btn btn-green" onclick={reactivateSiteVisit}>Reactivate Request</button>
                                        </template>
                                    </div>

                                    <template if:true={showFreeCancellationNote}>
                                        <p class="summary-note">
                                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                                            <span>Free cancellation up to 24 hours before your showing.</span>
                                        </p>
                                    </template>
                                    <!-- Change Plans note (confirmed state) -->
                                    <template if:true={showChangeLinksAfterConfirm}>
                                        <p class="summary-note">
                                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                                            <span>Need to change plans?</span>
                                        </p>
                                    </template>
                                </template>
                            </template>
                            </aside>

                            <!-- ============ About ============ -->
                            <section class="card about-card">
                            <div class="card-head">
                                <span class="card-icon">
                                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
                                </span>
                                <h2 class="card-title">About this Property</h2>
                            </div>
                            <p class="about-text">{property.MVEX__Description__c}</p>
                            <template if:true={hasHighlights}>
                                <div class="chip-row">
                                    <template for:each={highlights} for:item="h">
                                        <span class="chip" key={h.key}>
                                            <template if:true={h.isBed}>
                                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></svg>
                                            </template>
                                            <template if:true={h.isBath}>
                                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
                                            </template>
                                            <template if:true={h.isParking}>
                                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                                            </template>
                                            <template if:true={h.isArea}>
                                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                                            </template>
                                            {h.text}
                                        </span>
                                    </template>
                                </div>
                            </template>
                            </section>
                        </div>

                        <!-- ============ Property details ============ -->
                        <section class="card card-full">
                            <div class="card-head">
                                <span class="card-icon">
                                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h4M3 12h4M3 19h4M11 5h10M11 12h10M11 19h10"/></svg>
                                </span>
                                <h2 class="card-title">Property Details</h2>
                            </div>
                            <div class="details-grid">
                                <template for:each={detailRows} for:item="row">
                                    <div class="detail" key={row.label}>
                                        <p class="detail-label">{row.label}</p>
                                        <p class="detail-value">{row.value}</p>
                                    </div>
                                </template>
                            </div>
                        </section>

                        <!-- ============ Address + map ============ -->
                        <section class="card card-full">
                            <div class="card-head">
                                <span class="card-icon">
                                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                </span>
                                <h2 class="card-title">Address Details</h2>
                            </div>
                            <p class="address-text">{formattedAddress}</p>

                            <template if:true={hasAddressRows}>
                                <div class="details-grid address-grid">
                                    <template for:each={addressRows} for:item="row">
                                        <div class="detail" key={row.label}>
                                            <p class="detail-label">{row.label}</p>
                                            <p class="detail-value">{row.value}</p>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <div class="map-links">
                                <template if:true={hasValidLocation}>
                                    <button class="link-btn" onclick={openGoogleMap}>
                                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                        View on Google Map
                                    </button>
                                    <template if:false={isFullScreen}>
                                        <button class="link-btn" onclick={toggleFullMapView}>
                                            Full View
                                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
                                        </button>
                                    </template>
                                    <template if:true={isFullScreen}>
                                        <button class="map-close-btn" onclick={toggleFullMapView}>Close Full View</button>
                                    </template>
                                </template>
                            </div>
                            <div class={mapClass}>
                                <lightning-map map-markers={mapMarkers} center={mapCenter} zoom-level={mapZoom} list-view="hidden"></lightning-map>
                            </div>
                            <template if:false={hasValidLocation}>
                                <div class="map-error"><p>Map unavailable: Location data not provided.</p></div>
                            </template>
                        </section>
                    </div>
                </div>
            </template>
        </template>

        <!-- ============ Image preview ============ -->
        <template if:true={Show_ImagePreview}>
            <div class="preview" role="dialog" aria-modal="true" onclick={closeImagePreview}>
                <div class="preview-bar" onclick={stopEventPropagation}>
                    <h2 class="preview-title">{PreviewImageTitle}</h2>
                    <button class="preview-close" onclick={closeImagePreview} aria-label="Close preview">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="preview-stage">
                    <template if:true={Is_ImageHavePreview}>
                        <template if:true={PreviewIsVideo}>
                            <video class="preview-image" src={PreviewImageSrc} controls autoplay playsinline
                                onloadeddata={handleImageLoaded} onerror={handleImageNotLoaded}
                                onclick={stopEventPropagation} data-id={PreviewImageId}>
                            </video>
                        </template>
                        <template if:false={PreviewIsVideo}>
                            <img class="preview-image" src={PreviewImageSrc} alt={PreviewImageTitle}
                                onload={handleImageLoaded} onerror={handleImageNotLoaded}
                                onclick={stopEventPropagation} data-id={PreviewImageId} />
                        </template>
                    </template>
                    <template if:true={PreviewImgSpinner}>
                        <div class="preview-spinner">
                            <lightning-spinner alternative-text="Loading image..." size="large"></lightning-spinner>
                        </div>
                    </template>
                </div>
                <div class="preview-nav" onclick={stopEventPropagation}>
                    <button class={previousButtonClass} data-name="Previous_Image" onclick={changeImg} aria-label="Previous photo">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <button class={nextButtonClass} data-name="Next_Image" onclick={changeImg} aria-label="Next photo">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
        </template>

        <!-- ============ Confirm popup (original flow) ============ -->
        <template if:true={showConfirmPopup}>
            <div class="modal-overlay">
                <section class="modal" role="dialog" aria-modal="true">
                    <header class="modal-head">
                        <h2 class="modal-title">Confirm Site Visit</h2>
                        <button class="modal-close" title="Close" onclick={closePopup}>
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                            <span class="assistive">Close</span>
                        </button>
                    </header>
                    <div class="modal-body">
                        <p>Are you sure you want to confirm the site visit for {showingDate}?</p>
                    </div>
                    <footer class="modal-foot">
                        <button class="btn btn-ghost btn-sm" onclick={closePopup}>Cancel</button>
                        <button class="btn btn-blue btn-sm" onclick={handleConfirm}>Confirm</button>
                    </footer>
                </section>
            </div>
        </template>

        <!-- ============ Cancel popup (original flow) ============ -->
        <template if:true={showCancelPopup}>
            <div class="modal-overlay">
                <section class="modal" role="dialog" aria-modal="true">
                    <header class="modal-head">
                        <h2 class="modal-title">Cancel Site Visit</h2>
                        <button class="modal-close" title="Close" onclick={closePopup}>
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                            <span class="assistive">Close</span>
                        </button>
                    </header>
                    <div class="modal-body">
                        <p>Are you sure you want to cancel the site visit scheduled for {showingDate}?</p>
                        <lightning-input type="text" label="Reason for Cancellation" required value={cancellationReason}
                            onchange={handleReasonChange}></lightning-input>
                    </div>
                    <footer class="modal-foot">
                        <button class="btn btn-ghost btn-sm" onclick={closePopup}>No</button>
                        <button class="btn btn-danger btn-sm" onclick={handleCancel}>Yes, Cancel</button>
                    </footer>
                </section>
            </div>
        </template>

        <!-- ============ Reschedule popup (original flow) ============ -->
        <template if:true={showReschedulePopup}>
            <div class="modal-overlay">
                <section class="modal" role="dialog" aria-modal="true">
                    <header class="modal-head">
                        <h2 class="modal-title">Reschedule Site Visit</h2>
                        <button class="modal-close" title="Close" onclick={closePopup}>
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                            <span class="assistive">Close</span>
                        </button>
                    </header>
                    <div class="modal-body">
                        <lightning-input type="datetime" label="Select New Date and Time" value={newScheduleDate}
                            onchange={handleDateChange} required></lightning-input>
                    </div>
                    <footer class="modal-foot">
                        <button class="btn btn-ghost btn-sm" onclick={closePopup}>Cancel</button>
                        <button class="btn btn-blue btn-sm" onclick={handleReschedule}>Save</button>
                    </footer>
                </section>
            </div>
        </template>

        <!-- ============ Toast ============ -->
        <template if:true={showToast}>
            <div class={toastClass} role="status">
                <span class="toast-message">{toastMessage}</span>
                <button class="toast-close" onclick={handleToastClose} aria-label="Dismiss">×</button>
            </div>
        </template>
    </template>
</template>
