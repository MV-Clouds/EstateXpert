<template>
  <div class="wrapper" data-fix-position={isCalledFromGenerateDoc}>
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
      <div class="slds-modal__container" data-full-width={isCalledFromGenerateDoc}>

        <!-- Cross Icon (Outside Header, matching sendEmails & other popups) -->
        <div class="slds-modal__close closs_icon_css" onclick={closeTemplatePreview} title="Close">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="white" />
          </svg>
        </div>

        <!-- Custom Header (Centered Blue Header matching sendEmails) -->
        <header class="slds-modal__header custom-header">
          <h2 class="slds-text-heading_medium slds-hyphenate">
            Template Preview
          </h2>
        </header>

        <!-- Modal Content -->
        <div class="slds-modal__content custom-content">
          <div class="preview-layout-body">
            
            <!-- Left Panel: Preview Settings -->
            <div class="preview_leftSection" if:false={isCalledFromGenerateDoc}>
              <div class="section-card">
                <div class="section-header slds-m-bottom_small">
                  <h3 class="section-title">Preview Settings</h3>
                  <p class="section-subtitle">Select a record to merge data</p>
                </div>

                <div class="recordSelectionSection slds-m-bottom_medium">
                  <c-custom-record-picker lwc:if={recordLabelField} label={label} placeholder={placeHolder}
                    onchange={onRecordSelect} onerror={handleRecordPickerError} multiselect="false"
                    dropdown-position="center" query-object-api={objectname} label-field-api={recordLabelField}
                    label-field-type={recordLabelFieldType} description-field-api="CreatedBy.Name"
                    search-by-fields={searchByField} show-footer-button="false" additional-fields="CreatedDate"
                    disabled={disableRecordPicker}></c-custom-record-picker>
                </div>

                <div class="generate-btn-container">
                  <button class="blue-btn-css generate-btn" title="Generate Preview" onclick={generatePreview}
                    disabled={disablePreviewBtn}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    Generate Preview
                  </button>
                  <template if:true={isDownloadButtonEnable}>
                    <button class="blue-btn-css download-btn slds-m-top_small" title="Download Document" onclick={generateDocument}
                      disabled={disableGenerateBtn}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                      </svg>
                      Download PDF
                    </button>
                  </template>
                </div>
              </div>
            </div>

            <!-- Right Panel: Canvas Preview Area -->
            <div class="preview_rightSection" data-full-width={isCalledFromGenerateDoc}>
              <div class="iframe_outer" data-full-width={isCalledFromGenerateDoc}>
                <iframe lwc:if={vfGeneratePageSRC} class="generate_iframe" src={vfGeneratePageSRC} onload={fileDownloaded}
                  width="0%" height="0%"></iframe>

                <!-- Simple/PDF Template Preview -->
                <template lwc:if={showPreview}>
                  <template lwc:if={isSimpleTemplatePreview}>
                    <iframe lwc:if={vfPageSRC} class="preview_iframe" data-id="vfPage" src={vfPageSRC} width="100%"
                      height="100%" onload={contentLoaded}></iframe>
                  </template>
                </template>

                <!-- Quick/Marketing Template Preview (Summernote) -->
                <template lwc:elseif={showQuickPreview}>
                  <div class="quick_preview_css">
                    <div class="scrollable-content">
                      <div class="richText"></div>
                    </div>
                  </div>
                </template>

                <!-- Error State -->
                <template lwc:elseif={errorOccured}>
                  <div class="errorMessageContainer">
                    <div class="popupContainer">
                      <div class="popupBody">
                        <div class="topDesingSection">
                          <div class="curveDesign">
                            <svg class="ballDesignIcon" fill="none" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2" viewBox="0 0 24 24">
                              <path d="M12 8v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path>
                            </svg>
                          </div>
                        </div>
                        <div class="contentSection">
                          <div class="titleDiv">
                            <h2>{errorDetail.title}</h2>
                          </div>
                          <div class="messageDiv">
                            <p>{errorDetail.message}</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Initial / Loading State -->
                <template lwc:else>
                  <div class="loadingContainer">
                    <img class="intiImg" src={previewModalImg} draggable="false" />
                    <div class="loadingInfo">
                      {loadingInfo}
                    </div>
                  </div>
                </template>
              </div>
            </div>

          </div>
        </div>

      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </div>

  <template if:true={isSpinner}>
    <c-spinner-component></c-spinner-component>
  </template>

  <c-custom-timeout data-id="previewTimeout" ontimeoutmethod={runTimeoutMethod}></c-custom-timeout>
</template>
