<template>
    <template if:true={hasBusinessAccountConfigured}>
        <lightning-spinner alternative-text="Loading" size="small" if:true={showSpinner}></lightning-spinner>

        <template if:true={showChatWindow}>
            <div class={mainChatWindowContainerClass}>
                <!-- Backdrop for modals / drawers -->
                <div class="backdrop-div" if:true={displayBackDrop} onclick={handleBackDropClick}></div>

                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="header-left">
                        <div class="contact-avatar">
                            <span class="avatar-initials">{contactInitials}</span>
                            <span class="online-indicator" title="Connected to WhatsApp"></span>
                        </div>
                        <div class="contact-info">
                            <div class="contact-name" title={recordName}>{recordNameDisplay}</div>
                            <div class="contact-phone" title={phoneNumber}>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" class="phone-icon">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>{phoneNumberDisplay}</span>
                            </div>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button class="header-action-btn" title="Refresh messages" onclick={handleManualRefresh}>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Chat Feed -->
                <div class="chat-div" onscroll={handleScroll}>
                    <template for:each={groupedChats} for:item="group" if:false={noChatMessages}>
                        <div key={group.date} class="chat-messages-by-date-div">
                            <div class="message-date-pill">{group.date}</div>

                            <template for:each={group.messages} for:item="chat">
                                <div key={chat.Id} data-id={chat.Id} class="message-full-length-div"
                                    data-type={chat.className} onmouseleave={handleHideActions}>
                                    
                                    <div class="message">
                                        <!-- Reply-To Quote Callout -->
                                        <div class="message-preview-div" data-by={chat.replyTo.messageBy}
                                            data-reply-to={chat.replyTo.Id} onclick={handleReplyMessageClick}
                                            if:true={chat.replyTo}>
                                            <div class="message-by">{chat.replyTo.messageBy}</div>
                                            <div class="text-message-div" if:true={chat.replyTo.isText}>
                                                <div class="reply-to-text-message-div">{chat.replyTo.Message__c}</div>
                                            </div>
                                            <div if:true={chat.replyTo.isImage}>
                                                <img class="message-image-reply" src={chat.replyTo.Message__c} alt="Image" />
                                            </div>
                                            <div if:true={chat.replyTo.isVideo} class="media-reply-label">
                                                📹 Video
                                            </div>
                                            <div if:true={chat.replyTo.isAudio} class="reply-audio">
                                                🎵 {chat.replyTo.fileName}
                                            </div>
                                            <div if:true={chat.replyTo.isDoc} class="reply-audio">
                                                📄 {chat.replyTo.fileName}
                                            </div>
                                            <div if:true={chat.replyTo.isOther} class="message-other">
                                                📎 {chat.replyTo.Message_Type__c}
                                            </div>
                                            <div if:true={chat.replyTo.isTemplate}>
                                                <div class="reply-to-template-message-div" if:true={chat.replyTo.WA_Template__r}>
                                                    📋 {chat.replyTo.WA_Template__r.Template_Name__c}
                                                </div>
                                                <div class="reply-to-template-message-div" if:false={chat.replyTo.WA_Template__r}>
                                                    📋 Template
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Text Message Body -->
                                        <div class="text-message-div" if:true={chat.isText}>
                                            <div class="message-body-text">{chat.Message__c}</div>
                                        </div>

                                        <!-- Interactive / Flow Response -->
                                        <div class="text-message-div interactive-message" if:true={chat.isFlowResponse}>
                                            <div class="interactive-tag">Response</div>
                                            <div>{chat.Message__c}</div>
                                        </div>

                                        <!-- Image Message -->
                                        <div class="image-message-div" if:true={chat.isImage} data-action="open"
                                            onclick={handleToggleImagePreview}>
                                            <svg class="image-preview-close" data-action="close"
                                                onclick={handleToggleImagePreview} xmlns="http://www.w3.org/2000/svg"
                                                viewBox="0 0 384 512" height="24" width="24">
                                                <path fill="currentColor"
                                                    d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z" />
                                            </svg>
                                            <img class="message-image" src={chat.Message__c}
                                                onerror={handleImageError} alt="Photo" />
                                        </div>

                                        <!-- Video Message -->
                                        <div if:true={chat.isVideo} class="video-container">
                                            <video class="message-video" src={chat.Message__c}
                                                onerror={handleImageError} controls></video>
                                        </div>

                                        <!-- Document Message -->
                                        <div if:true={chat.isDoc} class="doc-card-container">
                                            <template if:false={chat.isAWSFile}>
                                                <div class="doc-preview-card">
                                                    <div class="doc-icon-wrap">
                                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="2">
                                                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                            <polyline points="14 2 14 8 20 8"></polyline>
                                                        </svg>
                                                    </div>
                                                    <div class="doc-meta-info">
                                                        <p class="doc-filename" title={chat.fileName}>{chat.fileName}</p>
                                                        <span class="doc-filetype">DOCUMENT</span>
                                                    </div>
                                                    <a href={chat.fileUrl} class="doc-download-btn" title="Download">
                                                        <lightning-button-icon icon-name="utility:download" size="small" variant="bare"></lightning-button-icon>
                                                    </a>
                                                </div>
                                            </template>

                                            <div if:true={chat.isAWSFile} class="doc-preview-card">
                                                <div class="doc-icon-wrap">
                                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="2">
                                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                        <polyline points="14 2 14 8 20 8"></polyline>
                                                    </svg>
                                                </div>
                                                <div class="doc-meta-info">
                                                    <p class="doc-filename" title={chat.fileName}>{chat.fileName}</p>
                                                    <span class="doc-filetype">CLOUD DOCUMENT</span>
                                                </div>
                                                <a href="javascript:void(0)" onclick={downloadRowImage} data-name={chat.fileName} class="doc-download-btn" title="Download">
                                                    <lightning-button-icon icon-name="utility:download" size="small" variant="bare"></lightning-button-icon>
                                                </a>
                                            </div>
                                        </div>

                                        <!-- Audio Message -->
                                        <div if:true={chat.isAudio} class="audio-container">
                                            <div class="audio-bubble-row">
                                                <button class="audio-play-btn" data-url={chat.Message__c} onclick={handleToggleAudioPreview} title="Play audio">
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#0176D3">
                                                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                                    </svg>
                                                </button>
                                                <div class="audio-meta">
                                                    <p class="audio-filename" title={chat.fileName}>{chat.fileName}</p>
                                                    <span class="audio-tag">Voice Message</span>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Other Message Format -->
                                        <div class="other-message-div" if:true={chat.isOther}>
                                            <div class="other-message-text">Shared {chat.Message_Type__c} with you.</div>
                                            <div class="other-message-sub-text">Preview is not available for this media type.</div>
                                        </div>

                                        <!-- Template Message -->
                                        <div class="template-message-div" if:true={chat.isTemplate}>
                                            <c-wa-template-preview template-id={chat.WA_Template__c}></c-wa-template-preview>
                                        </div>

                                        <!-- Meta info: Timestamp & Status -->
                                        <div class="timestamp">
                                            <lightning-formatted-date-time value={chat.CreatedDate} hour="2-digit"
                                                minute="2-digit"></lightning-formatted-date-time>

                                            <!-- Status icons -->
                                            <div class="status-icon" data-status={chat.Message_Status__c} if:true={chat.isTick}>
                                                <!-- Delivered / Seen Ticks -->
                                                <template if:true={chat.isSeen}>
                                                    <svg class="seen-tick" width="16" height="11" viewBox="0 0 16 11" fill="none">
                                                        <path d="M11.05 0.5L5.45 6.1L3.95 4.6L2.9 5.65L5.45 8.2L12.1 1.55L11.05 0.5Z" fill="#0284C7" />
                                                        <path d="M14.05 0.5L8.45 6.1L7.9 5.55L6.85 6.6L8.45 8.2L15.1 1.55L14.05 0.5Z" fill="#0284C7" />
                                                    </svg>
                                                </template>
                                                <template if:true={chat.isDelivered}>
                                                    <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
                                                        <path d="M11.05 0.5L5.45 6.1L3.95 4.6L2.9 5.65L5.45 8.2L12.1 1.55L11.05 0.5Z" fill="#94A3B8" />
                                                        <path d="M14.05 0.5L8.45 6.1L7.9 5.55L6.85 6.6L8.45 8.2L15.1 1.55L14.05 0.5Z" fill="#94A3B8" />
                                                    </svg>
                                                </template>
                                                <template if:true={chat.isSent}>
                                                    <svg width="14" height="11" viewBox="0 0 14 11" fill="none">
                                                        <path d="M12.1 1.55L5.45 8.2L2.9 5.65L3.95 4.6L5.45 6.1L11.05 0.5L12.1 1.55Z" fill="#94A3B8" />
                                                    </svg>
                                                </template>
                                            </div>

                                            <div class="status-icon" if:true={chat.isSending} title="Sending...">
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2">
                                                    <circle cx="12" cy="12" r="10"></circle>
                                                    <polyline points="12 6 12 12 16 14"></polyline>
                                                </svg>
                                            </div>

                                            <div class="status-icon status-failed" if:true={chat.isFailed} title="Failed to send">
                                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2">
                                                    <circle cx="12" cy="12" r="10"></circle>
                                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                                </svg>
                                            </div>
                                        </div>

                                        <!-- Reactions -->
                                        <div class="reaction-tray" if:true={chat.isReaction}>
                                            <div class="contact-reaction" if:true={chat.userReaction}>
                                                {chat.userReaction}
                                            </div>
                                            <div class="your-reaction" data-chat={chat.Id}
                                                ondblclick={handleRemoveReaction} if:true={chat.yourReaction} title="Double click to remove reaction">
                                                {chat.yourReaction}
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Message Actions Popover on Hover -->
                                    <div class="action-options-btn" onclick={handleToggleActions}>
                                        <div class="action-options-div" if:false={chat.isFailed}>
                                            <div class="action-option" data-action="reply" data-chat={chat.Id}
                                                onclick={handleChatAction} if:false={sendOnlyTemplate} title="Reply to message">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="2">
                                                    <polyline points="9 17 4 12 9 7"></polyline>
                                                    <path d="M20 18v-2a4 4 0 0 0-4-4H4"></path>
                                                </svg>
                                                <span class="action-command">Reply</span>
                                            </div>
                                            <div class="action-option" data-action="react" data-chat={chat.Id}
                                                onclick={handleChatAction} if:false={sendOnlyTemplate} title="React with emoji">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2">
                                                    <circle cx="12" cy="12" r="10"></circle>
                                                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                                                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                                                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                                                </svg>
                                                <span class="action-command">React</span>
                                            </div>
                                            <div class="action-option" data-action="copy"
                                                data-message={chat.Message__c} onclick={handleChatAction}
                                                if:true={chat.isText} title="Copy text">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2">
                                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                                </svg>
                                                <span class="action-command">Copy</span>
                                            </div>
                                        </div>

                                        <div class="action-options-div" if:true={chat.isFailed}>
                                            <div class="action-option" data-action="copy"
                                                data-message={chat.Message__c} onclick={handleChatAction}
                                                if:true={chat.isText}>
                                                <span class="action-command">Copy</span>
                                            </div>
                                        </div>

                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2">
                                            <circle cx="12" cy="12" r="1"></circle>
                                            <circle cx="12" cy="5" r="1"></circle>
                                            <circle cx="12" cy="19" r="1"></circle>
                                        </svg>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Empty State -->
                    <div class="no-chat-messages-div" if:true={noChatMessages}>
                        <div class="empty-state-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="1.5">
                                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                            </svg>
                        </div>
                        <div class="bold-text">No Conversation Yet</div>
                        <div class="sub-text">Start engaging with this customer by sending an approved template or a message!</div>
                        <button class="exp-blue-btn-css mt-3" data-media="Template" onclick={handleAttachmentOptionClick}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            Send Template
                        </button>
                    </div>
                </div>

                <!-- Reaction Emoji Tray -->
                <div class="react-emoji-picker-div" data-action="cancel-react" onclick={handleChatAction}
                    if:true={showReactEmojiPicker}>
                    <div class="react-emoji-tray">
                        <template for:each={emojiCategories} for:item="category">
                            <div key={category.category} class="emoji-category-div">
                                <h3>{category.category}</h3>
                                <div class="emoji-tray">
                                    <template for:each={category.emojis} for:item="item">
                                        <div key={item.emoji} class="emoji" title={item.description}
                                            onclick={handleReactWithEmoji}>{item.emoji}</div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Unified Popup Dialog (Files / Templates) -->
                <div class="popup-container-wrapper" if:true={showPopup}>
                    <div class="popup-dialog-card">
                        <div class="popup-dialog-header">
                            <div class="popup-dialog-title-block">
                                <h3 class="popup-dialog-title">{popupTitle}</h3>
                                <p class="popup-dialog-subtitle">{popupSubtitle}</p>
                            </div>
                            <button class="exp-close-icon-css" onclick={handleBackDropClick} title="Close">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M18 6L6 18M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>

                        <div class="popup-dialog-body">
                            <!-- File Uploader View -->
                            <div class="files-uploader-div" if:true={showFileUploader}>
                                <template if:false={isAWSEnabled}>
                                    <div class="standard-file-uploader-box">
                                        <lightning-file-upload class="file-uploader" label={uploadLabel} name="fileUploader"
                                            accept={acceptedFormats} record-id={recordId} onuploadfinished={handleUploadFinished}
                                            variant="label-hidden"></lightning-file-upload>
                                    </div>
                                </template>
                                <template if:true={isAWSEnabled}>
                                    <div class="upload-container">
                                        <label class="custom-file-upload">
                                            <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                            <span class="upload-prompt">Click to select {uploadFileType}</span>
                                            <input type="file" class="file-input" onchange={handleSelectedFiles}
                                                accept={acceptedFormats} disabled={selectedFileName} />
                                        </label>

                                        <template if:true={selectedFileName}>
                                            <div class="file-details">
                                                <span class="file-name">{selectedFileName}</span>
                                                <button class="remove-file-btn" onclick={removeFile} title="Remove file">✕</button>
                                            </div>
                                            <div class="upload-actions">
                                                <button class="exp-blue-btn-css" onclick={handleUploadClick}>Send File</button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <!-- Template Selection View -->
                            <template if:true={showTemplateSelection}>
                                <div class="template-select-div">
                                    <div class="search-template-bar">
                                        <svg class="search-template-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                        </svg>
                                        <input placeholder="Search templates by name..." type="text" class="search-template-input"
                                            onkeyup={handleSearchTemplate} onchange={handleSearchTemplate}
                                            value={templateSearchKey}>
                                    </div>

                                    <div class="templates-list-div" if:true={filteredTemplate}>
                                        <template for:each={filteredTemplate} for:item="template">
                                            <div key={template.Id} class="template-card-row" data-id={template.Id}
                                                onclick={handleShowTemplatePreview}>
                                                <div class="template-row-left">
                                                    <div class="template-card-title">{template.displayName}</div>
                                                    <div class="template-card-meta">
                                                        <span class="template-badge-cat">{template.Template_Category__c}</span>
                                                        <span class="template-badge-lang">{template.Language__c}</span>
                                                    </div>
                                                </div>
                                                <div class="template-row-right">
                                                    <button class="preview-template-action-btn">
                                                        Preview
                                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                            <path d="M9 18l6-6-6-6"/>
                                                        </svg>
                                                    </button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="no-templates-div" if:false={filteredTemplate}>
                                        <p class="no-templates-text">No templates found matching your search.</p>
                                    </div>
                                </div>
                            </template>

                            <!-- Template Preview & Send View -->
                            <template if:true={showTemplatePreview}>
                                <div class="template-preview-send-modal-body">
                                    <div class="template-preview-embed">
                                        <c-wa-template-preview template-id={selectedTemplate}></c-wa-template-preview>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Modal Footer (only on template preview) -->
                        <template if:true={showTemplatePreview}>
                            <div class="popup-dialog-footer">
                                <button class="exp-white-btn-css" onclick={handleBackToList}>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M15 18l-6-6 6-6"/>
                                    </svg>
                                    Back to Templates
                                </button>
                                <button class="exp-blue-btn-css" onclick={handleSendSelectedTemplateClick}>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="22" y1="2" x2="11" y2="13"></line>
                                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                    </svg>
                                    Send Template
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Audio Preview Player -->
                <template if:true={audioPreview}>
                    <div class="audio-preview-overlay">
                        <div class="audio-player-modal">
                            <div class="audio-player-header">
                                <span>Voice Message</span>
                                <button class="close-audio-btn" onclick={handleToggleAudioPreview}>✕</button>
                            </div>
                            <audio controls autoplay src={audioURL} class="audio-control-element"></audio>
                        </div>
                    </div>
                </template>

                <!-- Composer / Message Draft Section -->
                <div class="message-draft-div">
                    <!-- Reply Context Strip -->
                    <div class="reply-to-message-div" if:true={replyToMessage}>
                        <div class="reply-banner-inner">
                            <div class="reply-banner-bar"></div>
                            <div class="reply-banner-content">
                                <div class="reply-banner-author">Replying to {replyToMessage.messageBy}</div>
                                <div class="reply-banner-text">{replyToMessage.Message__c}</div>
                            </div>
                            <button class="reply-banner-close" data-action="cancel-reply" onclick={handleChatAction} title="Cancel reply">
                                ✕
                            </button>
                        </div>
                    </div>

                    <!-- 24h Conversation Window Notice -->
                    <template if:true={sendOnlyTemplate}>
                        <div class="send-only-template-banner">
                            <div class="notice-left">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                                <span class="notice-text">{noteText}</span>
                            </div>
                            <button class="exp-blue-btn-css" data-media="Template" onclick={handleAttachmentOptionClick}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                </svg>
                                Send Template
                            </button>
                        </div>
                    </template>

                    <!-- Active Message Composer Bar -->
                    <template if:false={sendOnlyTemplate}>
                        <div class="composer-bar">
                            <!-- Emoji Picker Popover -->
                            <div class="emoji-picker-container" if:true={showEmojiPicker}>
                                <div class="emoji-picker-scroll">
                                    <template for:each={emojiCategories} for:item="category">
                                        <div key={category.category} class="emoji-category-block">
                                            <span class="emoji-cat-title">{category.category}</span>
                                            <div class="emoji-cat-grid">
                                                <template for:each={category.emojis} for:item="item">
                                                    <span key={item.emoji} class="emoji-item" title={item.description} onclick={handleEmojiClick}>
                                                        {item.emoji}
                                                    </span>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- Emoji Button -->
                            <button class="composer-icon-btn" onclick={handleEmojiButtonClick} title="Insert Emoji">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.8">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                                </svg>
                            </button>

                            <!-- Attachment Button -->
                            <div class="attachment-trigger-wrap">
                                <button class="composer-icon-btn" onclick={handleAttachmentButtonClick} title="Attach file or template">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.8">
                                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                                    </svg>
                                </button>

                                <!-- Attachment Popover Menu -->
                                <div class="attachment-popover" if:true={showAttachmentOptions}>
                                    <div class="attachment-item" data-media="Document" onclick={handleAttachmentOptionClick}>
                                        <div class="attachment-icon-pill icon-doc">
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                <polyline points="14 2 14 8 20 8"></polyline>
                                            </svg>
                                        </div>
                                        <span>Document</span>
                                    </div>

                                    <div class="attachment-item" data-media="Image" onclick={handleAttachmentOptionClick}>
                                        <div class="attachment-icon-pill icon-photo">
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                                <polyline points="21 15 16 10 5 21"></polyline>
                                            </svg>
                                        </div>
                                        <span>Photos</span>
                                    </div>

                                    <div class="attachment-item" data-media="Video" onclick={handleAttachmentOptionClick}>
                                        <div class="attachment-icon-pill icon-video">
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                                            </svg>
                                        </div>
                                        <span>Videos</span>
                                    </div>

                                    <div class="attachment-item" data-media="Audio" onclick={handleAttachmentOptionClick}>
                                        <div class="attachment-icon-pill icon-audio">
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M9 18V5l12-2v13"></path>
                                                <circle cx="6" cy="18" r="3"></circle>
                                                <circle cx="18" cy="16" r="3"></circle>
                                            </svg>
                                        </div>
                                        <span>Audio</span>
                                    </div>

                                    <div class="attachment-item" data-media="Template" onclick={handleAttachmentOptionClick}>
                                        <div class="attachment-icon-pill icon-template">
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                                <line x1="3" y1="10" x2="21" y2="10"></line>
                                            </svg>
                                        </div>
                                        <span>Template</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Textarea Input -->
                            <div class="input-container">
                                <textarea class="message-input" rows="1" placeholder="Type a message..."
                                    onkeydown={handleMessageTextChange} onkeyup={handleMessageTextChange}
                                    oninput={handleMessageInput}></textarea>
                            </div>

                            <!-- Send Button -->
                            <button class="send-action-btn" onclick={handleSendMessage} title="Send Message (Enter)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Config / Record Error Modal -->
        <template if:true={showchatwindowerror}>
            <div class="chatwindow-error-banner">
                <div class="error-card">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <h3 class="error-title">Notice</h3>
                    <p class="error-desc">{chatwindowerror}</p>
                </div>
            </div>
        </template>
    </template>

    <!-- WhatsApp Business Account Missing State -->
    <template if:false={hasBusinessAccountConfigured}>
        <div class="configuration-error-card">
            <div class="config-error-icon-box">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="1.8">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </div>
            <h2 class="configuration-error-title">WhatsApp Integration Required</h2>
            <p class="configuration-error-message">
                WhatsApp Business Account is not yet connected. Please configure your WhatsApp integration in the Control Center to start messaging.
            </p>
        </div>
    </template>
</template>
