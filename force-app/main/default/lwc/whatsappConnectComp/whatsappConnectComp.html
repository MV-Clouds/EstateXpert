<template>
    <div class="whatsapp-connect-wrapper">
        <!-- Main Loading Spinner -->
        <template if:true={isLoading}>
            <div class="scoped-spinner-backdrop">
                <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
            </div>
        </template>

        <div class="config-card">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-header-icon-container">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12 2C6.477 2 2 6.477 2 12C2 13.819 2.484 15.524 3.328 17L2 22L7.155 20.697C8.601 21.527 10.252 22 12 22C17.523 22 22 17.523 22 12C22 6.477 17.523 2 12 2ZM8.889 7.667C8.694 7.234 8.489 7.225 8.305 7.217C8.155 7.21 7.983 7.21 7.811 7.21C7.639 7.21 7.362 7.275 7.126 7.533C6.89 7.79 6.22 8.417 6.22 9.697C6.22 10.977 7.148 12.213 7.277 12.385C7.406 12.557 9.07 15.228 11.688 16.273C13.864 17.142 14.307 16.969 14.779 16.926C15.251 16.883 16.303 16.304 16.518 15.698C16.733 15.093 16.733 14.577 16.668 14.47C16.604 14.363 16.432 14.298 16.174 14.17C15.916 14.041 14.649 13.418 14.413 13.332C14.177 13.246 14.005 13.203 13.833 13.461C13.661 13.719 13.167 14.298 13.017 14.47C12.866 14.642 12.716 14.663 12.458 14.535C12.2 14.406 11.369 14.134 10.384 13.256C9.617 12.573 9.099 11.73 8.948 11.472C8.798 11.214 8.932 11.074 9.062 10.946C9.178 10.83 9.321 10.643 9.45 10.493C9.579 10.343 9.622 10.235 9.708 10.063C9.794 9.892 9.751 9.741 9.686 9.613C9.622 9.484 9.106 8.148 8.889 7.667Z"
                            fill="#25D366" />
                    </svg>
                </div>
                <div class="page-header-content">
                    <h1 class="page-title">Connect WhatsApp Business</h1>
                    <p class="page-subtitle">Link your WhatsApp Business account to send and receive messages directly within this workspace. You'll need your Meta Application ID to get started.</p>
                </div>
            </div>

            <!-- Missing Config Banner -->
            <template if:true={isMissingConfig}>
                <div class="info-box error-box">
                    <svg class="info-icon error-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                    <div class="info-content">
                        <p class="info-title error-title">Configuration Missing</p>
                        <p class="info-text error-text">The WhatsApp Business integration configuration is missing. Please configure the Tech Provider App credentials in Custom Metadata (OAuth_Configuration__mdt) first.</p>
                    </div>
                </div>
            </template>

            <!-- ── STATE 1: SETUP FORM (when NOT connected) ── -->
            <template if:false={isConnected}>
                <div class="setup-form-container">
                    <!-- Left Column -->
                    <div class="flex-1">
                        <div class="input-group">
                            <label class="input-label" for="app-id-input">META APPLICATION ID</label>
                            <input type="text" id="app-id-input" class="input-field"
                                value={appIdInput}
                                oninput={handleAppIdInputChange}
                                placeholder="Enter your Meta Application ID" />
                        </div>

                        <div class="info-box">
                            <svg class="info-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                                    clip-rule="evenodd" />
                            </svg>
                            <div class="info-content">
                                <p class="info-title">How to find your Application ID:</p>
                                <p class="info-text">Go to Meta for Developers → My Apps → Select your app → Copy your Application ID</p>
                            </div>
                        </div>

                        <button type="button" class="connect-btn" onclick={launchWhatsAppSignup} disabled={isConnectBtnDisabled}>
                            <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M12 2C6.477 2 2 6.477 2 12C2 13.819 2.484 15.524 3.328 17L2 22L7.155 20.697C8.601 21.527 10.252 22 12 22C17.523 22 22 17.523 22 12C22 6.477 17.523 2 12 2ZM8.889 7.667C8.694 7.234 8.489 7.225 8.305 7.217C8.155 7.21 7.983 7.21 7.811 7.21C7.639 7.21 7.362 7.275 7.126 7.533C6.89 7.79 6.22 8.417 6.22 9.697C6.22 10.977 7.148 12.213 7.277 12.385C7.406 12.557 9.07 15.228 11.688 16.273C13.864 17.142 14.307 16.969 14.779 16.926C15.251 16.883 16.303 16.304 16.518 15.698C16.733 15.093 16.733 14.577 16.668 14.47C16.604 14.363 16.432 14.298 16.174 14.17C15.916 14.041 14.649 13.418 14.413 13.332C14.177 13.246 14.005 13.203 13.833 13.461C13.661 13.719 13.167 14.298 13.017 14.47C12.866 14.642 12.716 14.663 12.458 14.535C12.2 14.406 11.369 14.134 10.384 13.256C9.617 12.573 9.099 11.73 8.948 11.472C8.798 11.214 8.932 11.074 9.062 10.946C9.178 10.83 9.321 10.643 9.45 10.493C9.579 10.343 9.622 10.235 9.708 10.063C9.794 9.892 9.751 9.741 9.686 9.613C9.622 9.484 9.106 8.148 8.889 7.667Z"
                                    fill="#ffffff" />
                            </svg>
                            <span>Connect with WhatsApp</span>
                            <template if:true={isConnecting}>
                                <div class="btn-spinner"></div>
                            </template>
                        </button>

                        <div class="redirect-info">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            You will be redirected to Meta to authorize WhatsApp Business access.
                        </div>

                        <div class="manual-divider-wrap">
                            <div class="manual-divider-line"></div>
                            <span class="manual-divider-text">OR</span>
                            <div class="manual-divider-line"></div>
                        </div>

                        <button type="button" class="manual-trigger-btn" onclick={openManualConfigModal}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                            Enter Credentials Manually
                        </button>

                        <!-- Inline Error Alert Banner -->
                        <template if:true={errorMessage}>
                            <div class="inline-error-banner">
                                <svg class="inline-error-icon" width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                                        clip-rule="evenodd" />
                                </svg>
                                <span class="inline-error-text">{errorMessage}</span>
                                <button type="button" class="inline-error-close" onclick={hideError} title="Dismiss">&#215;</button>
                            </div>
                        </template>
                    </div>

                    <!-- Right Column -->
                    <div class="flex-1-2">
                        <div class="info-panel">
                            <div class="info-panel-header">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                                What happens when you connect?
                            </div>

                            <ul class="info-list">
                                <li class="info-list-item">
                                    <svg class="info-list-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                    </svg>
                                    Connect your WhatsApp Business Account (WABA) seamlessly to your workspace.
                                </li>
                                <li class="info-list-item">
                                    <svg class="info-list-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                    </svg>
                                    Send and receive customer messages directly from Salesforce in real time.
                                </li>
                                <li class="info-list-item">
                                    <svg class="info-list-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                    </svg>
                                    Automatic webhook events keep message delivery, read receipts, and status updated.
                                </li>
                            </ul>

                            <div class="note-box">
                                <svg class="note-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="16" x2="12" y2="12"></line>
                                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                </svg>
                                <span><strong>Note:</strong> Changes may take 3-5 minutes to save and process.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ── STATE 2: CONNECTED DETAILS (when CONNECTED) ── -->
            <template if:true={isConnected}>
                <div class="connected-layout-container">
                    <!-- Left Column: WhatsApp Account Connection Details -->
                    <div class="connected-left-col">
                        <div class="status-badge">
                            <span class="status-dot"></span>
                            Active
                        </div>

                        <div class="input-label">WhatsApp Business Account ID</div>
                        <div class="account-box">
                            <div class="account-box-left">
                                <div class="shield-icon">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                                    </svg>
                                </div>
                                <div class="account-info">
                                    <p class="account-id">{businessAccountId}</p>
                                    <p class="account-status">Connected and verified</p>
                                </div>
                            </div>
                            <button type="button" class="copy-btn" onclick={copyWabaId} title="Copy ID">
                                <template if:false={isCopied}>
                                    <svg viewBox="0 0 20 20" fill="currentColor">
                                        <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                                        <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                                    </svg>
                                </template>
                                <template if:true={isCopied}>
                                    <svg viewBox="0 0 20 20" fill="#10B981">
                                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                                    </svg>
                                </template>
                            </button>
                        </div>

                        <button type="button" class="deactivate-btn" onclick={openDeactivateModal}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                <path d="M6.2 5.8C4.2 7.3 3 9.6 3 12.2C3 17.1 7 21 12 21C17 21 21 17.1 21 12.2C21 9.6 19.8 7.3 17.8 5.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            </svg>
                            Deactivate Integration
                        </button>

                        <div class="section-title">INTEGRATION DETAILS</div>
                        <div class="details-grid">
                            <div class="detail-item">
                                <span class="detail-label">Application ID</span>
                                <span class="detail-value">{appId}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Last Edited</span>
                                <span class="detail-value">{lastModifiedDate}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Contact Object Configuration (Direct LWC Embedding) -->
                    <div class="connected-right-col">
                        <div class="contact-config-title">CONTACT CONFIGURATION</div>
                        <!-- Configuration Information Banner -->
                        <div class="obj-config-info-box">
                            <div class="obj-config-info-header">
                                <svg class="obj-config-info-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="16" x2="12" y2="12"></line>
                                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                </svg>
                                <span class="obj-config-info-title">Why is Contact Configuration important?</span>
                                <span class="obj-config-info-badge">Important Setting</span>
                            </div>
                            <div class="obj-config-info-desc">
                                This setting connects your WhatsApp Business Account to Salesforce Contacts and is essential for messaging features:
                            </div>
                            <ul class="obj-config-info-points">
                                <li class="obj-config-info-point">
                                    <span class="obj-config-info-point-bullet">&#8226;</span>
                                    <span><strong>Phone Field Mapping:</strong> Selects which Contact field (e.g. Phone, Mobile) identifies contacts in the Chat Window and matches incoming webhook messages.</span>
                                </li>
                                <li class="obj-config-info-point">
                                    <span class="obj-config-info-point-bullet">&#8226;</span>
                                    <span><strong>Automatic Contact Creation:</strong> Sets default values for required fields when a new customer messages you, preventing record creation errors.</span>
                                </li>
                            </ul>
                        </div>

                        <!-- Direct Embedding of objectConfigComp LWC -->
                        <div class="contact-config-lwc-wrapper">
                            <c-object-config-comp></c-object-config-comp>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- ── MODAL: Deactivate Confirmation ── -->
        <template if:true={isDeactivateModalOpen}>
            <div class="modal-overlay show">
                <div class="modal-content">
                    <div class="manual-modal-header">
                        <div class="manual-header-left">
                            <div class="manual-header-icon-box deactivation-icon-box">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                            </div>
                            <div class="manual-header-text">
                                <h3 class="manual-modal-title">Deactivate Integration</h3>
                                <p class="manual-modal-subtitle">Disconnect your WhatsApp Business Account</p>
                            </div>
                        </div>
                        <button type="button" class="manual-modal-close" onclick={closeDeactivateModal} title="Close">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="modal-body">
                        <p class="modal-message">Are you sure you want to deactivate WhatsApp integration? This will disconnect your WhatsApp Business Account and you will need to set it up again to continue using WhatsApp messaging.</p>
                    </div>
                    <div class="manual-modal-footer">
                        <button type="button" class="exp-white-btn-css" onclick={closeDeactivateModal}>
                            <svg width="12" height="12" viewBox="0 0 20 20" fill="none">
                                <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="currentColor" />
                            </svg>
                            Cancel
                        </button>
                        <button type="button" class="exp-red-btn-css" onclick={confirmDeactivate} disabled={isSubmitting}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                <path d="M6.2 5.8C4.2 7.3 3 9.6 3 12.2C3 17.1 7 21 12 21C17 21 21 17.1 21 12.2C21 9.6 19.8 7.3 17.8 5.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            </svg>
                            Deactivate
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ── MODAL: Manual Configuration ── -->
        <template if:true={isManualModalOpen}>
            <div class="manual-modal-overlay show">
                <div class="manual-modal-container">
                    <div class="manual-modal-header">
                        <div class="manual-header-left">
                            <div class="manual-header-icon-box">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M12 2C6.477 2 2 6.477 2 12C2 13.819 2.484 15.524 3.328 17L2 22L7.155 20.697C8.601 21.527 10.252 22 12 22C17.523 22 22 17.523 22 12C22 6.477 17.523 2 12 2ZM8.889 7.667C8.694 7.234 8.489 7.225 8.305 7.217C8.155 7.21 7.983 7.21 7.811 7.21C7.639 7.21 7.362 7.275 7.126 7.533C6.89 7.79 6.22 8.417 6.22 9.697C6.22 10.977 7.148 12.213 7.277 12.385C7.406 12.557 9.07 15.228 11.688 16.273C13.864 17.142 14.307 16.969 14.779 16.926C15.251 16.883 16.303 16.304 16.518 15.698C16.733 15.093 16.733 14.577 16.668 14.47C16.604 14.363 16.432 14.298 16.174 14.17C15.916 14.041 14.649 13.418 14.413 13.332C14.177 13.246 14.005 13.203 13.833 13.461C13.661 13.719 13.167 14.298 13.017 14.47C12.866 14.642 12.716 14.663 12.458 14.535C12.2 14.406 11.369 14.134 10.384 13.256C9.617 12.573 9.099 11.73 8.948 11.472C8.798 11.214 8.932 11.074 9.062 10.946C9.178 10.83 9.321 10.643 9.45 10.493C9.579 10.343 9.622 10.235 9.708 10.063C9.794 9.892 9.751 9.741 9.686 9.613C9.622 9.484 9.106 8.148 8.889 7.667Z"
                                        fill="#25D366" />
                                </svg>
                            </div>
                            <div class="manual-header-text">
                                <h3 class="manual-modal-title">Manual WhatsApp Configuration</h3>
                                <p class="manual-modal-subtitle">Connect your account directly using your Meta credentials</p>
                            </div>
                        </div>
                        <button type="button" class="manual-modal-close" onclick={closeManualConfigModal} title="Close">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="manual-modal-body">
                        <div class="manual-intro-note">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0176D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="16" x2="12" y2="12"></line>
                                <line x1="12" y1="8" x2="12.01" y2="8"></line>
                            </svg>
                            <span>Enter your Meta credentials below to connect your account directly.</span>
                        </div>

                        <template if:true={manualErrorText}>
                            <div class="manual-error-alert">
                                <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                                        clip-rule="evenodd" />
                                </svg>
                                <span>{manualErrorText}</span>
                            </div>
                        </template>

                        <div class="manual-field-group">
                            <label class="manual-field-label" for="manual-app-id">
                                Meta Application ID <span class="required-star">*</span>
                            </label>
                            <input type="text" id="manual-app-id" data-field="appId" class="manual-field-input"
                                placeholder="e.g., 514916280628381" value={manualForm.appId} oninput={handleManualFieldChange} />
                        </div>

                        <div class="manual-field-group">
                            <label class="manual-field-label" for="manual-waba-id">
                                WhatsApp Business Account ID (WABA ID) <span class="required-star">*</span>
                            </label>
                            <input type="text" id="manual-waba-id" data-field="wabaId" class="manual-field-input"
                                placeholder="e.g., 8971126402921271" value={manualForm.wabaId} oninput={handleManualFieldChange} />
                        </div>

                        <div class="manual-field-group">
                            <label class="manual-field-label" for="manual-phone-id">
                                Phone Number ID <span class="required-star">*</span>
                            </label>
                            <input type="text" id="manual-phone-id" data-field="phoneId" class="manual-field-input"
                                placeholder="e.g., 765432109876543" value={manualForm.phoneId} oninput={handleManualFieldChange} />
                        </div>

                        <div class="manual-field-group">
                            <label class="manual-field-label" for="manual-access-token">
                                Permanent Access Token <span class="required-star">*</span>
                            </label>
                            <textarea id="manual-access-token" data-field="accessToken" class="manual-field-input manual-field-textarea"
                                placeholder="Enter System User / Permanent Access Token" oninput={handleManualFieldChange}>{manualForm.accessToken}</textarea>
                        </div>
                    </div>
                    <div class="manual-modal-footer">
                        <button type="button" class="exp-white-btn-css" onclick={closeManualConfigModal}>
                            <svg width="12" height="12" viewBox="0 0 20 20" fill="none">
                                <path d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z" fill="currentColor" />
                            </svg>
                            Cancel
                        </button>
                        <button type="button" class="exp-blue-btn-css" onclick={saveManualConfig} disabled={isSubmitting}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                <polyline points="7 3 7 8 15 8"></polyline>
                            </svg>
                            Save Configuration
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
