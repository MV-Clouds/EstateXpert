<template>
    <template if:true={isLoading}>
        <c-spinner-component></c-spinner-component>
    </template>
    <div class="whatsapp-connect-wrapper">
        <div class="config-card">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-header-icon-container">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12 2C6.477 2 2 6.477 2 12C2 13.819 2.484 15.524 3.328 17L2 22L7.155 20.697C8.601 21.527 10.252 22 12 22C17.523 22 22 17.523 22 12C22 6.477 17.523 2 12 2ZM8.889 7.667C8.694 7.234 8.489 7.225 8.305 7.217C8.155 7.21 7.983 7.21 7.811 7.21C7.639 7.21 7.362 7.275 7.126 7.533C6.89 7.79 6.22 8.417 6.22 9.697C6.22 10.977 7.148 12.213 7.277 12.385C7.406 12.557 9.07 15.228 11.688 16.273C13.864 17.142 14.307 16.969 14.779 16.926C15.251 16.883 16.303 16.304 16.518 15.698C16.733 15.093 16.733 14.577 16.668 14.47C16.604 14.363 16.432 14.298 16.174 14.17C15.916 14.041 14.649 13.418 14.413 13.332C14.177 13.246 14.005 13.203 13.833 13.461C13.661 13.719 13.167 14.298 13.017 14.47C12.866 14.642 12.716 14.663 12.458 14.535C12.2 14.406 11.369 14.134 10.384 13.256C9.617 12.573 9.099 11.73 8.948 11.472C8.798 11.214 8.932 11.074 9.062 10.946C9.178 10.83 9.321 10.643 9.45 10.493C9.579 10.343 9.622 10.235 9.708 10.063C9.794 9.892 9.751 9.741 9.686 9.613C9.622 9.484 9.106 8.148 8.889 7.667Z"
                            fill="#25D366" />
                    </svg>
                </div>
                <div class="page-header-content">
                    <h1 class="page-title">Connect WhatsApp Business</h1>
                    <p class="page-subtitle">Link your WhatsApp Business account to send and receive messages directly
                        within this workspace. You'll need your Meta Application ID to get started.</p>
                </div>
            </div>

            <!-- Connected Layout (Shown when WhatsApp is Connected) -->
            <div class="connected-layout-container">
                <!-- Left Column: WhatsApp Account Connection Details -->
                <div class="connected-left-col">
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        Active
                    </div>

                    <div class="input-label">WhatsApp Business Account ID</div>
                    <div class="account-box">
                        <div class="account-box-left">
                            <div class="shield-icon">
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                                </svg>
                            </div>
                            <div class="account-info">
                                <p class="account-id">{businessAccountId}</p>
                                <p class="account-status">Connected and verified</p>
                            </div>
                        </div>
                        <button type="button" class="copy-btn" onclick={copyWabaId} title="Copy ID">
                            <template if:false={isCopied}>
                                <svg viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                                    <path
                                        d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                                </svg>
                            </template>
                            <template if:true={isCopied}>
                                <svg viewBox="0 0 20 20" fill="#10B981">
                                    <path fill-rule="evenodd"
                                        d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                        clip-rule="evenodd" />
                                </svg>
                            </template>
                        </button>
                    </div>

                    <button type="button" class="deactivate-btn" onclick={openDeactivateModal}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            <path
                                d="M6.2 5.8C4.2 7.3 3 9.6 3 12.2C3 17.1 7 21 12 21C17 21 21 17.1 21 12.2C21 9.6 19.8 7.3 17.8 5.8"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        Deactivate Integration
                    </button>

                    <div class="section-title">INTEGRATION DETAILS</div>
                    <div class="details-grid">
                        <div class="detail-item">
                            <span class="detail-label">Application ID</span>
                            <span class="detail-value">{appId}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Last Edited</span>
                            <span class="detail-value">{lastModifiedDate}</span>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Contact Object Configuration (Self-Contained) -->
                <div class="connected-right-col">
                    <div class="contact-config-title">CONTACT CONFIGURATION</div>
                    <!-- Configuration Information Banner -->
                    <div class="obj-config-info-box">
                        <div class="obj-config-info-header">
                            <svg class="obj-config-info-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="16" x2="12" y2="12"></line>
                                <line x1="12" y1="8" x2="12.01" y2="8"></line>
                            </svg>
                            <span class="obj-config-info-title">Why is Contact Configuration important?</span>
                            <span class="obj-config-info-badge">Important Setting</span>
                        </div>
                        <div class="obj-config-info-desc">
                            This setting connects your WhatsApp Business Account to Salesforce Contacts and is essential
                            for messaging features:
                        </div>
                        <ul class="obj-config-info-points">
                            <li class="obj-config-info-point">
                                <span class="obj-config-info-point-bullet">&#8226;</span>
                                <span><strong>Phone Field Mapping:</strong> Selects which Contact field (e.g. Phone,
                                    Mobile) identifies contacts in the Chat Window and matches incoming webhook
                                    messages.</span>
                            </li>
                            <li class="obj-config-info-point">
                                <span class="obj-config-info-point-bullet">&#8226;</span>
                                <span><strong>Automatic Contact Creation:</strong> Sets default values for required
                                    fields when a new customer messages you, preventing record creation errors.</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Contact Configuration Card -->
                    <div class="contact-config-card">
                        <!-- Top bar: Contact badge + Edit / Cancel / Save -->
                        <div class="config-top-bar">
                            <div class="config-object-info">
                                <span class="config-object-pill">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="#0176d3"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                        <circle cx="12" cy="7" r="4" stroke="#0176d3" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    Contact
                                </span>
                                <template if:true={selectedPhoneFieldLabel}>
                                    <span class="phone-field-tag">
                                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1C5.4 21 3 9.6 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.21 2.2z"
                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                stroke-linejoin="round" />
                                        </svg>
                                        {selectedPhoneFieldLabel} ({selectedPhoneFieldVal})
                                    </span>
                                </template>
                            </div>

                            <div class="config-top-actions">
                                <template if:false={isContactEditMode}>
                                    <button class="exp-blue-btn-css" onclick={handleContactEdit}>
                                        <svg width="12" height="12" viewBox="0 0 14 14" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M13.0416 13.0417H8.45831M0.958313 13.0417L4.49998 12.2083L12.2441 4.46426C12.5695 4.13882 12.5695 3.61119 12.2441 3.28575L10.7142 1.75593C10.3888 1.43049 9.86115 1.43049 9.53573 1.75593L1.79165 9.50001L0.958313 13.0417Z"
                                                stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                                stroke-linejoin="round" />
                                        </svg>
                                        <span>Edit</span>
                                    </button>
                                </template>
                                <template if:true={isContactEditMode}>
                                    <button class="exp-white-btn-css" onclick={handleContactCancel}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8"
                                                stroke-linecap="round" />
                                        </svg>
                                        <span>Cancel</span>
                                    </button>
                                    <button class="exp-blue-btn-css" onclick={handleContactSave}
                                        disabled={isContactSaveDisabled}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path d="M5 12.5L10 17L19 8" stroke="currentColor" stroke-width="1.8"
                                                stroke-linecap="round" stroke-linejoin="round" />
                                        </svg>
                                        <span>Save</span>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <!-- Accordions -->
                        <div class="custom-accordion">
                            <!-- Section 1: Chat Window Configuration -->
                            <section class={chatSectionClass}>
                                <button type="button" class="accordion-header-btn" data-section="chatWindowConfig"
                                    aria-expanded={isChatSectionOpen} onclick={handleToggleSection}>
                                    <span class="accordion-title-group">
                                        <span class="section-icon" aria-hidden="true">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <path
                                                    d="M4 7.5C4 6.11929 5.11929 5 6.5 5H17.5C18.8807 5 20 6.11929 20 7.5V16.5C20 17.8807 18.8807 19 17.5 19H6.5C5.11929 19 4 17.8807 4 16.5V7.5Z"
                                                    stroke="#0176D3" stroke-width="1.6" />
                                                <path d="M8 11H16M8 14.5H13" stroke="#0176D3" stroke-width="1.6"
                                                    stroke-linecap="round" />
                                            </svg>
                                        </span>
                                        <span class="accordion-title">Whatsapp Chat Window Configuration</span>
                                    </span>
                                    <span class="accordion-icon-wrap">
                                        <svg class="accordion-icon" width="18" height="18" viewBox="0 0 20 20"
                                            fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M5 7.5L10 12.5L15 7.5" stroke="#1F2937" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round" />
                                        </svg>
                                    </span>
                                </button>

                                <template if:true={isChatSectionOpen}>
                                    <div class="accordion-panel">
                                        <template if:false={isContactEditMode}>
                                            <div class="exp-table-content exp-accordion-table-content">
                                                <table class="slds-table chat-config-table">
                                                    <colgroup>
                                                        <col class="col-chat-object" />
                                                        <col class="col-chat-field" />
                                                    </colgroup>
                                                    <thead>
                                                        <tr>
                                                            <th scope="col" class="col-chat-object">
                                                                <div class="slds-truncate">Object</div>
                                                            </th>
                                                            <th scope="col" class="col-chat-field">
                                                                <div class="slds-truncate">Phone Field</div>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template if:true={chatWindowRows.length}>
                                                            <template for:each={chatWindowRows} for:item="row">
                                                                <tr key={row.id}>
                                                                    <td class="col-chat-object">
                                                                        <div class="slds-truncate">{row.selectedObject}
                                                                        </div>
                                                                    </td>
                                                                    <td class="col-chat-field">
                                                                        <div class="slds-truncate">
                                                                            {row.selectedPhoneField}</div>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </template>
                                                        <template if:false={chatWindowRows.length}>
                                                            <tr>
                                                                <td class="slds-text-align_center" colspan="2">Not
                                                                    configured yet. Click Edit to set up.</td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>

                                        <template if:true={isContactEditMode}>
                                            <div class="exp-table-content exp-accordion-table-content">
                                                <table class="slds-table custom-table chat-config-table">
                                                    <colgroup>
                                                        <col class="col-chat-object" />
                                                        <col class="col-chat-field" />
                                                    </colgroup>
                                                    <thead>
                                                        <tr>
                                                            <th scope="col" class="col-chat-object">
                                                                <div class="slds-truncate">Object</div>
                                                            </th>
                                                            <th scope="col" class="col-chat-field">
                                                                <div class="slds-truncate">Phone Field</div>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template for:each={chatWindowRows} for:item="row">
                                                            <tr key={row.id}>
                                                                <td class="col-chat-object">
                                                                    <div class="slds-truncate object-static-label">
                                                                        {row.selectedObject}</div>
                                                                </td>
                                                                <td class="col-chat-field">
                                                                    <lightning-combobox variant="label-hidden"
                                                                        data-row-id={row.id}
                                                                        value={row.selectedPhoneField}
                                                                        options={row.phoneFieldOptions}
                                                                        onchange={handleChatPhoneFieldChange}
                                                                        placeholder="Select Phone Field"
                                                                        dropdown-alignment="auto">
                                                                    </lightning-combobox>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </section>

                            <!-- Section 2: Webhook Configuration -->
                            <section class={webhookSectionClass}>
                                <button type="button" class="accordion-header-btn" data-section="webhookConfig"
                                    aria-expanded={isWebhookSectionOpen} onclick={handleToggleSection}>
                                    <span class="accordion-title-group">
                                        <span class="section-icon" aria-hidden="true">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <path
                                                    d="M6 8C6 6.34315 7.34315 5 9 5H15C16.6569 5 18 6.34315 18 8V16C18 17.6569 16.6569 19 15 19H9C7.34315 19 6 17.6569 6 16V8Z"
                                                    stroke="#0176D3" stroke-width="1.6" />
                                                <circle cx="12" cy="15.2" r="1" fill="#0176D3" />
                                            </svg>
                                        </span>
                                        <span class="accordion-title">Whatsapp Webhook Configuration</span>
                                    </span>
                                    <span class="accordion-icon-wrap">
                                        <svg class="accordion-icon" width="18" height="18" viewBox="0 0 20 20"
                                            fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M5 7.5L10 12.5L15 7.5" stroke="#1F2937" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round" />
                                        </svg>
                                    </span>
                                </button>

                                <template if:true={isWebhookSectionOpen}>
                                    <div class="accordion-panel">
                                        <template if:false={isContactEditMode}>
                                            <div class="exp-table-content exp-accordion-table-content">
                                                <table class="slds-table webhook-config-table">
                                                    <colgroup>
                                                        <col class="col-webhook-name" />
                                                        <col class="col-webhook-type" />
                                                        <col class="col-webhook-val" />
                                                    </colgroup>
                                                    <thead>
                                                        <tr>
                                                            <th scope="col" class="col-webhook-name">
                                                                <div class="slds-truncate">Field API Name</div>
                                                            </th>
                                                            <th scope="col" class="col-webhook-type">
                                                                <div class="slds-truncate">Field Type</div>
                                                            </th>
                                                            <th scope="col" class="col-webhook-val">
                                                                <div class="slds-truncate">Default Value</div>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template if:true={requiredFields.length}>
                                                            <template for:each={requiredFields} for:item="field">
                                                                <tr key={field.name}>
                                                                    <td class="col-webhook-name">
                                                                        <div class="slds-truncate">{field.name}</div>
                                                                    </td>
                                                                    <td class="col-webhook-type">
                                                                        <div class="slds-truncate">{field.type}</div>
                                                                    </td>
                                                                    <td class="col-webhook-val">
                                                                        <div class="slds-truncate">
                                                                            <template
                                                                                if:true={field.isReference}>{field.relatedRecordName}</template>
                                                                            <template
                                                                                if:false={field.isReference}>{field.value}</template>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </template>
                                                        <template if:false={requiredFields.length}>
                                                            <tr>
                                                                <td class="slds-text-align_center" colspan="3">No
                                                                    required fields for Contact</td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>

                                        <template if:true={isContactEditMode}>
                                            <div class="exp-table-content exp-accordion-table-content">
                                                <table class="slds-table webhook-config-table">
                                                    <colgroup>
                                                        <col class="col-webhook-name" />
                                                        <col class="col-webhook-type" />
                                                        <col class="col-webhook-val" />
                                                    </colgroup>
                                                    <thead>
                                                        <tr>
                                                            <th scope="col" class="col-webhook-name">
                                                                <div class="slds-truncate">Field API Name</div>
                                                            </th>
                                                            <th scope="col" class="col-webhook-type">
                                                                <div class="slds-truncate">Field Type</div>
                                                            </th>
                                                            <th scope="col" class="col-webhook-val">
                                                                <div class="slds-truncate">Default Value</div>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template if:true={requiredFields.length}>
                                                            <template for:each={requiredFields} for:item="field">
                                                                <tr key={field.name}>
                                                                    <td class="col-webhook-name">
                                                                        <div class="slds-truncate">{field.name}</div>
                                                                    </td>
                                                                    <td class="col-webhook-type">
                                                                        <div class="slds-truncate">{field.type}</div>
                                                                    </td>
                                                                    <td class="col-webhook-val">
                                                                        <template if:true={field.isString}>
                                                                            <lightning-input variant="label-hidden"
                                                                                type="text" data-field={field.name}
                                                                                value={field.value}
                                                                                onchange={handleRequiredFieldChange}></lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isNumber}>
                                                                            <lightning-input variant="label-hidden"
                                                                                type="number" data-field={field.name}
                                                                                value={field.value}
                                                                                onchange={handleRequiredFieldChange}></lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isDate}>
                                                                            <lightning-input variant="label-hidden"
                                                                                type="date" data-field={field.name}
                                                                                value={field.value}
                                                                                onchange={handleRequiredFieldChange}></lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isDateTime}>
                                                                            <lightning-input variant="label-hidden"
                                                                                type="datetime" data-field={field.name}
                                                                                value={field.value}
                                                                                onchange={handleRequiredFieldChange}></lightning-input>
                                                                        </template>
                                                                        <template if:true={field.isReference}>
                                                                            <lightning-record-picker
                                                                                label="Search records"
                                                                                variant="label-hidden"
                                                                                placeholder="Search records here..."
                                                                                object-api-name={field.relatedObject}
                                                                                value={field.value}
                                                                                data-field={field.name}
                                                                                onchange={handleRecordPickerSelection}></lightning-record-picker>
                                                                        </template>
                                                                        <template if:true={field.isTextArea}>
                                                                            <lightning-textarea variant="label-hidden"
                                                                                data-field={field.name}
                                                                                value={field.value}
                                                                                onchange={handleRequiredFieldChange}></lightning-textarea>
                                                                        </template>
                                                                        <template if:true={field.isPicklist}>
                                                                            <lightning-combobox variant="label-hidden"
                                                                                data-field={field.name}
                                                                                value={field.value}
                                                                                options={field.picklistValues}
                                                                                onchange={handleRequiredFieldChange}
                                                                                dropdown-alignment="auto"></lightning-combobox>
                                                                        </template>
                                                                        <template if:true={field.isBoolean}>
                                                                            <lightning-input variant="label-hidden"
                                                                                type="checkbox" checked={field.value}
                                                                                data-field={field.name}
                                                                                onchange={handleRequiredCheckboxChange}></lightning-input>
                                                                        </template>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </template>
                                                        <template if:false={requiredFields.length}>
                                                            <tr>
                                                                <td class="slds-text-align_center" colspan="3">No
                                                                    required fields for Contact</td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                            <div class="exp-table-content exp-accordion-table-content"
                                                style="margin-top: 1rem;">
                                                <table class="slds-table webhook-phone-table">
                                                    <colgroup>
                                                        <col class="col-webhook-phone-label" />
                                                        <col class="col-webhook-phone-field" />
                                                    </colgroup>
                                                    <thead>
                                                        <tr>
                                                            <th scope="col" class="col-webhook-phone-label">
                                                                <div class="slds-truncate">Phone Field for Incoming
                                                                    WhatsApp Messages</div>
                                                            </th>
                                                            <th scope="col" class="col-webhook-phone-field"></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr>
                                                            <td class="col-webhook-phone-label"><span>Phone Field</span></td>
                                                            <td class="col-webhook-phone-field">
                                                                <template if:true={webhookPhoneFieldOptions.length}>
                                                                    <lightning-combobox variant="label-hidden"
                                                                        value={selectedPhoneFieldVal}
                                                                        options={webhookPhoneFieldOptions}
                                                                        onchange={handleWebhookPhoneComboChange}
                                                                        placeholder="Select Phone Field"
                                                                        dropdown-alignment="auto">
                                                                    </lightning-combobox>
                                                                </template>
                                                                <template if:false={webhookPhoneFieldOptions.length}>
                                                                    <p>No phone fields available for Contact.</p>
                                                                </template>
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── MODAL: Deactivate Confirmation (SLDS) ── -->
        <template if:true={isDeactivateModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-deactivate"
                aria-describedby="modal-content-deactivate" class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container">
                    <div class="slds-modal__close exp-close-icon-css" onclick={closeDeactivateModal} title="Close">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                fill="#1F2937" />
                        </svg>
                    </div>

                    <div class="slds-modal__header manual-modal-header">
                        <div class="manual-header-left">
                            <div class="manual-header-icon-box deactivation-icon-box">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DC2626"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                            </div>
                            <div class="manual-header-text">
                                <h3 id="modal-heading-deactivate" class="manual-modal-title">Deactivate Integration</h3>
                                <p class="manual-modal-subtitle">Disconnect your WhatsApp Business Account</p>
                            </div>
                        </div>
                    </div>

                    <div class="slds-modal__content slds-p-around_medium modal-body" id="modal-content-deactivate">
                        <p class="modal-message">Are you sure you want to deactivate WhatsApp integration? This will
                            disconnect your WhatsApp Business Account and you will need to set it up again to continue
                            using WhatsApp messaging.</p>
                    </div>

                    <div class="slds-modal__footer manual-modal-footer">
                        <button type="button" class="exp-white-btn-css" onclick={closeDeactivateModal}>
                            <svg width="12" height="12" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M2.53317 19.3333L0.666504 17.4667L8.13317 9.99999L0.666504 2.53332L2.53317 0.666656L9.99984 8.13332L17.4665 0.666656L19.3332 2.53332L11.8665 9.99999L19.3332 17.4667L17.4665 19.3333L9.99984 11.8667L2.53317 19.3333Z"
                                    fill="currentColor" />
                            </svg>
                            Cancel
                        </button>
                        <button type="button" class="exp-red-btn-css" onclick={confirmDeactivate}
                            disabled={isSubmitting}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                <path
                                    d="M6.2 5.8C4.2 7.3 3 9.6 3 12.2C3 17.1 7 21 12 21C17 21 21 17.1 21 12.2C21 9.6 19.8 7.3 17.8 5.8"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            </svg>
                            Deactivate
                        </button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
</template>
